<text x="747.0" y="324.0" class="ag" text-anchor="middle" >done · idle</text>
<path d="M1056 164V240" class="flow"/>
<path d="M966 276H840" class="flow"/>
<path d="M966 356H924V330H840" class="flow"/>
<text x="744" y="374" class="lb" text-anchor="middle" >shown per pane,</text>
<text x="744" y="392" class="lb" text-anchor="middle" >rolled up per workspace</text>
<rect x="624" y="446" width="552" height="370" rx="12" class="grp"/>
<circle cx="834.25" cy="469" r="11" class="num"/>
<text x="834.25" y="474" class="numt" text-anchor="middle" >3</text>
<text x="850.25" y="476" class="gt" text-anchor="start" >Control API</text>
<rect x="636" y="490" width="528" height="150" rx="9" class="sub"/>
<text x="900.0" y="514" class="st" text-anchor="middle" >Same socket the UI uses</text>
<rect x="654" y="538" width="230" height="64" rx="8" class="agent"/>
