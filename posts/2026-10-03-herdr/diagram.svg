<text x="473.0" y="140.0" class="ag" text-anchor="middle" >Direct attach</text>
<text x="473.0" y="160.0" class="ag" text-anchor="middle" >one terminal</text>
<rect x="36" y="226" width="528" height="178" rx="9" class="sub"/>
