<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr overview</title>
<desc id="d">1 Clients: a local window, a client over SSH to one or more machines, or a direct attach to one terminal. Clients draw the screen and send keys; ctrl+b q detaches and the agents keep running. 2 Server, one per session: each pane is a real terminal running an agent, read into screen state by libghostty-vt. A screen check against 22 agent manifests and the agents' own reports decide working, blocked, done or idle. 3 Control API: agents in panes, scripts and plugins call the server through the herdr CLI or a local socket to spawn panes, prompt agents and wait on them. 4 If the server stops, the processes are gone; herdr brings back what it can: live handoff during updates (experimental, --handoff), the agent's own resume (needs its integration), pane history (opt-in) and the saved layout in session.json.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
