<text x="1059.0" y="272.0" class="ag" text-anchor="middle" >Screen detector</text>
<text x="1059.0" y="292.0" class="ag" text-anchor="middle" >22 agent manifests</text>
<rect x="966" y="326" width="180" height="60" rx="8" class="agent"/>
