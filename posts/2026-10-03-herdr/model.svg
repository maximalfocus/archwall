<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr data model</title>
<desc id="d">1 Session: one herdr server with its own panes, sockets and saved state. herdr attaches to the default session; named sessions such as herdr session attach work are separate servers sharing one config file. 2 Workspace: the top-level container, one per repo, task or investigation. Its status rolls up from the agents inside it. IDs look like w1. 3 Tab: a layout inside a workspace, such as agents, logs or review, kept as a split tree; panes split right or down. IDs look like w1:t1. 4 Pane and agent: a pane is a real terminal with an ID like w1:p1. An agent is a process herdr recognises in a pane and may carry a name such as reviewer. Each pane saves its directory, label and agent session reference.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
