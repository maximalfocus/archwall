<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr clients</title>
<desc id="d">1 On this machine: run herdr; it starts the background server if none is running and attaches. ctrl+b q detaches and herdr reattaches. You can also SSH to a host and run herdr there, like tmux. 2 Remote attach: herdr --remote host. The remote server owns the panes and sends screens and session state over SSH; your local herdr draws the UI with your theme and keys. herdr asks before installing itself on the host. 3 Several machines: herdr machine add saves SSH hosts so Local and the hosts share one window. Only the chosen host streams screens; the others send status. Lost links retry, up to two minutes apart. Profiles store no passwords or keys. 4 One terminal: herdr agent attach or terminal attach puts one pane in your terminal, on Linux and macOS. Bridges can observe or control a pane over JSON lines. Client and server versions need not match.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
