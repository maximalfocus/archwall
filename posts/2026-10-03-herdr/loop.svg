<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr server loop</title>
<desc id="d">1 Wait for something: output from a pane, keys or clicks from a client, a request on the API socket, or a timer. 2 Apply it: update the shared state (panes, agents, layout) and re-check agent status from the screen and the agents' reports. 3 Scheduled jobs: save session.json 5 seconds after the last change, and drop short-lived labels whose time is up. 4 Draw and send: render only what some client can see; hidden panes still read their output so status stays current. Stream screens and session state to clients, then wait again. When the server stops it saves once more; on Linux with logind it asks for a short delay at shutdown to save.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="168.5" cy="43" r="14" class="num"/>
<text x="168.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="188.5" y="52" class="gt" text-anchor="start" >Wait for something</text>
<rect x="54" y="80" width="238" height="88" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="68" rx="2" fill="#5b6675"/>
<text x="176.0" y="119.0" class="ag" text-anchor="middle" >Pane output</text>
<text x="176.0" y="143.0" class="ag" text-anchor="middle" >from each terminal</text>
<rect x="308" y="80" width="238" height="88" rx="8" class="agent"/>
<rect x="308" y="90" width="5" height="68" rx="2" fill="#8a5cc7"/>
<text x="430.0" y="119.0" class="ag" text-anchor="middle" >Keys, clicks</text>
<text x="430.0" y="143.0" class="ag" text-anchor="middle" >from clients</text>
<rect x="54" y="188" width="238" height="88" rx="8" class="agent"/>
<rect x="54" y="198" width="5" height="68" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="227.0" class="ag" text-anchor="middle" >API requests</text>
<text x="176.0" y="251.0" class="ag" text-anchor="middle" >CLI, agents, plugins</text>
<rect x="308" y="188" width="238" height="88" rx="8" class="agent"/>
<rect x="308" y="198" width="5" height="68" rx="2" fill="#5b6675"/>
<text x="430.0" y="227.0" class="ag" text-anchor="middle" >Timers</text>
<text x="430.0" y="251.0" class="ag" text-anchor="middle" >saves, expiries</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="836.0" cy="43" r="14" class="num"/>
<text x="836.0" y="49" class="numt" text-anchor="middle" >2</text>
<text x="856.0" y="52" class="gt" text-anchor="start" >Apply it</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Update shared state</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >panes, agents, layout</text>
<rect x="654" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="194" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="903.0" y="219.0" class="ag" text-anchor="middle" >Re-check agent status</text>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >screen + reports</text>
<path d="M900.0 160V182" class="flow"/>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="795.5" cy="487" r="14" class="num"/>
<text x="795.5" y="493" class="numt" text-anchor="middle" >3</text>
<text x="815.5" y="496" class="gt" text-anchor="start" >Scheduled jobs</text>
<rect x="654" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Save session.json</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >5 s after the last change</text>
<rect x="654" y="628" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="638" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="903.0" y="663.0" class="ag" text-anchor="middle" >Drop expired labels</text>
<text x="903.0" y="687.0" class="ag" text-anchor="middle" >short-lived metadata</text>
<text x="900.0" y="760" class="lb" text-anchor="middle" >on stop: one last save</text>
<text x="900.0" y="788" class="lb" text-anchor="middle" >Linux + logind: delays shutdown to save</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="202.25" cy="487" r="14" class="num"/>
<text x="202.25" y="493" class="numt" text-anchor="middle" >4</text>
<text x="222.25" y="496" class="gt" text-anchor="start" >Draw and send</text>
<rect x="54" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Render what someone sees</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >hidden panes still update</text>
<rect x="54" y="628" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="638" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="663.0" class="ag" text-anchor="middle" >Stream to clients</text>
<text x="303.0" y="687.0" class="ag" text-anchor="middle" >screens + session state</text>
<path d="M300.0 604V626" class="flow"/>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >event</text>
<path d="M900.0 428V458" class="flow"/>
<text x="946.2" y="449" class="al" text-anchor="middle" >changes</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >due</text>
<path d="M84 460V430" class="flow"/>
<text x="154" y="449" class="al" text-anchor="middle" >wait again</text>
</svg>
