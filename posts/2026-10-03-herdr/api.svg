<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr control API</title>
<desc id="d">1 Who calls: an agent in a pane, using the herdr skill if installed; scripts; plugins. Every pane gets HERDR_PANE_ID and HERDR_SOCKET_PATH. 2 How it gets there: the herdr CLI wraps every call; underneath is a local socket with one JSON request per line (a Unix socket, owner-only, or a Windows named pipe). herdr api schema prints the contract. 3 What it can do: layout (workspace, tab, split), panes (run, read, wait for output), agents (start, prompt, wait until idle, done or blocked), and event subscriptions. 4 What comes back: a JSON reply with IDs to capture, and an event stream of status changes. A reader that falls behind gets events_lost and re-reads a snapshot.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
