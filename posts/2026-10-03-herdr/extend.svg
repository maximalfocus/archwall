<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr integrations and plugins</title>
<desc id="d">1 Install an integration: herdr integration install claude writes a small hook into the agent's own config; 18 agents have one, and letta is experimental and CLI only. 2 What it reports: the session ID so herdr can resume the conversation, and for 6 agents the state too. 3 Agents that support herdr make the same calls themselves: report state with an optional --seq, report the resume command, and release the pane on exit. No herdr change is needed. 4 Plugins: a herdr-plugin.toml declares actions, event hooks, panes and startup hooks; the whole herdr CLI is the plugin API. Plugins run as you and are not sandboxed; install shows a preview first.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="141.5" cy="43" r="14" class="num"/>
<text x="141.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="161.5" y="52" class="gt" text-anchor="start" >Install an integration</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#d64545"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >herdr integration install claude</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >opt-in, per agent</text>
<rect x="54" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="194" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="219.0" class="ag" text-anchor="middle" >Writes a hook</text>
<text x="303.0" y="243.0" class="ag" text-anchor="middle" >into the agent's own config</text>
<path d="M300.0 160V182" class="flow"/>
<text x="300.0" y="316" class="lb" text-anchor="middle" >18 agents have one</text>
<text x="300.0" y="344" class="lb" text-anchor="middle" >letta: experimental, CLI only</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="788.75" cy="43" r="14" class="num"/>
<text x="788.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="808.75" y="52" class="gt" text-anchor="start" >What it reports</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Session ID</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >so herdr can resume</text>
<rect x="654" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="194" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="903.0" y="219.0" class="ag" text-anchor="middle" >State</text>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >6 integrations also send it</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="721.25" cy="487" r="14" class="num"/>
<text x="721.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="741.25" y="496" class="gt" text-anchor="start" >Agents that support herdr</text>
<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >report-agent</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >state, optional --seq</text>
<rect x="654" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="651.0" class="ag" text-anchor="middle" >Resume command</text>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >re-run after a restart</text>
<rect x="654" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="726" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >release-agent</text>
<text x="903.0" y="771.0" class="ag" text-anchor="middle" >when the user quits</text>
<text x="900.0" y="830" class="lb" text-anchor="middle" >no change to herdr needed</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="242.75" cy="487" r="14" class="num"/>
<text x="242.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="496" class="gt" text-anchor="start" >Plugins</text>
<rect x="54" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="555.0" class="ag" text-anchor="middle" >herdr-plugin.toml</text>
<text x="303.0" y="579.0" class="ag" text-anchor="middle" >actions, event hooks, panes</text>
<rect x="54" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="630" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="651.0" class="ag" text-anchor="middle" >Startup hooks</text>
<text x="303.0" y="675.0" class="ag" text-anchor="middle" >run after the session is restored</text>
<rect x="54" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="726" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="747.0" class="ag" text-anchor="middle" >Runs as you, not sandboxed</text>
<text x="303.0" y="771.0" class="ag" text-anchor="middle" >install shows a preview first</text>
<text x="300.0" y="830" class="lb" text-anchor="middle" >the whole herdr CLI is the plugin API</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >hook runs</text>
<path d="M900.0 428V458" class="flow"/>
<text x="960.0" y="449" class="al" text-anchor="middle" >same calls</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >same CLI</text>
</svg>
