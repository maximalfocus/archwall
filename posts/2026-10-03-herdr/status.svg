<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">herdr agent status</title>
<desc id="d">1 Which agent: herdr looks at the foreground process in each pane; it knows 24 agents such as claude, codex and pi. A wrapper that hides the agent can name it with the HERDR_AGENT variable. 2 Read the screen: the live bottom of the pane and its title, not the part you scrolled to, checked against rules in a manifest per agent (22 manifests). Rule updates come from herdr.dev; a local file wins. 3 The agent's own reports: 6 integrations also report state, and some agents report on their own. While they report, herdr uses that instead of the screen. A sequence number drops late reports. 4 Result: working, blocked (needs a decision), done (finished, not seen yet), idle (seen, ready) or unknown. A known agent with no matching rule shows idle. Sound is on by default; popups are opt-in.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="209.0" cy="43" r="14" class="num"/>
<text x="209.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="229.0" y="52" class="gt" text-anchor="start" >Which agent?</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Foreground process</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >in each pane</text>
<rect x="54" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="194" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="303.0" y="219.0" class="ag" text-anchor="middle" >24 agents known</text>
<text x="303.0" y="243.0" class="ag" text-anchor="middle" >claude, codex, pi …</text>
<path d="M300.0 160V182" class="flow"/>
<text x="300.0" y="316" class="lb" text-anchor="middle" >wrapper hides it? set HERDR_AGENT</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="788.75" cy="43" r="14" class="num"/>
<text x="788.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="808.75" y="52" class="gt" text-anchor="start" >Read the screen</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Live bottom + title</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >not where you scrolled</text>
<rect x="654" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="194" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="903.0" y="219.0" class="ag" text-anchor="middle" >Manifest rules</text>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >22 agents, AND / OR checks</text>
<path d="M900.0 160V182" class="flow"/>
<text x="900.0" y="316" class="lb" text-anchor="middle" >rule updates from herdr.dev</text>
<text x="900.0" y="344" class="lb" text-anchor="middle" >a local override file wins</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="734.75" cy="487" r="14" class="num"/>
<text x="734.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="754.75" y="496" class="gt" text-anchor="start" >The agent's own reports</text>
<rect x="654" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Integrations</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >6 also report state</text>
<rect x="654" y="628" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="638" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="903.0" y="663.0" class="ag" text-anchor="middle" >Agents that support herdr</text>
<text x="903.0" y="687.0" class="ag" text-anchor="middle" >report by themselves</text>
<text x="900.0" y="760" class="lb" text-anchor="middle" >while they report, the screen check waits</text>
<text x="900.0" y="788" class="lb" text-anchor="middle" >optional --seq drops late reports</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="249.5" cy="487" r="14" class="num"/>
<text x="249.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="496" class="gt" text-anchor="start" >Result</text>
<rect x="54" y="524" width="238" height="64" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="176.0" y="563.0" class="ag" text-anchor="middle" >working</text>
<rect x="308" y="524" width="238" height="64" rx="8" class="agent"/>
<rect x="308" y="534" width="5" height="44" rx="2" fill="#d64545"/>
<text x="430.0" y="551.0" class="ag" text-anchor="middle" >blocked</text>
<text x="430.0" y="575.0" class="ag" text-anchor="middle" >needs a decision</text>
<rect x="54" y="600" width="238" height="64" rx="8" class="agent"/>
<rect x="54" y="610" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="176.0" y="627.0" class="ag" text-anchor="middle" >done</text>
<text x="176.0" y="651.0" class="ag" text-anchor="middle" >finished, not seen</text>
<rect x="308" y="600" width="238" height="64" rx="8" class="agent"/>
<rect x="308" y="610" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="430.0" y="627.0" class="ag" text-anchor="middle" >idle</text>
<text x="430.0" y="651.0" class="ag" text-anchor="middle" >seen, ready</text>
<rect x="54" y="676" width="238" height="64" rx="8" class="agent"/>
<rect x="54" y="686" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="176.0" y="703.0" class="ag" text-anchor="middle" >unknown</text>
<text x="176.0" y="727.0" class="ag" text-anchor="middle" >can't tell</text>
<text x="300.0" y="790" class="lb" text-anchor="middle" >known agent, no rule matched: idle</text>
<text x="300.0" y="820" class="lb" text-anchor="middle" >sound on by default · popups opt-in</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >agent kind</text>
<path d="M900.0 428V458" class="flow"/>
<text x="969.2" y="449" class="al" text-anchor="middle" >screen state</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >final state</text>
</svg>
