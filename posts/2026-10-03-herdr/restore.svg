<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="249.5" cy="43" r="14" class="num"/>
<text x="249.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="269.5" y="52" class="gt" text-anchor="start" >Detach</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Server keeps running</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >every process too</text>
<rect x="54" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="194" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="219.0" class="ag" text-anchor="middle" >herdr</text>
<text x="303.0" y="243.0" class="ag" text-anchor="middle" >reattaches, nothing lost</text>
<path d="M300.0 160V182" class="flow"/>
<text x="300.0" y="316" class="lb" text-anchor="middle" >the strongest path</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="782.0" cy="43" r="14" class="num"/>
<text x="782.0" y="49" class="numt" text-anchor="middle" >2</text>
<text x="802.0" y="52" class="gt" text-anchor="start" >Saved as it runs</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >session.json</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >5 s after a change</text>
<rect x="654" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="194" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="903.0" y="219.0" class="ag" text-anchor="middle" >48 older layouts</text>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >at most one per 15 min</text>
<text x="900.0" y="316" class="lb" text-anchor="middle" >unreadable file? copied aside first</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
