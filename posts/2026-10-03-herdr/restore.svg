<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >Layout back</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >workspaces, tabs, panes, folders</text>
<rect x="654" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="651.0" class="ag" text-anchor="middle" >Agent resume</text>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >on by default, agent must report it</text>
<rect x="654" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="726" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >Pane history</text>
<text x="903.0" y="771.0" class="ag" text-anchor="middle" >opt-in, may hold secrets</text>
<text x="900.0" y="830" class="lb" text-anchor="middle" >else: fresh shell, same folder</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="242.75" cy="487" r="14" class="num"/>
<text x="242.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="496" class="gt" text-anchor="start" >Updates</text>
<rect x="54" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >herdr update</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >compatible servers keep running</text>
<rect x="54" y="628" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="638" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="663.0" class="ag" text-anchor="middle" >herdr update --handoff</text>
<text x="303.0" y="687.0" class="ag" text-anchor="middle" >moves live panes, experimental</text>
<text x="300.0" y="760" class="lb" text-anchor="middle" >handoff: best effort</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >meanwhile</text>
<path d="M900.0 428V458" class="flow"/>
<text x="969.2" y="449" class="al" text-anchor="middle" >after a stop</text>
</svg>
