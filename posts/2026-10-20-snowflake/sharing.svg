<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Snowflake sharing: access without a data copy</title>
<desc id="d">A provider selects database objects and grants them to a share, then adds consumer accounts. The consumer creates a read-only database from that share and grants users access through roles. Snowflake services and metadata expose the provider data without transferring a copy between accounts. The consumer uses its own virtual warehouse to query the shared data.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="24" width="552" height="386" rx="12" class="grp"/>
<text x="300.0" y="60" class="gt" text-anchor="middle" >Provider account</text>
<rect x="54" y="90" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="100" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="129.0" class="ag" text-anchor="middle" >Select database objects</text>
<rect x="54" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="180" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="209.0" class="ag" text-anchor="middle" >Grant to share</text>
<rect x="54" y="250" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="260" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="289.0" class="ag" text-anchor="middle" >Add consumer accounts</text>
<rect x="624" y="24" width="552" height="386" rx="12" class="grp"/>
<text x="900.0" y="60" class="gt" text-anchor="middle" >Services · metadata</text>
<rect x="654" y="112" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="122" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="903.0" y="157.0" class="ag" text-anchor="middle" >Share definition</text>
<rect x="654" y="218" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="228" width="5" height="56" rx="2" fill="#d64545"/>
<text x="903.0" y="263.0" class="ag" text-anchor="middle" >Access control</text>
<text x="900.0" y="358" class="lb" text-anchor="middle" >No data copied between accounts</text>
<rect x="624" y="494" width="552" height="382" rx="12" class="grp"/>
<text x="900.0" y="530" class="gt" text-anchor="middle" >Consumer account</text>
<rect x="654" y="574" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="584" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="903.0" y="619.0" class="ag" text-anchor="middle" >Read-only database</text>
<rect x="654" y="680" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="690" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="725.0" class="ag" text-anchor="middle" >Own virtual warehouse</text>
<text x="900.0" y="824" class="lb" text-anchor="middle" >Roles control reader access</text>
<rect x="24" y="494" width="552" height="382" rx="12" class="grp"/>
<text x="300.0" y="530" class="gt" text-anchor="middle" >Provider data</text>
<rect x="54" y="594" width="492" height="82" rx="8" class="agent"/>
<rect x="54" y="604" width="5" height="62" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="642.0" class="ag" text-anchor="middle" >Shared source objects</text>
<text x="300.0" y="824" class="lb" text-anchor="middle" >Provider keeps the data</text>
<path d="M576 242H624" class="flow"/>
<text x="600" y="224" class="al" text-anchor="middle" >grants</text>
<path d="M900 410V494" class="flow"/>
<text x="900" y="455" class="al" text-anchor="middle" >share access</text>
<path d="M624 690H576" class="flow"/>
<text x="600" y="670" class="al" text-anchor="middle" >reads source</text>
</svg>
