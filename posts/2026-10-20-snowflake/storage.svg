<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Snowflake storage: table choices and pruning</title>
<desc id="d">Snowflake tables store compressed columns in cloud storage as micro-partitions. Their metadata records column ranges and helps prune partitions and columns during a query. Iceberg tables use external cloud storage managed by the customer. Hybrid tables use index-based reads and writes with row locking for transactional workloads.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
