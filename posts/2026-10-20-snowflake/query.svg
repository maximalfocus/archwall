<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Snowflake query: plan, execute, return</title>
<desc id="d">A client sends a SQL statement to cloud services. Services authenticate and control access, parse and optimize the query, then dispatch it. An independent virtual warehouse executes the work using local data portions and shared persisted storage. Micro-partition metadata helps prune irrelevant partitions and columns. Results return to the client. Warehouses can auto-resume and auto-suspend when configured.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="365" y="16" width="470" height="52" rx="26.0" class="human"/>
<text x="600.0" y="48.0" class="q" text-anchor="middle" >Client sends SQL</text>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="195.5" cy="111" r="14" class="num"/>
<text x="195.5" y="117" class="numt" text-anchor="middle" >1</text>
<text x="215.5" y="120" class="gt" text-anchor="start" >Cloud services</text>
<rect x="54" y="150" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="160" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="189.0" class="ag" text-anchor="middle" >Authenticate · authorize</text>
<rect x="54" y="230" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="240" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="269.0" class="ag" text-anchor="middle" >Parse · optimize</text>
<rect x="54" y="310" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="320" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="349.0" class="ag" text-anchor="middle" >Dispatch query</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="775.25" cy="111" r="14" class="num"/>
<text x="775.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="795.25" y="120" class="gt" text-anchor="start" >Virtual warehouse</text>
<rect x="654" y="162" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="172" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="207.0" class="ag" text-anchor="middle" >Independent compute cluster</text>
<rect x="654" y="268" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="278" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="313.0" class="ag" text-anchor="middle" >Parallel query workers</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Queues when capacity is used</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="775.25" cy="527" r="14" class="num"/>
<text x="775.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="795.25" y="536" class="gt" text-anchor="start" >Shared table data</text>
<rect x="654" y="572" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="582" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="903.0" y="617.0" class="ag" text-anchor="middle" >Micro-partition metadata</text>
<rect x="654" y="678" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="688" width="5" height="56" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="723.0" class="ag" text-anchor="middle" >Compressed column data</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Prune partitions and columns</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="249.5" cy="527" r="14" class="num"/>
<text x="249.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="536" class="gt" text-anchor="start" >Result</text>
<rect x="54" y="600" width="492" height="82" rx="8" class="agent"/>
<rect x="54" y="610" width="5" height="62" rx="2" fill="#5b6675"/>
<text x="303.0" y="636.0" class="ag" text-anchor="middle" >Warehouse returns</text>
<text x="303.0" y="660.0" class="ag" text-anchor="middle" >rows to client</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Warehouse can pause when idle</text>
<path d="M600 68V76H300V84" class="flow"/>
<path d="M576 300H624" class="flow"/>
<text x="600" y="281" class="al" text-anchor="middle" >plan</text>
<path d="M900 464V500" class="flow"/>
<text x="900" y="487" class="al" text-anchor="middle" >reads</text>
<path d="M624 682H576" class="flow"/>
<text x="600" y="663" class="al" text-anchor="middle" >query output</text>
<path d="M24 700H12V40H365" class="flow back"/>
<text x="170" y="29" class="al" text-anchor="middle" >result</text>
</svg>
