<rect x="54" y="678" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="688" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="711.0" class="ag" text-anchor="middle" >Snowpipe Streaming</text>
<text x="303.0" y="735.0" class="ag" text-anchor="middle" >No file stage</text>
<text x="300.0" y="824" class="lb" text-anchor="middle" >Rows go straight to a table</text>
<path d="M576 220H624" class="flow"/>
