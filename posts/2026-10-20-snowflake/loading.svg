<rect x="24" y="24" width="552" height="380" rx="12" class="grp"/>
<text x="300.0" y="60" class="gt" text-anchor="middle" >Files in cloud storage</text>
<rect x="54" y="104" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="114" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="303.0" y="149.0" class="ag" text-anchor="middle" >Internal stage</text>
<rect x="54" y="210" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="220" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >External stage</text>
<text x="300.0" y="352" class="lb" text-anchor="middle" >Files wait in a stage</text>
<rect x="624" y="24" width="552" height="380" rx="12" class="grp"/>
<text x="900.0" y="60" class="gt" text-anchor="middle" >File loading choices</text>
<rect x="654" y="104" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="114" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="137.0" class="ag" text-anchor="middle" >COPY INTO</text>
<text x="903.0" y="161.0" class="ag" text-anchor="middle" >Chosen warehouse</text>
<rect x="654" y="210" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="220" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >Snowpipe</text>
<text x="903.0" y="267.0" class="ag" text-anchor="middle" >Serverless compute</text>
<text x="900.0" y="352" class="lb" text-anchor="middle" >Batch or continuous file arrival</text>
<rect x="624" y="492" width="552" height="384" rx="12" class="grp"/>
