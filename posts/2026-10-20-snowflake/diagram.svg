<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Snowflake: shared data, separate compute</title>
<desc id="d">Clients send SQL and management requests to cloud services. Cloud services authenticate, manage metadata, plan queries and dispatch work. Independent virtual warehouses execute against shared storage. Loading writes Snowflake tables; shares expose selected objects to other accounts through services and metadata without copying data.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
