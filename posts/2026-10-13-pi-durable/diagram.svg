<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">pi-durable: the parts</title>
<desc id="d">The host supplies an application UI, models, extensions and settings. Harness admits input and schedules generation, tool and compaction tasks. Session atomically commits transcripts, task checkpoints, submissions and Chord documents to a selected storage backend. Committed changes feed conversation views and agent events back to the host. Storage choices are memory, Node SQLite, JSONL and Cloudflare Durable Object SQLite. This package is experimental.</desc>
