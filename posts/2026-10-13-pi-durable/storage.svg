<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Storage backends and ownership</title>
<desc id="d">The host chooses a storage implementation. Memory is temporary and stores detached copies. Node SQLite stores records and document bases plus deltas; a SQL transaction is a Session commit. Its WAL and synchronous NORMAL settings cover process crashes, while a recent commit may be lost on host or power failure. Cloudflare uses the SQLite storage of a Durable Object with its transactions. JSONL writes prepared sidecars and then a main commit marker; recovery keeps confirmed records. JSONL fsync is optional and does not promise an acknowledged tail survives power failure. It also retains history in memory. A storage has one process owner and no cross-process locking. Custom backends and environments can use shared conformance tests.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
