<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">What the host installs</title>
<desc id="d">The host installs named extensions into an in-memory registry. Extensions supply tools, prompt sections, hooks, wrappers and custom tasks. Conversations store names and agent choices, not extension code; reinstall code after restart. Reload replaces an extension in place; already running code keeps its implementation. CodingTools is installed explicitly and uses ExecutionEnv for files and processes. An optional Photon image processor converts and resizes read images. Optional tool-search loads deferred tools for a later model request. Optional codemode takes a host-provided sandbox: scripts discover and call nested tools, and start data plus a result journal let deterministic execution replay after a restart. </desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
