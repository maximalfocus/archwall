<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">State and owned work</title>
<desc id="d">Immutable entries form a conversation transcript. Forks inherit parent entries through a selected entry and continue independently. Reset changes the model context while retaining older stored entries. Compaction replaces older context with a summary. Typed JSON documents track live progress, inbox, agent configuration, provider identity, usage and application state. Chord delivers committed views and document changes; agent events and the task graph are derived views. Tasks may own child tasks or conversations; waiting and completing states keep ownership structured. Abort proceeds from owned children to parents. Background tasks form a boundary for parent abort and idle waits.</desc>
