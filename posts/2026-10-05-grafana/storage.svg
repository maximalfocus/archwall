<text x="303.0" y="135.0" class="ag" text-anchor="middle" >/api/..., one style per feature</text>
<rect x="54" y="176" width="492" height="72" rx="8" class="agent"/>
<text x="303.0" y="207.0" class="ag" text-anchor="middle" >Resource API</text>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >/apis/..., versioned, Kubernetes-style</text>
<rect x="54" y="272" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="282" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="303.0" class="ag" text-anchor="middle" >Plan</text>
<text x="303.0" y="327.0" class="ag" text-anchor="middle" >/apis is meant to replace /api</text>
<text x="300.0" y="384" class="lb" text-anchor="middle" >dashboards and folders reach unified</text>
<text x="300.0" y="410" class="lb" text-anchor="middle" >storage through either door</text>
<rect x="624" y="16" width="552" height="416" rx="12" class="grp"/>
<circle cx="788.75" cy="43" r="14" class="num"/>
<text x="788.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="808.75" y="52" class="gt" text-anchor="start" >Unified storage</text>
