<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Grafana: what it keeps</title>
<desc id="d">1 Two API doors: the classic API under /api, where each feature has its own style, and the newer resource API under /apis, versioned and shaped like Kubernetes. /apis is meant to replace /api over time. 2 Unified storage, behind /apis and, for these, /api too: dashboards, folders, playlists, short links and preferences; every change is kept with a version number, and an edit made from an old version is refused. 4 Classic tables, behind /api: users, organisations, teams, data sources, alert rules, annotations, snapshots, stars and library panels. 3 Both end up in one SQL database: a SQLite file by default, fine for one server, or MySQL or Postgres, needed when several servers share it. The cache also lives in this database by default; Redis or Memcached are options.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
