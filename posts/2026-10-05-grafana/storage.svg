<text x="903.0" y="319.0" class="ag" text-anchor="middle" >no silent overwrite</text>
<rect x="624" y="456" width="552" height="404" rx="12" class="grp"/>
<circle cx="782.0" cy="483" r="14" class="num"/>
<text x="782.0" y="489" class="numt" text-anchor="middle" >3</text>
<text x="802.0" y="492" class="gt" text-anchor="start" >One SQL database</text>
<rect x="654" y="520" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="530" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="551.0" class="ag" text-anchor="middle" >SQLite file</text>
<text x="903.0" y="575.0" class="ag" text-anchor="middle" >the default, fine for one server</text>
<rect x="654" y="616" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="626" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="647.0" class="ag" text-anchor="middle" >MySQL or Postgres</text>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >for several servers sharing it</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >cache: here by default,</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >or Redis / Memcached</text>
<rect x="24" y="456" width="552" height="404" rx="12" class="grp"/>
<circle cx="195.5" cy="483" r="14" class="num"/>
<text x="195.5" y="489" class="numt" text-anchor="middle" >4</text>
<text x="215.5" y="492" class="gt" text-anchor="start" >Classic tables</text>
<rect x="54" y="520" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="530" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >Users, organisations, teams</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >data sources, alert rules</text>
<rect x="54" y="616" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="626" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="647.0" class="ag" text-anchor="middle" >Annotations, snapshots</text>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >stars, library panels</text>
<path d="M576 156H622" class="flow"/>
<text x="600" y="144" class="al" text-anchor="middle" >both</text>
<path d="M300.0 432V454" class="flow"/>
<text x="334.0" y="453" class="al" text-anchor="middle" >/api</text>
<path d="M900.0 432V454" class="flow"/>
<text x="936.0" y="453" class="al" text-anchor="middle" >rows</text>
<path d="M576 656H622" class="flow"/>
<text x="600" y="644" class="al" text-anchor="middle" >rows</text>
</svg>
