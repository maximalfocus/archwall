<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Grafana overview</title>
<desc id="d">People use the web app in a browser; scripts and tools use the HTTP APIs; config files and Git repositories can load dashboards and settings. 1 Ways in: the web app, the HTTP APIs, files and Git. 2 The Grafana server is one program: sign-in and permissions check every request, dashboards and folders are saved as JSON documents, the query engine asks data sources and can do maths on the answers, and alerting checks rules on a timer. 3 Your data stays where it is: data source plugins talk to metrics, logs and traces stores such as Prometheus, Loki and Tempo, and to databases and clouds such as MySQL, Postgres and CloudWatch. Your data lives in your own systems and panels ask them again on every load. 4 What Grafana keeps and sends: its own database (a SQLite file by default, or MySQL or Postgres), alert notifications to 23 kinds of contact point such as Slack, email and PagerDuty, and an optional image renderer that runs as a separate service.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
