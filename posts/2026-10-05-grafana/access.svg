<circle cx="175.25" cy="483" r="14" class="num"/>
<text x="175.25" y="489" class="numt" text-anchor="middle" >4</text>
<text x="195.25" y="492" class="gt" text-anchor="start" >Secrets kept safe</text>
<rect x="54" y="520" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="530" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >Data source passwords</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >encrypted before saving</text>
<rect x="54" y="612" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="622" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="643.0" class="ag" text-anchor="middle" >Never sent to the browser</text>
<text x="303.0" y="667.0" class="ag" text-anchor="middle" >the server adds them to calls</text>
<rect x="54" y="704" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="714" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="735.0" class="ag" text-anchor="middle" >Change secret_key</text>
<text x="303.0" y="759.0" class="ag" text-anchor="middle" >the default is the same everywhere</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >external key vaults: Enterprise</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >identity</text>
