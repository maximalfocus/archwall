<circle cx="788.75" cy="483" r="14" class="num"/>
<text x="788.75" y="489" class="numt" text-anchor="middle" >3</text>
<text x="808.75" y="492" class="gt" text-anchor="start" >What you may do</text>
<rect x="654" y="520" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="530" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="551.0" class="ag" text-anchor="middle" >Role per organisation</text>
<text x="903.0" y="575.0" class="ag" text-anchor="middle" >None · Viewer · Editor · Admin</text>
<rect x="654" y="612" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="622" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="643.0" class="ag" text-anchor="middle" >Folder and dashboard rights</text>
<text x="903.0" y="667.0" class="ag" text-anchor="middle" >view, edit, admin</text>
<rect x="654" y="704" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="714" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="735.0" class="ag" text-anchor="middle" >Server admin</text>
<text x="903.0" y="759.0" class="ag" text-anchor="middle" >manages every organisation</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >custom roles, data source rights: Enterprise</text>
