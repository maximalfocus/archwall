<text x="303.0" y="111.0" class="ag" text-anchor="middle" >Username + password</text>
<text x="303.0" y="135.0" class="ag" text-anchor="middle" >Grafana's own users, or LDAP</text>
<rect x="54" y="176" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="186" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="207.0" class="ag" text-anchor="middle" >Single sign-on</text>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >GitHub, Google, Okta, Azure AD ...</text>
<rect x="54" y="272" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="282" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="303.0" class="ag" text-anchor="middle" >Tokens for scripts</text>
<text x="303.0" y="327.0" class="ag" text-anchor="middle" >service account tokens</text>
<text x="300.0" y="384" class="lb" text-anchor="middle" >SAML: Enterprise · anonymous, JWT,</text>
<text x="300.0" y="410" class="lb" text-anchor="middle" >auth proxy: off by default</text>
<rect x="624" y="16" width="552" height="416" rx="12" class="grp"/>
<circle cx="815.75" cy="43" r="14" class="num"/>
<text x="815.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="835.75" y="52" class="gt" text-anchor="start" >Who you are</text>
