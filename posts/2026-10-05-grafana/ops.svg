<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Grafana: running it</title>
<desc id="d">1 One program: grafana server serves the web app and the APIs on port 3000; it ships as Docker images, deb and rpm packages, and Windows and Mac builds; the open-source edition is AGPLv3 and Enterprise is a separate build. 2 Several servers: a load balancer spreads users across copies of Grafana that share one MySQL or Postgres database and one cache. 3 Keep them in step: alerting servers gossip on port 9094 or use Redis; live updates need Redis, otherwise they work on one server only; each server builds its own search index. 4 Watching Grafana itself: metrics for Prometheus at /metrics, OpenTelemetry tracing off by default, logs, and 398 feature flags of which 59 are generally available. Usage stats go to stats.grafana.org by default.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
