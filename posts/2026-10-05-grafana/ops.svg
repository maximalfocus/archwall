<text x="235.75" y="52" class="gt" text-anchor="start" >One program</text>
<rect x="54" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="111.0" class="ag" text-anchor="middle" >grafana server</text>
<text x="303.0" y="135.0" class="ag" text-anchor="middle" >web app + APIs on port 3000</text>
<rect x="54" y="176" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="186" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="207.0" class="ag" text-anchor="middle" >Packages</text>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >Docker, deb, rpm, Windows, Mac</text>
<rect x="54" y="272" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="282" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="303.0" class="ag" text-anchor="middle" >Two editions</text>
<text x="303.0" y="327.0" class="ag" text-anchor="middle" >open source (AGPLv3), Enterprise</text>
<rect x="624" y="16" width="552" height="416" rx="12" class="grp"/>
<circle cx="788.75" cy="43" r="14" class="num"/>
<text x="788.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="808.75" y="52" class="gt" text-anchor="start" >Several servers</text>
