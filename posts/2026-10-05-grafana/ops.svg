<text x="903.0" y="551.0" class="ag" text-anchor="middle" >Alerting</text>
<text x="903.0" y="575.0" class="ag" text-anchor="middle" >gossip on port 9094, or Redis</text>
<rect x="654" y="612" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="622" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="643.0" class="ag" text-anchor="middle" >Live streaming</text>
<text x="903.0" y="667.0" class="ag" text-anchor="middle" >needs Redis, else one server</text>
<rect x="654" y="704" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="714" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="735.0" class="ag" text-anchor="middle" >Search index</text>
<text x="903.0" y="759.0" class="ag" text-anchor="middle" >each server builds its own</text>
<rect x="24" y="456" width="552" height="404" rx="12" class="grp"/>
<circle cx="182.0" cy="483" r="14" class="num"/>
<text x="182.0" y="489" class="numt" text-anchor="middle" >4</text>
<text x="202.0" y="492" class="gt" text-anchor="start" >Watching Grafana</text>
<rect x="54" y="520" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="530" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >/metrics</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >for Prometheus to scrape</text>
<rect x="54" y="612" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="622" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="643.0" class="ag" text-anchor="middle" >Tracing</text>
<text x="303.0" y="667.0" class="ag" text-anchor="middle" >OpenTelemetry, off by default</text>
<rect x="54" y="704" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="714" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="735.0" class="ag" text-anchor="middle" >Feature flags</text>
<text x="303.0" y="759.0" class="ag" text-anchor="middle" >398 in all, 59 generally available</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >usage stats go to stats.grafana.org by default</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >scale out</text>
<path d="M900.0 432V454" class="flow"/>
<text x="946.2" y="453" class="al" text-anchor="middle" >in sync</text>
</svg>
