<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi packages</title>
<desc id="d">The app: pi-coding-agent is the pi command, with sessions, tools and the four ways in; pi-tui draws the terminal UI. It uses the engine: pi-agent-core runs the agent loop on top of pi-ai, the one API over many model providers, which reports through pi-telemetry's tracing contracts. It also uses two tool helpers through its built-in extensions: pi-codemode runs model-written JavaScript in a QuickJS sandbox, and pi-mcp is a standalone MCP client. Experimental and for development only: chord, pi-durable, pi-protocol, pi-server and pi-client serve remote sessions through the pi server and pi client commands, which only run with PI_EXPERIMENTAL=1 and are not in the published CLI.</desc>
