<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi agent loop</title>
<desc id="d">1 Input: your prompt starts a run. A steering message typed while it works goes in after the current turn; a follow-up goes in once the agent has nothing left to do. 2 Call the model: the request is rebuilt before every call, and the model streams back text and tool calls. 3 Run the tools: each call is checked one by one, where extension hooks can block it, then the allowed calls run in parallel by default, and the results are recorded in the original order. 4 Next: tool results or queued messages start another turn; if the context is near full pi compacts it first. With nothing left the run ends.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="256.25" cy="43" r="14" class="num"/>
<text x="256.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="276.25" y="52" class="gt" text-anchor="start" >Input</text>
<rect x="54" y="88" width="492" height="76" rx="8" class="human"/>
<text x="303.0" y="121.0" class="ag" text-anchor="middle" >Your prompt</text>
<text x="303.0" y="145.0" class="ag" text-anchor="middle" >starts a run</text>
<rect x="54" y="200" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="56" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="233.0" class="ag" text-anchor="middle" >Steering</text>
<text x="303.0" y="257.0" class="ag" text-anchor="middle" >goes in after this turn</text>
<rect x="54" y="312" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="322" width="5" height="56" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="345.0" class="ag" text-anchor="middle" >Follow-up</text>
<text x="303.0" y="369.0" class="ag" text-anchor="middle" >goes in when all is done</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="795.5" cy="43" r="14" class="num"/>
<text x="795.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="52" class="gt" text-anchor="start" >Call the model</text>
<rect x="654" y="88" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="98" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="903.0" y="121.0" class="ag" text-anchor="middle" >Build the request</text>
<text x="903.0" y="145.0" class="ag" text-anchor="middle" >fresh every turn</text>
<rect x="654" y="212" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="222" width="5" height="56" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="245.0" class="ag" text-anchor="middle" >Model answers</text>
<text x="903.0" y="269.0" class="ag" text-anchor="middle" >streams text + tool calls</text>
<path d="M900.0 164V212" class="flow"/>
<text x="664" y="340" class="lb" text-anchor="start" >no tool calls and no queued</text>
<text x="664" y="366" class="lb" text-anchor="start" >messages: the run ends</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="802.25" cy="487" r="14" class="num"/>
<text x="802.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="822.25" y="496" class="gt" text-anchor="start" >Run the tools</text>
<rect x="654" y="524" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="56" rx="2" fill="#d64545"/>
<text x="903.0" y="557.0" class="ag" text-anchor="middle" >Check each call</text>
<text x="903.0" y="581.0" class="ag" text-anchor="middle" >one by one</text>
<rect x="654" y="630" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="640" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="663.0" class="ag" text-anchor="middle" >Run them</text>
<text x="903.0" y="687.0" class="ag" text-anchor="middle" >in parallel by default</text>
<rect x="654" y="736" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="746" width="5" height="56" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="769.0" class="ag" text-anchor="middle" >Record results</text>
<text x="903.0" y="793.0" class="ag" text-anchor="middle" >in the original order</text>
<path d="M900.0 600V630" class="flow"/>
<path d="M900.0 706V736" class="flow"/>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="222.5" cy="487" r="14" class="num"/>
<text x="222.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="242.5" y="496" class="gt" text-anchor="start" >Next turn?</text>
<rect x="54" y="532" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="56" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="565.0" class="ag" text-anchor="middle" >Context near full?</text>
<text x="303.0" y="589.0" class="ag" text-anchor="middle" >compact first</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="683.0" class="ag" text-anchor="middle" >Start another turn</text>
<path d="M300.0 608V644" class="flow"/>
<text x="300.0" y="760" class="lb" text-anchor="middle" >extension hooks can block a call,</text>
<text x="300.0" y="786" class="lb" text-anchor="middle" >change a result or ask for one more turn</text>
<path d="M576 116H654" class="flow"/>
<text x="600" y="104" class="al" text-anchor="middle" >message</text>
<path d="M1116 288V524" class="flow"/>
<text x="1056" y="450" class="al" text-anchor="middle" >tool calls</text>
<path d="M624 774H576" class="flow"/>
<text x="600" y="762" class="al" text-anchor="middle" >results</text>
<path d="M546 676H600V154H654" class="flow back"/>
<text x="600" y="580" class="al" text-anchor="middle" >again</text>
<text x="600" y="888" class="lb" text-anchor="middle" >a turn = one model call + its tool calls</text>
</svg>
