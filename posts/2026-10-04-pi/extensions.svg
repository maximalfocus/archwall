<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi extensions and add-ons</title>
<desc id="d">1 Four kinds of add-on: extensions are TypeScript code, skills are instructions read on demand, prompt templates are reusable slash commands, themes are terminal colours. 2 Where they load from: your own folder ~/.pi/agent, the project's .pi folder once the project is trusted, pi packages from npm or git, or the -e flag for one run. 3 What an extension can add: tools, commands, model providers, MCP servers, terminal UI and event hooks. It runs inside the pi process with the same rights. 4 Built-in extensions use the same API: mcp, codemode, tool_search and llama.cpp for local models. An installed extension can replace mcp, codemode or tool_search.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
