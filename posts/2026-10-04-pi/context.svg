<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi request context</title>
<desc id="d">1 Load at startup: project trust decides whether the project's .pi folder loads (settings, extensions, skills, prompt templates, MCP servers, SYSTEM.md). Context files such as AGENTS.md and CLAUDE.md load with or without trust. 2 System prompt: pi's base prompt, or SYSTEM.md in its place, then APPEND_SYSTEM.md, the context files, and a list of skills with name, description and path; the full skill is read when needed. 3 Conversation: the active branch of the session, a compaction summary in place of older messages, and your new message after prompt templates expand. 4 The request: system prompt, tool declarations, messages and model settings. Extensions can change the messages first. It goes to the model through pi-ai.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="188.75" cy="43" r="14" class="num"/>
<text x="188.75" y="49" class="numt" text-anchor="middle" >1</text>
<text x="208.75" y="52" class="gt" text-anchor="start" >Load at startup</text>
<rect x="54" y="88" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="56" rx="2" fill="#d64545"/>
<text x="303.0" y="121.0" class="ag" text-anchor="middle" >Project trust</text>
<text x="303.0" y="145.0" class="ag" text-anchor="middle" >you decide per folder</text>
<rect x="54" y="200" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="303.0" y="233.0" class="ag" text-anchor="middle" >.pi folder</text>
<text x="303.0" y="257.0" class="ag" text-anchor="middle" >only if trusted</text>
<rect x="54" y="312" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="322" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="303.0" y="345.0" class="ag" text-anchor="middle" >AGENTS.md, CLAUDE.md</text>
<text x="303.0" y="369.0" class="ag" text-anchor="middle" >load either way</text>
<path d="M300.0 164V200" class="flow"/>
<text x="328.0" y="188" class="al" text-anchor="middle" >yes</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="802.25" cy="43" r="14" class="num"/>
<text x="802.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="822.25" y="52" class="gt" text-anchor="start" >System prompt</text>
<rect x="654" y="80" width="492" height="68" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="48" rx="2" fill="#5b6675"/>
<text x="903.0" y="109.0" class="ag" text-anchor="middle" >Base prompt</text>
<text x="903.0" y="133.0" class="ag" text-anchor="middle" >or SYSTEM.md instead</text>
<rect x="654" y="162" width="492" height="68" rx="8" class="agent"/>
<rect x="654" y="172" width="5" height="48" rx="2" fill="#5b6675"/>
<text x="903.0" y="203.0" class="ag" text-anchor="middle" >+ APPEND_SYSTEM.md</text>
<rect x="654" y="244" width="492" height="68" rx="8" class="agent"/>
<rect x="654" y="254" width="5" height="48" rx="2" fill="#5b6675"/>
<text x="903.0" y="285.0" class="ag" text-anchor="middle" >+ context files</text>
<rect x="654" y="326" width="492" height="68" rx="8" class="agent"/>
<rect x="654" y="336" width="5" height="48" rx="2" fill="#5b6675"/>
<text x="903.0" y="355.0" class="ag" text-anchor="middle" >+ skill list</text>
<text x="903.0" y="379.0" class="ag" text-anchor="middle" >name, description, path</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="809.0" cy="487" r="14" class="num"/>
<text x="809.0" y="493" class="numt" text-anchor="middle" >3</text>
<text x="829.0" y="496" class="gt" text-anchor="start" >Conversation</text>
<rect x="654" y="532" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="56" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="565.0" class="ag" text-anchor="middle" >Active branch</text>
<text x="903.0" y="589.0" class="ag" text-anchor="middle" >of the session tree</text>
<rect x="654" y="632" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="642" width="5" height="56" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="665.0" class="ag" text-anchor="middle" >Compaction summary</text>
<text x="903.0" y="689.0" class="ag" text-anchor="middle" >instead of old messages</text>
<rect x="654" y="732" width="492" height="76" rx="8" class="human"/>
<text x="903.0" y="765.0" class="ag" text-anchor="middle" >Your new message</text>
<text x="903.0" y="789.0" class="ag" text-anchor="middle" >templates expanded</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="215.75" cy="487" r="14" class="num"/>
<text x="215.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="235.75" y="496" class="gt" text-anchor="start" >The request</text>
<rect x="54" y="532" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="176.0" y="579.0" class="ag" text-anchor="middle" >System prompt</text>
<rect x="308" y="532" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="542" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="430.0" y="567.0" class="ag" text-anchor="middle" >Tool</text>
<text x="430.0" y="591.0" class="ag" text-anchor="middle" >declarations</text>
<rect x="54" y="632" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="642" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="679.0" class="ag" text-anchor="middle" >Messages</text>
<rect x="308" y="632" width="238" height="80" rx="8" class="agent"/>
<text x="430.0" y="667.0" class="ag" text-anchor="middle" >Model</text>
<text x="430.0" y="691.0" class="ag" text-anchor="middle" >settings</text>
<text x="300.0" y="778" class="lb" text-anchor="middle" >extensions can change the messages,</text>
<text x="300.0" y="804" class="lb" text-anchor="middle" >then pi-ai sends it to the model</text>
<path d="M576 350H624" class="flow"/>
<text x="600" y="338" class="al" text-anchor="middle" >files</text>
<path d="M900.0 428V460" class="flow"/>
<text x="946.0" y="450" class="al" text-anchor="middle" >prompt</text>
<path d="M624 670H576" class="flow"/>
<text x="600" y="658" class="al" text-anchor="middle" >history</text>
<text x="600" y="888" class="lb" text-anchor="middle" >full skill text is read only when a task needs it</text>
</svg>
