title_zh = "pi：一个可以自己改造的极简编程智能体"
title_en = "pi: a minimal coding agent you make your own"
date = "2026-10-04"
tags = ["agents", "coding-agent", "cli", "llm"]
figure = "diagram.svg"
alt_zh = "pi 架构：1 四种入口（终端界面、打印/JSON、RPC、SDK）共用同一个智能体和会话；2 拼请求：系统提示词加上下文文件、会话当前分支、工具、技能描述，扩展在同一进程里加工具和命令；3 pi-agent-core 循环：调模型、有工具调用就并行执行、记下结果、再来一轮；4 pi-ai 一套接口接多家模型厂商"
alt_en = "Pi architecture: 1 four interfaces (terminal UI, print/JSON, RPC, SDK) share one agent and session; 2 build the request from the system prompt and context files, the active session branch, tools and skill descriptions, with extensions in the same process; 3 the pi-agent-core loop calls the model, runs any tool calls in parallel, records the results and goes again; 4 pi-ai puts one API over many providers"
source = "https://github.com/earendil-works/pi"

[[figures]]
file = "session.svg"
alt_zh = "pi 会话：一个 JSONL 文件里的一棵树，每条记录带父记录 id；当前分支从根走到当前记录，旧分支保留；模型只收到系统提示词、工具和技能描述、压缩摘要和当前分支上的近期消息；上下文快满时自动压缩，/fork 和 /clone 另开新文件"
alt_en = "Pi session: a tree in one JSONL file, each entry pointing to its parent; the active branch runs from the root to the current entry and old branches stay; the model gets the system prompt, tool and skill descriptions, the compaction summary and recent messages on the active branch; compaction runs when context fills up, /fork and /clone start new files"
caption_zh = "会话是一棵树，模型只看当前分支"
caption_en = "A session is a tree; the model only sees the active branch"
