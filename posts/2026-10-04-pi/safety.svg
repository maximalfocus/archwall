<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi safety</title>
<desc id="d">1 By default pi has no built-in permission system and does not ask before each tool call. Tools, extensions and child processes run with the rights of the account that started pi. 2 Project trust decides whether a folder's .pi settings, extensions, skills and MCP servers load. It is not a sandbox: once pi runs, tools can reach anything the account can. 3 Opt in: a permission extension can hook every tool call, MCP calls included, and ask before risky ones, using the hints tools declare. 4 Isolation: run all of pi in plain Docker, Docker Sandboxes or OpenShell, or keep pi on the host and send only the built-in tools into a micro-VM with the Gondolin extension.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="222.5" cy="43" r="14" class="num"/>
<text x="222.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="242.5" y="52" class="gt" text-anchor="start" >By default</text>
<rect x="54" y="88" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="56" rx="2" fill="#d64545"/>
<text x="303.0" y="121.0" class="ag" text-anchor="middle" >No permission system</text>
<text x="303.0" y="145.0" class="ag" text-anchor="middle" >no ask before each call</text>
<rect x="54" y="200" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="233.0" class="ag" text-anchor="middle" >Your account's rights</text>
<text x="303.0" y="257.0" class="ag" text-anchor="middle" >for tools and extensions</text>
<text x="300.0" y="334" class="lb" text-anchor="middle" >files, comments and tool output</text>
<text x="300.0" y="360" class="lb" text-anchor="middle" >can steer the model (prompt injection)</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="802.25" cy="43" r="14" class="num"/>
<text x="802.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="822.25" y="52" class="gt" text-anchor="start" >Project trust</text>
<rect x="654" y="88" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="98" width="5" height="56" rx="2" fill="#d64545"/>
<text x="903.0" y="121.0" class="ag" text-anchor="middle" >Trust this folder?</text>
<text x="903.0" y="145.0" class="ag" text-anchor="middle" >you decide, can be saved</text>
<rect x="654" y="200" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="210" width="5" height="56" rx="2" fill="#5b6675"/>
<text x="903.0" y="233.0" class="ag" text-anchor="middle" >.pi folder loads</text>
<text x="903.0" y="257.0" class="ag" text-anchor="middle" >settings, extensions, MCP</text>
<path d="M900.0 164V200" class="flow"/>
<text x="928.0" y="188" class="al" text-anchor="middle" >yes</text>
<text x="900.0" y="334" class="lb" text-anchor="middle" >not a sandbox: it only decides</text>
<text x="900.0" y="360" class="lb" text-anchor="middle" >what loads at startup</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="701.0" cy="487" r="14" class="num"/>
<text x="701.0" y="493" class="numt" text-anchor="middle" >3</text>
<text x="721.0" y="496" class="gt" text-anchor="start" >Opt in: permission extension</text>
<rect x="654" y="532" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="56" rx="2" fill="#d64545"/>
<text x="903.0" y="565.0" class="ag" text-anchor="middle" >Hook every tool call</text>
<text x="903.0" y="589.0" class="ag" text-anchor="middle" >MCP calls too</text>
<rect x="654" y="644" width="492" height="76" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="56" rx="2" fill="#d64545"/>
<text x="903.0" y="677.0" class="ag" text-anchor="middle" >Ask before risky ones</text>
<text x="903.0" y="701.0" class="ag" text-anchor="middle" >using the tools' hints</text>
<path d="M900.0 608V644" class="flow"/>
<text x="900.0" y="778" class="lb" text-anchor="middle" >you install or write one;</text>
<text x="900.0" y="804" class="lb" text-anchor="middle" >none is built in</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="148.25" cy="487" r="14" class="num"/>
<text x="148.25" y="493" class="numt" text-anchor="middle" >4</text>
<text x="168.25" y="496" class="gt" text-anchor="start" >Isolation (strongest)</text>
<rect x="54" y="532" width="238" height="80" rx="8" class="agent"/>
<text x="176.0" y="567.0" class="ag" text-anchor="middle" >Plain Docker</text>
<text x="176.0" y="591.0" class="ag" text-anchor="middle" >all of pi</text>
<rect x="308" y="532" width="238" height="80" rx="8" class="agent"/>
<text x="430.0" y="567.0" class="ag" text-anchor="middle" >Docker Sandboxes</text>
<text x="430.0" y="591.0" class="ag" text-anchor="middle" >all of pi</text>
<rect x="54" y="632" width="238" height="80" rx="8" class="agent"/>
<text x="176.0" y="667.0" class="ag" text-anchor="middle" >OpenShell</text>
<text x="176.0" y="691.0" class="ag" text-anchor="middle" >all of pi, policies</text>
<rect x="308" y="632" width="238" height="80" rx="8" class="agent"/>
<text x="430.0" y="667.0" class="ag" text-anchor="middle" >Gondolin</text>
<text x="430.0" y="691.0" class="ag" text-anchor="middle" >only built-in tools</text>
<text x="300.0" y="760" class="lb" text-anchor="middle" >expose only the files, keys and</text>
<text x="300.0" y="786" class="lb" text-anchor="middle" >network the task needs</text>
<text x="600" y="888" class="lb" text-anchor="middle" >pi's docs: watching the transcript is not a security boundary</text>
</svg>
