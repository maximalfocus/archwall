<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi coding agent architecture</title>
<desc id="d">1 Interfaces: the terminal UI, print or JSON mode, RPC over JSONL on stdin and stdout, and the TypeScript SDK all share one agent and session. They send the prompt on. 2 Build the request: the system prompt with context files, the active session branch as history, tool definitions (read, bash, edit, write by default) and skill descriptions. Extensions are TypeScript modules in the pi process that add tools, commands, providers and UI. 3 Agent loop in pi-agent-core: call the model, check for tool calls (none ends the run), run the tools, record the results, and go again. A steering message goes in after the current turn, a follow-up after the run. 4 pi-ai: the loop calls one Models API, which routes each call to a provider such as Anthropic, OpenAI, Google, Bedrock, OpenRouter or any OpenAI-compatible server, and streams the answer back.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
