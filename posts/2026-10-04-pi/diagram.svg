<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi coding agent overview</title>
<desc id="d">1 Ways in: the terminal UI, print or JSON mode for scripts, RPC over JSONL on stdin and stdout, and the TypeScript SDK. All four use the same agent and session. 2 The agent session in pi-coding-agent: it builds the context from the system prompt and the active session branch, holds the tools (read, bash, edit and write are on by default), loads extensions, and saves everything to a session file. 3 The agent loop in pi-agent-core: call the model, check for tool calls (none ends the run), run the tools, record the results and go again. 4 pi-ai: one API that routes each call to one of 42 built-in providers, such as Anthropic, OpenAI, Google, Bedrock or OpenRouter, or to any OpenAI-compatible server, and streams the answer back.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
