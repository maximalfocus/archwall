<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi session tree</title>
<desc id="d">1 A session is one JSONL file. Each entry has an id and its parent's id, so entries form a tree. The active branch runs from the root to the current entry; going back with /tree starts another branch in the same file and keeps the old one. A compaction entry holds a summary of older messages. 2 The model gets the system prompt with context files, tool and skill descriptions, the compaction summary instead of the older messages, and the recent messages on the active branch. Other branches are never sent. 3 Compaction runs when the context passes the model's window minus 16384 reserve tokens, or on /compact; the original entries stay. /fork starts a new session file from an earlier user message; /clone copies the active branch into a new one.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
