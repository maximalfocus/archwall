<text x="903.0" y="579.0" class="ag" text-anchor="middle" >catalog, can refresh</text>
<rect x="654" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="651.0" class="ag" text-anchor="middle" >Sign-in</text>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >API key, /login, cloud</text>
<rect x="654" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="726" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >Wire API</text>
<text x="903.0" y="771.0" class="ag" text-anchor="middle" >e.g. openai-completions</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="209.0" cy="487" r="14" class="num"/>
<text x="209.0" y="493" class="numt" text-anchor="middle" >4</text>
<text x="229.0" y="496" class="gt" text-anchor="start" >Add your own</text>
<rect x="54" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="555.0" class="ag" text-anchor="middle" >models.json</text>
<text x="303.0" y="579.0" class="ag" text-anchor="middle" >Ollama, vLLM, LM Studio</text>
<rect x="54" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="630" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="651.0" class="ag" text-anchor="middle" >llama.cpp router</text>
<text x="303.0" y="675.0" class="ag" text-anchor="middle" >local GGUF models</text>
<rect x="54" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="726" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="747.0" class="ag" text-anchor="middle" >Provider extension</text>
<text x="303.0" y="771.0" class="ag" text-anchor="middle" >custom sign-in or protocol</text>
<path d="M576 138H624" class="flow"/>
<text x="600" y="126" class="al" text-anchor="middle" >model</text>
<path d="M900.0 428V460" class="flow"/>
<text x="944.0" y="450" class="al" text-anchor="middle" >request</text>
<path d="M536 460V444H664V428" class="flow"/>
<text x="600" y="450" class="al" text-anchor="middle" >registers</text>
<text x="900.0" y="390" class="lb" text-anchor="middle" >switch models mid-session, history kept</text>
<text x="600" y="888" class="lb" text-anchor="middle" >credentials: --api-key, then auth.json, models.json, env vars</text>
</svg>
