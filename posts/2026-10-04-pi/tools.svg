<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Pi tools</title>
<desc id="d">1 Built-in tools: read, bash, edit and write are on by default; grep, find, ls and powershell (Windows) are built in but off until you turn them on. Extensions add more. 2 Exposure decides how a tool reaches the model: direct tools are declared to the model, model-only tools are declared but scripts cannot call them, codemode tools are only called from scripts, deferred tools wait for a search, hidden tools are unreachable. 3 codemode, a built-in extension, off by default and turned on when an MCP server needs it: the model writes a JavaScript script that runs in a QuickJS sandbox with no files, network or timers, calls other tools, and only the script's output goes back to the model. 4 tool_search, from the built-in tool-search extension, off by default: it searches tools that are not declared and declares the matches for the next model call; they stay declared on that branch.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="195.5" cy="43" r="14" class="num"/>
<text x="195.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="215.5" y="52" class="gt" text-anchor="start" >Built-in tools</text>
<rect x="36" y="74" width="528" height="222" rx="9" class="sub"/>
<text x="300.0" y="102" class="st" text-anchor="middle" >On by default</text>
<rect x="54" y="120" width="238" height="64" rx="8" class="agent"/>
<rect x="54" y="130" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="176.0" y="159.0" class="ag" text-anchor="middle" >read</text>
<rect x="308" y="120" width="238" height="64" rx="8" class="agent"/>
<rect x="308" y="130" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="430.0" y="159.0" class="ag" text-anchor="middle" >bash</text>
<rect x="54" y="204" width="238" height="64" rx="8" class="agent"/>
<rect x="54" y="214" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="176.0" y="243.0" class="ag" text-anchor="middle" >edit</text>
<rect x="308" y="204" width="238" height="64" rx="8" class="agent"/>
<rect x="308" y="214" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="430.0" y="243.0" class="ag" text-anchor="middle" >write</text>
<text x="300.0" y="350" class="lb" text-anchor="middle" >built in, off: grep, find, ls,</text>
<text x="300.0" y="376" class="lb" text-anchor="middle" >powershell (Windows)</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="701.0" cy="43" r="14" class="num"/>
<text x="701.0" y="49" class="numt" text-anchor="middle" >2</text>
<text x="721.0" y="52" class="gt" text-anchor="start" >How a tool reaches the model</text>
<rect x="654" y="80" width="238" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="776.0" y="111.0" class="ag" text-anchor="middle" >direct</text>
<text x="776.0" y="135.0" class="ag" text-anchor="middle" >declared to it</text>
<rect x="908" y="80" width="238" height="72" rx="8" class="agent"/>
<rect x="908" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="1030.0" y="111.0" class="ag" text-anchor="middle" >codemode</text>
<text x="1030.0" y="135.0" class="ag" text-anchor="middle" >from scripts only</text>
<rect x="654" y="168" width="238" height="72" rx="8" class="agent"/>
<rect x="654" y="178" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="776.0" y="199.0" class="ag" text-anchor="middle" >deferred</text>
<text x="776.0" y="223.0" class="ag" text-anchor="middle" >after a search</text>
<rect x="908" y="168" width="238" height="72" rx="8" class="agent"/>
<rect x="908" y="178" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="1030.0" y="199.0" class="ag" text-anchor="middle" >hidden</text>
<text x="1030.0" y="223.0" class="ag" text-anchor="middle" >unreachable</text>
<rect x="654" y="256" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="266" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="283.0" class="ag" text-anchor="middle" >model-only</text>
<text x="903.0" y="307.0" class="ag" text-anchor="middle" >the model calls it, scripts cannot</text>
<text x="900.0" y="356" class="lb" text-anchor="middle" >built-ins are direct;</text>
<text x="900.0" y="382" class="lb" text-anchor="middle" >MCP tools default to codemode</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="721.25" cy="487" r="14" class="num"/>
<text x="721.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="741.25" y="496" class="gt" text-anchor="start" >codemode (off by default)</text>
<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >Model writes a script</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >JavaScript</text>
<rect x="654" y="624" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="634" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="655.0" class="ag" text-anchor="middle" >QuickJS sandbox</text>
<text x="903.0" y="679.0" class="ag" text-anchor="middle" >no files, no network</text>
<rect x="654" y="724" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="755.0" class="ag" text-anchor="middle" >Script calls tools</text>
<text x="903.0" y="779.0" class="ag" text-anchor="middle" >only its output returns</text>
<path d="M900.0 596V624" class="flow"/>
<path d="M900.0 696V724" class="flow"/>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="101.0" cy="487" r="14" class="num"/>
<text x="101.0" y="493" class="numt" text-anchor="middle" >4</text>
<text x="121.0" y="496" class="gt" text-anchor="start" >tool_search (off by default)</text>
<rect x="54" y="532" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="56" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="565.0" class="ag" text-anchor="middle" >Search undeclared tools</text>
<text x="303.0" y="589.0" class="ag" text-anchor="middle" >ranked by relevance</text>
<rect x="54" y="644" width="492" height="76" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="56" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="677.0" class="ag" text-anchor="middle" >Declare the matches</text>
<text x="303.0" y="701.0" class="ag" text-anchor="middle" >for the next call</text>
<path d="M300.0 608V644" class="flow"/>
<text x="300.0" y="778" class="lb" text-anchor="middle" >both turn on by themselves</text>
<text x="300.0" y="804" class="lb" text-anchor="middle" >when an MCP server needs them</text>
<path d="M576 216H624" class="flow"/>
<text x="600" y="204" class="al" text-anchor="middle" >exposure</text>
<path d="M900.0 428V460" class="flow"/>
<text x="980.0" y="450" class="al" text-anchor="middle" >codemode tools</text>
<path d="M664 428V444H536V460" class="flow"/>
<text x="600" y="450" class="al" text-anchor="middle" >deferred tools</text>
<text x="600" y="888" class="lb" text-anchor="middle" >codemode scripts can also run classifier and image models</text>
</svg>
