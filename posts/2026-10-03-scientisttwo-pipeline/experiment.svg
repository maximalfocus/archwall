<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo stage 2: test an idea, small first</title>
<desc id="d">1 Baseline: a Baseline Coder reruns the best paper's main experiments on a slice of the benchmark, giving baseline results and code. 2 Try on a slice: a Subset Coder builds the idea by changing that code, and a Subset Critic compares the results with the baseline. 3 Verdict: good means scale up; bad means the idea is dropped; engineer means it shows promise and a Subset Engineer tunes it, for at most 2 rounds, after which it counts as bad. 4 Full benchmark: a Full-Set Coder runs the idea on every dataset, and a Full-Set Critic and Engineer do the final check. Out come the code, the results, good or bad, and lessons for the next round.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="230.0" cy="43" r="14" class="num"/>
<text x="230.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="250.0" y="52" class="gt" text-anchor="start" >Baseline</text>
<rect x="54" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="297.0" y="119.0" class="ag" text-anchor="middle" >Baseline coder</text>
<text x="297.0" y="143.0" class="ag" text-anchor="middle" >reruns the best paper</text>
<rect x="54" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="226" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="297.0" y="247.0" class="ag" text-anchor="middle" >Baseline result</text>
<text x="297.0" y="271.0" class="ag" text-anchor="middle" >on the small slice</text>
<path d="M294.0 160V214" class="flow"/>
<text x="294.0" y="358" class="lb" text-anchor="middle" >a slice of the benchmark first,</text>
<text x="294.0" y="386" class="lb" text-anchor="middle" >to save compute</text>
<rect x="636" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="801.5" cy="43" r="14" class="num"/>
<text x="801.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="821.5" y="52" class="gt" text-anchor="start" >Try on a slice</text>
<rect x="666" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="98" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="909.0" y="119.0" class="ag" text-anchor="middle" >Subset coder</text>
<text x="909.0" y="143.0" class="ag" text-anchor="middle" >builds the idea</text>
<rect x="666" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="226" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="909.0" y="247.0" class="ag" text-anchor="middle" >Subset critic</text>
<text x="909.0" y="271.0" class="ag" text-anchor="middle" >better than baseline?</text>
<path d="M906.0 160V214" class="flow"/>
<rect x="636" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="848.75" cy="487" r="14" class="num"/>
<text x="848.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="868.75" y="496" class="gt" text-anchor="start" >Verdict</text>
<rect x="666" y="524" width="232" height="72" rx="8" class="agent"/>
<rect x="666" y="534" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="785.0" y="555.0" class="ag" text-anchor="middle" >Good</text>
<text x="785.0" y="579.0" class="ag" text-anchor="middle" >scale up</text>
<rect x="914" y="524" width="232" height="72" rx="8" class="agent"/>
<rect x="914" y="534" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="1033.0" y="555.0" class="ag" text-anchor="middle" >Bad</text>
<text x="1033.0" y="579.0" class="ag" text-anchor="middle" >dropped</text>
<g transform="translate(878 538)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<g transform="translate(1126 538)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#d64545"/><path d="M-4.5-4.5l9 9M4.5-4.5l-9 9" stroke="#fff" stroke-width="2.4"/></g>
<rect x="666" y="620" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="630" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="909.0" y="651.0" class="ag" text-anchor="middle" >Engineer</text>
<text x="909.0" y="675.0" class="ag" text-anchor="middle" >tune it, at most 2 rounds</text>
<text x="906.0" y="790" class="lb" text-anchor="middle" >still not good after that:</text>
<text x="906.0" y="818" class="lb" text-anchor="middle" >counted as bad</text>
<rect x="24" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="189.5" cy="487" r="14" class="num"/>
<text x="189.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="209.5" y="496" class="gt" text-anchor="start" >Full benchmark</text>
<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Full-set coder</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >runs every dataset</text>
<rect x="54" y="644" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="297.0" y="675.0" class="ag" text-anchor="middle" >Full-set critic</text>
<text x="297.0" y="699.0" class="ag" text-anchor="middle" >and engineer: final check</text>
<path d="M294.0 604V642" class="flow"/>
<text x="294.0" y="790" class="lb" text-anchor="middle" >out: code, results,</text>
<text x="294.0" y="818" class="lb" text-anchor="middle" >good or bad, lessons</text>
<path d="M564 124H634" class="flow"/>
<text x="600.0" y="112" class="al" text-anchor="middle" >baseline</text>
<path d="M798.0 428V458" class="flow"/>
<text x="846.2" y="454" class="al" text-anchor="middle" >verdict</text>
<path d="M1146 656H1161V430" class="flow back"/>
<text x="1121" y="454" class="al" text-anchor="middle" >tuned</text>
<path d="M636 560H566" class="flow"/>
<text x="600.0" y="548" class="al" text-anchor="middle" >good</text>
</svg>
