<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Draft enhancer</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >updates text, tables, figures</text>
<text x="294.0" y="804" class="lb" text-anchor="middle" >at most 2 review rounds</text>
<path d="M564 252H634" class="flow"/>
