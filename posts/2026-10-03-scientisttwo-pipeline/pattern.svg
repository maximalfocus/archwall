<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo: one pattern at every stage</title>
<desc id="d">1 Make: a specialist agent makes a candidate, such as limitations, ideas, code and results, or a draft. 2 Judge: a critic agent asks a stage-specific question, such as is it new, or is it better than the baseline, and answers accept, refine or reject. 3 Verdict: accept moves the candidate on to the next stage; reject drops it. 4 Refine: a refine agent fixes the candidate using the critic's notes and sends the new version back to the critic. Every loop has a round limit. From Listing 1 and Table 1 of the paper.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="257.0" cy="43" r="14" class="num"/>
<text x="257.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="277.0" y="52" class="gt" text-anchor="start" >Make</text>
<rect x="54" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="297.0" y="119.0" class="ag" text-anchor="middle" >Specialist agent</text>
<text x="297.0" y="143.0" class="ag" text-anchor="middle" >makes a candidate</text>
<rect x="54" y="216" width="232" height="72" rx="8" class="agent"/>
<rect x="54" y="226" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="173.0" y="247.0" class="ag" text-anchor="middle" >Ideas or</text>
<text x="173.0" y="271.0" class="ag" text-anchor="middle" >limitations</text>
<rect x="302" y="216" width="232" height="72" rx="8" class="agent"/>
<rect x="302" y="226" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="421.0" y="247.0" class="ag" text-anchor="middle" >Code and</text>
<text x="421.0" y="271.0" class="ag" text-anchor="middle" >results</text>
<rect x="178" y="312" width="232" height="72" rx="8" class="agent"/>
<rect x="178" y="322" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="297.0" y="343.0" class="ag" text-anchor="middle" >A draft</text>
<text x="297.0" y="367.0" class="ag" text-anchor="middle" >paper</text>
<rect x="636" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="862.25" cy="43" r="14" class="num"/>
<text x="862.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="882.25" y="52" class="gt" text-anchor="start" >Judge</text>
<rect x="666" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="98" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="909.0" y="119.0" class="ag" text-anchor="middle" >Critic agent</text>
<text x="909.0" y="143.0" class="ag" text-anchor="middle" >accept, refine or reject</text>
<text x="906.0" y="358" class="lb" text-anchor="middle" >asks one question per stage,</text>
<text x="906.0" y="386" class="lb" text-anchor="middle" >e.g. is it new? is it better?</text>
<rect x="636" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="848.75" cy="487" r="14" class="num"/>
<text x="848.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="868.75" y="496" class="gt" text-anchor="start" >Verdict</text>
<rect x="666" y="532" width="232" height="80" rx="8" class="agent"/>
<rect x="666" y="542" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="785.0" y="567.0" class="ag" text-anchor="middle" >Accept</text>
<text x="785.0" y="591.0" class="ag" text-anchor="middle" >next stage</text>
<rect x="914" y="532" width="232" height="80" rx="8" class="agent"/>
<rect x="914" y="542" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="1033.0" y="567.0" class="ag" text-anchor="middle" >Reject</text>
<text x="1033.0" y="591.0" class="ag" text-anchor="middle" >dropped</text>
<g transform="translate(878 546)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<g transform="translate(1126 546)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#d64545"/><path d="M-4.5-4.5l9 9M4.5-4.5l-9 9" stroke="#fff" stroke-width="2.4"/></g>
<text x="906.0" y="804" class="lb" text-anchor="middle" >same rule from idea to paper</text>
<rect x="24" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="243.5" cy="487" r="14" class="num"/>
<text x="243.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="263.5" y="496" class="gt" text-anchor="start" >Refine</text>
<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Refine agent</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >fixes it from the notes</text>
<text x="294.0" y="804" class="lb" text-anchor="middle" >every loop has a round limit</text>
<path d="M564 124H634" class="flow"/>
<text x="600.0" y="112" class="al" text-anchor="middle" >output</text>
<path d="M636 346H600.0V568H566" class="flow"/>
<text x="600.0" y="334" class="al" text-anchor="middle" >refine</text>
<path d="M906.0 428V458" class="flow"/>
<text x="991.0" y="454" class="al" text-anchor="middle" >accept / reject</text>
<path d="M566 620H620V444H760V430" class="flow back"/>
<text x="690.0" y="430" class="al" text-anchor="middle" >new version</text>
</svg>
