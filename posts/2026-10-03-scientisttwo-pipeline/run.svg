<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo: models, time and cost</title>
<desc id="d">1 Models: Gemini 3.6 Flash runs most agents; the idea experiment coder, the ablation agent, the rebuttal agent and the draft enhancer use Claude Code with Opus 4.8. 2 Swap the coder: on 5 ICLR 2026 tasks Claude Code was replaced with Antigravity on Gemini 3.8 Flash, and it still found new best methods. 3 Time: about 2 to 3 days per problem, most of it in idea refinement and the review loops, where code runs on benchmarks. 4 Cost: $3,765 per problem on average, tokens plus virtual machines, measured on 33 NeurIPS 2025 problems.</desc>
