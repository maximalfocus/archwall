<text x="243.5" y="397" class="numt" text-anchor="middle" >4</text>
<text x="263.5" y="400" class="gt" text-anchor="start" >Writer</text>
<rect x="54" y="428" width="232" height="72" rx="8" class="agent"/>
<rect x="54" y="438" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="173.0" y="459.0" class="ag" text-anchor="middle" >Initial</text>
