<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo closed-loop research pipeline</title>
<desc id="d">Idea Generator, Evaluator and Analyzer test whether an idea works; Writer, Peer-Review and Meta-Review test whether the paper passes. Results feed back to evolve and refine ideas, and the meta-review sends the work back to the Analyzer until it clears the bar.</desc>
