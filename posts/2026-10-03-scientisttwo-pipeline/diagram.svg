<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo closed-loop research pipeline</title>
<desc id="d">Input: a research problem with the current best paper and its code. 1 Ideas: find what the best method gets wrong and write new ideas, checked for novelty. 2 Experiments: a coding agent and a critic test each idea on a slice of the benchmark, then on all of it; results go back to evolve better ideas. 3 Ablation: take the best idea apart to see which parts help, and refine it. 4 Writer: draft the paper and improve it. 5 Peer review: an AI reviewer scores it and a rebuttal agent answers with new experiments; the writer revises the draft. 6 Meta-review: accept, giving the final paper and code, or send the idea back to step 3 for one more fix.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
