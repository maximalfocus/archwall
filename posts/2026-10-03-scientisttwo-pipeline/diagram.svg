<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 616" width="1540" height="616" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo closed-loop research pipeline</title>
<desc id="d">Idea Generator, Evaluator and Analyzer in the top row feed a Writer Agent, Peer-Review Agent and Meta-Review Agent in the bottom row; ideas loop back for evolution and refinement, and the meta-review loops back to the Analyzer until the paper clears the bar.</desc>
