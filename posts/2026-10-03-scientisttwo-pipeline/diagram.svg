<rect x="54" y="712" width="232" height="72" rx="8" class="agent"/>
<rect x="54" y="722" width="5" height="52" rx="2" fill="#d64545"/>
<text x="173.0" y="743.0" class="ag" text-anchor="middle" >Reviewer</text>
