<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo: how it was tested</title>
<desc id="d">1 Test set: 107 research problems, each the problem and code of an accepted paper: 38 from NeurIPS 2025, 5 from ICLR 2026 and 64 ICML 2026 spotlights. 2 Beat the best: it beat the human best result on 86 of the 107, 80.4 percent, with an average gain of 25.2 percent. 3 AI reviewers: ScholarPeer, which is also used inside the loop, rated its papers 7.5 out of 10 and accepted 91.9 percent; the Stanford Agentic Reviewer, unseen during development, rated them 5.7 and accepted 72.1 percent. 4 Compared with: above the average accepted ICLR 2026 and NeurIPS 2025 paper under both reviewers, below ICML 2026 spotlights, and every other AI research agent got 0 percent acceptance from the Stanford reviewer.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
