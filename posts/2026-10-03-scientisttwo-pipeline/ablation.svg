<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo stage 3: ablation</title>
<desc id="d">1 Plan: an Ablation Planner takes the best idea, its results and code, and writes plans that each take out or change one part. 2 Run: an Ablation Coder runs every plan on the code, one result per part. 3 Judge: an Ablation Critic asks whether the breakdown is clean; if it is, the idea goes on to writing. 4 Refine: otherwise a Full-Set Engineer revises the method, and a Result Comparison agent keeps the new version only if it beats the old one; then the ablation runs again. In the paper's setting this refinement happens at most once.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="257.0" cy="43" r="14" class="num"/>
<text x="257.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="277.0" y="52" class="gt" text-anchor="start" >Plan</text>
<rect x="54" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="297.0" y="119.0" class="ag" text-anchor="middle" >Best idea</text>
<text x="297.0" y="143.0" class="ag" text-anchor="middle" >results + code</text>
<rect x="54" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="226" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="297.0" y="247.0" class="ag" text-anchor="middle" >Ablation planner</text>
<text x="297.0" y="271.0" class="ag" text-anchor="middle" >one plan per part</text>
<path d="M294.0 160V214" class="flow"/>
<rect x="636" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="875.75" cy="43" r="14" class="num"/>
<text x="875.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="895.75" y="52" class="gt" text-anchor="start" >Run</text>
<rect x="666" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="226" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="909.0" y="247.0" class="ag" text-anchor="middle" >Ablation coder</text>
<text x="909.0" y="271.0" class="ag" text-anchor="middle" >runs every plan</text>
<text x="906.0" y="372" class="lb" text-anchor="middle" >which part brings the gain?</text>
<rect x="636" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="862.25" cy="487" r="14" class="num"/>
<text x="862.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="882.25" y="496" class="gt" text-anchor="start" >Judge</text>
<rect x="666" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="542" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="909.0" y="563.0" class="ag" text-anchor="middle" >Ablation critic</text>
<text x="909.0" y="587.0" class="ag" text-anchor="middle" >is the breakdown clean?</text>
<rect x="666" y="644" width="232" height="72" rx="8" class="agent"/>
<rect x="666" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="785.0" y="675.0" class="ag" text-anchor="middle" >Not yet</text>
<text x="785.0" y="699.0" class="ag" text-anchor="middle" >refine it</text>
<rect x="914" y="644" width="232" height="72" rx="8" class="agent"/>
<rect x="914" y="654" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="1033.0" y="675.0" class="ag" text-anchor="middle" >Clean</text>
<text x="1033.0" y="699.0" class="ag" text-anchor="middle" >on to writing</text>
<g transform="translate(1126 658)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<path d="M782 604V642" class="flow"/>
<path d="M1030 604V642" class="flow"/>
<rect x="24" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="243.5" cy="487" r="14" class="num"/>
<text x="243.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="263.5" y="496" class="gt" text-anchor="start" >Refine</text>
<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Full-set engineer</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >revises the method</text>
<rect x="54" y="644" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="297.0" y="675.0" class="ag" text-anchor="middle" >Result compare</text>
<text x="297.0" y="699.0" class="ag" text-anchor="middle" >better than before?</text>
<path d="M294.0 604V642" class="flow"/>
<text x="294.0" y="790" class="lb" text-anchor="middle" >worse: keep the old one</text>
<text x="294.0" y="818" class="lb" text-anchor="middle" >at most once in the paper</text>
<path d="M564 252H634" class="flow"/>
<text x="600.0" y="240" class="al" text-anchor="middle" >plans</text>
<path d="M906.0 428V458" class="flow"/>
<text x="954.2" y="454" class="al" text-anchor="middle" >results</text>
<path d="M636 680H566" class="flow"/>
<text x="600.0" y="668" class="al" text-anchor="middle" >refine</text>
<path d="M294.0 460V430" class="flow back"/>
<text x="337.6" y="454" class="al" text-anchor="middle" >better</text>
</svg>
