<text x="906.0" y="790" class="lb" text-anchor="middle" >compares with 2 papers</text>
<text x="906.0" y="818" class="lb" text-anchor="middle" >found on Google Search</text>
<rect x="24" y="460" width="540" height="400" rx="12" class="grp"/>
