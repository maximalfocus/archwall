<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Idea generator</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >adds newer, different ideas</text>
<rect x="54" y="644" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="297.0" y="675.0" class="ag" text-anchor="middle" >Seed ideas</text>
<text x="297.0" y="699.0" class="ag" text-anchor="middle" >ranked by novelty</text>
