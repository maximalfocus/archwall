<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ScientistTwo stage 5: meta-review</title>
<desc id="d">1 Meta-review: a Meta-Reviewer reads the paper and its review and decides accept or refine. Accept ends the run with the final paper and its code. 2 Revise the idea: on refine, a Full-Set Engineer changes the idea itself, guided by the meta-review. 3 Compare: a Result Comparison agent checks the new results against the old; if they are not better, the change is thrown away and the previous paper ships. 4 Redo: if better, the ablation, the draft and the review run again and the new paper returns to the meta-reviewer. In the paper's setting this happens at most once.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="209.75" cy="43" r="14" class="num"/>
<text x="209.75" y="49" class="numt" text-anchor="middle" >1</text>
<text x="229.75" y="52" class="gt" text-anchor="start" >Meta-review</text>
<rect x="54" y="88" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="52" rx="2" fill="#d64545"/>
<text x="297.0" y="119.0" class="ag" text-anchor="middle" >Meta-reviewer</text>
<text x="297.0" y="143.0" class="ag" text-anchor="middle" >meets the venue bar?</text>
<rect x="54" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="226" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="297.0" y="247.0" class="ag" text-anchor="middle" >Accept</text>
<text x="297.0" y="271.0" class="ag" text-anchor="middle" >final paper + code</text>
<g transform="translate(514 230)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<path d="M294.0 160V214" class="flow"/>
<rect x="636" y="16" width="540" height="412" rx="12" class="grp"/>
<circle cx="794.75" cy="43" r="14" class="num"/>
<text x="794.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="814.75" y="52" class="gt" text-anchor="start" >Revise the idea</text>
<rect x="666" y="216" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="226" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="909.0" y="247.0" class="ag" text-anchor="middle" >Full-set engineer</text>
<text x="909.0" y="271.0" class="ag" text-anchor="middle" >changes the idea itself</text>
<text x="906.0" y="372" class="lb" text-anchor="middle" >guided by the meta-review</text>
<rect x="636" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="848.75" cy="487" r="14" class="num"/>
<text x="848.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="868.75" y="496" class="gt" text-anchor="start" >Compare</text>
<rect x="666" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="542" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="909.0" y="563.0" class="ag" text-anchor="middle" >Result compare</text>
<text x="909.0" y="587.0" class="ag" text-anchor="middle" >better than before?</text>
<rect x="666" y="644" width="480" height="72" rx="8" class="agent"/>
<rect x="666" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="909.0" y="675.0" class="ag" text-anchor="middle" >Not better</text>
<text x="909.0" y="699.0" class="ag" text-anchor="middle" >ship the previous paper</text>
<g transform="translate(1126 658)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#d64545"/><path d="M-4.5-4.5l9 9M4.5-4.5l-9 9" stroke="#fff" stroke-width="2.4"/></g>
<path d="M906.0 604V642" class="flow"/>
<rect x="24" y="460" width="540" height="400" rx="12" class="grp"/>
<circle cx="257.0" cy="487" r="14" class="num"/>
<text x="257.0" y="493" class="numt" text-anchor="middle" >4</text>
<text x="277.0" y="496" class="gt" text-anchor="start" >Redo</text>
<rect x="54" y="532" width="480" height="72" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="297.0" y="563.0" class="ag" text-anchor="middle" >Ablation, draft</text>
<text x="297.0" y="587.0" class="ag" text-anchor="middle" >and review again</text>
<text x="294.0" y="804" class="lb" text-anchor="middle" >at most once in the paper</text>
<path d="M564 124H634" class="flow"/>
<text x="600.0" y="112" class="al" text-anchor="middle" >refine</text>
<path d="M906.0 428V458" class="flow"/>
<text x="972.6" y="454" class="al" text-anchor="middle" >new results</text>
<path d="M636 568H566" class="flow"/>
<text x="600.0" y="556" class="al" text-anchor="middle" >better</text>
<path d="M294.0 460V430" class="flow back"/>
<text x="351.4" y="454" class="al" text-anchor="middle" >new paper</text>
</svg>
