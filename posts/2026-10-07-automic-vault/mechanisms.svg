<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a hardened tool does not fit</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="188.75" cy="111" r="14" class="num"/>
<text x="188.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="208.75" y="120" class="gt" text-anchor="start" >Blessed Scripts</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >av bless</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >review a script once</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >It declares its needs</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >secret names · tool capabilities</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Edit the script</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >the Blessing ends</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="829.25" cy="111" r="14" class="num"/>
<text x="829.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="849.25" y="120" class="gt" text-anchor="start" >av inject</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Environment</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >secrets as variables</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >--mode=fd</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >one pipe per secret · ask each time</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Direct Access Rule</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >one name · one launcher · broad</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Least preferred: the program</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >gets the secret itself</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="809.0" cy="527" r="14" class="num"/>
<text x="809.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="829.0" y="536" class="gt" text-anchor="start" >Secret Proxy</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >av proxy</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >the app gets a stand-in</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Proxy helper</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >swaps in the real secret</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Approved destinations</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >for this session only</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Stand-ins are still bearer values</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="242.75" cy="527" r="14" class="num"/>
<text x="242.75" y="533" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="536" class="gt" text-anchor="start" >Varlock</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Varlock plugin</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >all its secrets in one request</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >One Approval per run</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >no rules or Blessings</text>
</svg>
