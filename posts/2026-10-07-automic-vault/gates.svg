<text x="215.75" y="49" class="numt" text-anchor="middle" >1</text>
<text x="235.75" y="52" class="gt" text-anchor="start" >GPG signing</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >av-gpg</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >Git hands it the commit</text>
<rect x="54" y="160" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="170" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="187.0" class="ag" text-anchor="middle" >Key in the Keychain</text>
<text x="303.0" y="211.0" class="ag" text-anchor="middle" >Git never sees it</text>
<rect x="54" y="240" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="250" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="267.0" class="ag" text-anchor="middle" >Approval Required</text>
<text x="303.0" y="291.0" class="ag" text-anchor="middle" >default · or Allow Signing</text>
<rect x="624" y="16" width="552" height="448" rx="12" class="grp"/>
<circle cx="761.75" cy="43" r="14" class="num"/>
<text x="761.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="781.75" y="52" class="gt" text-anchor="start" >SSH agent, optional</text>
<rect x="654" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="107.0" class="ag" text-anchor="middle" >av ssh-agent</text>
<text x="903.0" y="131.0" class="ag" text-anchor="middle" >its own socket</text>
<rect x="654" y="160" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="170" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="187.0" class="ag" text-anchor="middle" >One gate per key</text>
<text x="903.0" y="211.0" class="ag" text-anchor="middle" >each with its own policy</text>
<rect x="654" y="240" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="250" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="267.0" class="ag" text-anchor="middle" >Signs in memory</text>
<text x="903.0" y="291.0" class="ag" text-anchor="middle" >keys never in the system agent</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="836.0" cy="527" r="14" class="num"/>
<text x="836.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="856.0" y="536" class="gt" text-anchor="start" >Homebrew</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Execution Gate</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >no secret involved</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Read &amp; Update</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >default · reads + brew update</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Install · upgrade · remove</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >not in the default</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="195.5" cy="527" r="14" class="num"/>
<text x="195.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="215.5" y="536" class="gt" text-anchor="start" >Git over HTTPS</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >av git</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >protected HTTPS path</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Narrows the gh credential</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >for Git's network step</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Still under validation</text>
</svg>
