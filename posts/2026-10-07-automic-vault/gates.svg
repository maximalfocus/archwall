<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Signing, SSH and Homebrew</title>
<desc id="d">1 GPG signing: Git hands the commit to av-gpg; the private key stays in the Keychain and Git never sees it; the gate offers Approval Required, its default, or Allow Signing. 2 SSH agent, optional: av ssh-agent serves its own socket; each key has its own gate and policy; it signs in memory and private keys are never added to the system agent. 3 Homebrew: an Execution Gate controls brew even when no secret is involved; its default, Read &amp; Update, allows reads and brew update but not install, upgrade or remove. 4 Git over HTTPS: av git is a protected HTTPS path that narrows use of the gh credential; it is still under validation.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
