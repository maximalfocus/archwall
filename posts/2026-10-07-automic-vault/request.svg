<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">One request</title>
<desc id="d">In: an AI agent with Read Only access runs gh issue create. 1 Who is asking: the Launcher, here the agent app; the Gate Client, the signed piece that sends the request; and the Target, the program that will use the secret. Client and Target are kept apart. 2 Check: the Launcher's identity from its live code signature; the complete request, meaning command, arguments, folder and secret names; and denial rules, which are checked first. Any failed check denies. 3 Decide: a Blessing, the gate's policy or a Temporary Access Grant may allow it; an unknown or too broad operation needs Approval, which can allow or deny. With Read Only, gh issue create needs Approval. 4 Release: the Authorization Record is saved and read back, then the secret is applied or the Target runs, and the menu bar shows the live use.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: an agent with Read Only runs gh issue create</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="202.25" cy="111" r="14" class="num"/>
<text x="202.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="222.25" y="120" class="gt" text-anchor="start" >Who is asking</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Launcher</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >the agent app</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Gate Client</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >signed · sends the request</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Target</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >the program that uses the secret</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Client and Target are kept apart</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="856.25" cy="111" r="14" class="num"/>
<text x="856.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="876.25" y="120" class="gt" text-anchor="start" >Check</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Launcher identity</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >live code signature</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >The whole request</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >command · folder · secret names</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Denial rules</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >checked first</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Any failed check → denied</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="849.5" cy="527" r="14" class="num"/>
<text x="849.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="869.5" y="536" class="gt" text-anchor="start" >Decide</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Blessing · policy · grant</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >may allow it</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Unknown or too broad</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >needs Approval</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Approval</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >allow or deny</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Read Only + issue create → Approval</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="242.75" cy="527" r="14" class="num"/>
<text x="242.75" y="533" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="536" class="gt" text-anchor="start" >Release</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Authorization Record</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >saved and read back</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Apply the secret</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >or run the Target</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Live use</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >shown in the menu bar</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >request</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >verified</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >allowed</text>
</svg>
