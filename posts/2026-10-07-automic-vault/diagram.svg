<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Automic Vault overview</title>
<desc id="d">In: you, a terminal or an AI agent runs a tool such as gh, aws or brew on a Mac. 1 Set up once: av scan checks over 100 developer-tool configurations for exposed credentials, av harden moves a supported tool's credentials into the macOS Keychain and changes how the tool asks for them, and av doctor checks that protection. 2 A command asks: the Launcher (a terminal, IDE or agent app) starts the tool, a signed Automic Vault Gate Client sends the request, and the tool's Authorization Gate on the Mac receives it. 3 Decide: the Mac checks the Launcher's live code signature, applies the gate's default Access Level or a rule for that Launcher, and asks for Approval on the Mac, with Touch ID or on an iPhone when policy cannot allow it; unknown operations always need Approval. 4 Record and release: an Authorization Record is saved and read back first, then the secret goes to the program that needs it; with no record there is no secret.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: you or an AI agent runs gh, aws, brew …</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="215.75" cy="111" r="14" class="num"/>
<text x="215.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="235.75" y="120" class="gt" text-anchor="start" >Set up once</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >av scan</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >finds exposed credentials</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >av harden &lt;tool&gt;</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >moves them into the Keychain</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >av doctor</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >checks the protection</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Over 100 tool configurations checked</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="795.5" cy="111" r="14" class="num"/>
<text x="795.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="120" class="gt" text-anchor="start" >A command asks</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Launcher</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >terminal · IDE · agent app</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Gate Client</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >signed piece that sends the request</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Authorization Gate</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >one per tool · on the Mac</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="849.5" cy="527" r="14" class="num"/>
<text x="849.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="869.5" y="536" class="gt" text-anchor="start" >Decide</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Who is asking?</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >live code signature check</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Access Level</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >gate default or launcher rule</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Approval</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >Mac · Touch ID · iPhone</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Unknown operations always ask</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="168.5" cy="527" r="14" class="num"/>
<text x="168.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="188.5" y="536" class="gt" text-anchor="start" >Record and release</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Record first</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >saved and read back</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Secret to the program</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >e.g. gh gets its token</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Keychain</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >the secret stays here otherwise</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >No record, no secret</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >later</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >request</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >allowed</text>
</svg>
