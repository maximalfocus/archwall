<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Human Approval</title>
<desc id="d">In: a request that policy cannot allow. 1 On the Mac: an Approval window shows the complete request and the chain of programs behind it; optional Touch ID needs a fresh fingerprint each time. Mac approval needs an active session and awake displays. 2 On an iPhone, optional: the iPhone app on the same iCloud Keychain account; an encrypted relay server passes requests and answers but cannot read or forge them; allowing needs a subscription, denying does not. 3 The Mac checks the answer: it must match the exact request, the first valid answer wins and replays are rejected, and the record is saved before release. 4 Limits: when the Mac is locked only secrets marked available while locked can be used; with iPhone Approval on, the Mac has no click-to-allow; if the phone or relay is unreachable the request fails closed unless Touch ID Approval is also enabled.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a request policy cannot allow</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="222.5" cy="111" r="14" class="num"/>
<text x="222.5" y="117" class="numt" text-anchor="middle" >1</text>
<text x="242.5" y="120" class="gt" text-anchor="start" >On the Mac</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Approval window</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >full request + program chain</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Touch ID, optional</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >fresh fingerprint each time</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Needs an active session</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >and awake displays</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="741.5" cy="111" r="14" class="num"/>
<text x="741.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="761.5" y="120" class="gt" text-anchor="start" >On an iPhone, optional</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >iPhone app</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >same iCloud Keychain account</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Encrypted relay</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >can't read or forge requests</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Subscription</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >needed to allow · not to deny</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="721.25" cy="527" r="14" class="num"/>
<text x="721.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="741.25" y="536" class="gt" text-anchor="start" >The Mac checks the answer</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Exact match</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >bound to this request</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >First valid answer wins</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >replays rejected</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="763.0" class="ag" text-anchor="middle" >Record · then release</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="249.5" cy="527" r="14" class="num"/>
<text x="249.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="536" class="gt" text-anchor="start" >Limits</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Mac locked</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >only secrets available while locked</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >iPhone Approval on</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >no click-to-allow on the Mac</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Phone or relay down</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >fails closed unless Touch ID</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >or</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >answer</text>
</svg>
