<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Access rules</title>
<desc id="d">1 Access Levels, presets a gate offers: Approval Required asks every time, Read Only allows recognized reads, Write Access allows recognized reads and writes, and Full Access may allow recognized sensitive operations; some gates add Read &amp; Update (Homebrew) or Local Write between them. 2 Per gate: each gate has a default level, new secret gates start at Read Only, rules for a Verified Launcher override the default, and unknown operations need Approval at every level. 3 Example, one GitHub token at Read Only: gh issue list is allowed automatically, gh issue create needs Approval, and gh auth token, which shows the secret, needs Approval. 4 Short-lived changes: a Temporary Access Grant gives Write Access for ten active minutes to one gate, launcher and agent task; denial rules are checked before anything that allows; a temporary denial blocks one launcher at one gate for two minutes.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
