.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="448" rx="12" class="grp"/>
<circle cx="249.5" cy="43" r="14" class="num"/>
<text x="249.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="269.5" y="52" class="gt" text-anchor="start" >Detect</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Detectors</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >100+ tool configurations</text>
<rect x="54" y="160" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="170" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="187.0" class="ag" text-anchor="middle" >Findings</text>
<text x="303.0" y="211.0" class="ag" text-anchor="middle" >exposure or hazard + a fix</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Read only: never uses a secret</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >A clean scan is not a guarantee</text>
<rect x="624" y="16" width="552" height="448" rx="12" class="grp"/>
<circle cx="849.5" cy="43" r="14" class="num"/>
<text x="849.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="869.5" y="52" class="gt" text-anchor="start" >Harden</text>
<rect x="654" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="107.0" class="ag" text-anchor="middle" >Move the secret</text>
<text x="903.0" y="131.0" class="ag" text-anchor="middle" >file → macOS Keychain</text>
