<text x="836.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="856.0" y="536" class="gt" text-anchor="start" >Isotopes</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Isotope</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >an AV-compatible build</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Signed fork releases</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >pinned in a Homebrew tap</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Some vendor releases</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >kept signed under /opt/av</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >No Homebrew: verified, installed directly</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="249.5" cy="527" r="14" class="num"/>
<text x="249.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="536" class="gt" text-anchor="start" >Verify</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >av doctor</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >identity · owner · permissions</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Which command runs</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >the protected one first</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Wrappers guard their own path,</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >not every way to run a program</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >findings</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >installs</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >then</text>
</svg>
