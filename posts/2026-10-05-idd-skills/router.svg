<text x="748.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="768.25" y="536" class="gt" text-anchor="start" >Only when you name it</text>
<rect x="654" y="560" width="240" height="48" rx="8" class="agent"/>
<rect x="654" y="570" width="5" height="28" rx="2" fill="#8a5cc7"/>
