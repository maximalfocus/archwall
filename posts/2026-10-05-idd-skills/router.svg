<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd router</title>
<desc id="d">You type /idd and a request, for example /idd 6. 1 Orient first: run protect-main.sh ensure, which prints the integration and release branches, then read the request: an issue number, a PRD pair, a phase named in words; then load that one phase's SKILL.md and run it in full. If a skill it needs is missing, it stops and names it. 2 Phases it may infer: an issue number or URL goes to /idd-implement; what to do next goes to /idd-plan in its read-only default mode; checking the finished product goes to /idd-acceptance. 3 Only when the request names it: /idd-issue, /idd-land, /idd-auto, /idd-promote, /idd-publish, /idd-evolve, and the /idd-plan modes bootstrap, reconstruct and reconcile. Never from state, history or an earlier turn. 4 Routing adds no authority: if two phases fit or none does, it asks one question and never guesses; one phase per request; the same gates as calling the phase directly; and it says in one line which phase it chose and why. A missing PRD pair is a question, never a reason to bootstrap.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
