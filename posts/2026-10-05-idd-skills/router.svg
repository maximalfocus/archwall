<text x="1029.0" y="707.0" class="ag" text-anchor="middle" >/idd-evolve</text>
<rect x="654" y="734" width="492" height="48" rx="8" class="agent"/>
<rect x="654" y="744" width="5" height="28" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="765.0" class="ag" text-anchor="middle" >/idd-plan bootstrap, reconstruct, reconcile</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Never from state, history</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >or an earlier turn</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="121.25" cy="527" r="14" class="num"/>
<text x="121.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="141.25" y="536" class="gt" text-anchor="start" >Routing adds no authority</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Two fit, or none?</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >ask one question, never guess</text>
