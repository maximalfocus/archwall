<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >protect-main.sh ensure</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >prints integration and release</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
