<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-plan modes</title>
<desc id="d">/idd-plan picks its mode from what exists: no PRD yet, or an exact pair. 1 New product, greenfield: ask about the product one decision at a time, draft PRD.md and PROGRESS.md with small slices in dependency order, and push a private, protected repository, or only show the drafts if you ask for a draft. It picks the technology itself unless that changes the product. 2 Existing code, reconstruct: read the whole repository with its tests, docs and history, describe what it does at one named commit, and record one verified baseline; past commits never become slices. The --scope flag limits it to some paths in a repository too big to read at once. Both then push the PRD repository and go on in default mode. 3 Default, what next: read the PRD, the tracker and GitHub without changing them, pick one next issue in dependency order, and write an issue contract with outcome, acceptance and non-goals. 4 Reconcile, the tracker: run by the --reconcile flag or automatically after /idd-land; edit PROGRESS.md only, never PRD.md; run the gates, then commit to the batch pull request, which is merged at a milestone. Stale requirement text is reported, and fixed by your own docs(prd) pull request. No mode writes a plan file or a backlog, and there is at most one next issue.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
