<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-acceptance</title>
<desc id="d">In: a finished pair, every issue landed, both trees clean. 1 Bind: the exact pair with everything landed and no open issue, pull request or feature branch; if a tracker batch is still open it stops, since that needs a reconcile first; then each PRD outcome becomes a user journey, plus checks on the whole product. Unit tests alone are never the final boundary. 2 The real boundary: a browser product through Playwright, by role and label; an HTTP service as its real process with real dependencies; a CLI or library in a fresh setup with pinned output; a container, worker or migration started for real, waiting for health, with throwaway state. 3 Run it: start from clean or seeded state and wait for readiness, never fixed sleeps; run every journey, a bad path, and a restart when it matters; check that each preserved artifact exists and matches its row. Always tear down, even after a failure. 4 PASS, or FAIL by kind: a product bug becomes one normal repair issue; bad fixture or data is fixed and run again; an unclear spec stops and asks for a clear contract; an environment problem is reported as the exact blocker. It never deploys, merges, edits the PRD or weakens a test.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
