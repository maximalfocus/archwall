<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-implement</title>
<desc id="d">In: one open issue, read with its comments. 1 Safe start: protect-main.sh ensure, so pull requests target dev; read the issue and comments, which must be OPEN and in this repository; make the branch issue/&lt;N&gt;-&lt;slug&gt;, never work on the default branch. With a dirty tree it asks, or works in a separate worktree. 2 Small change: a plan in chat with the outcome, checks and non-goals; trace the path from entry point through logic to result; the smallest coherent diff that follows existing patterns; tests at the boundary, with a regression test for a bug. 3 Verify, cheapest first: unit and regression tests, then typecheck and lint, then integration and the repository gate, then the changed boundary itself: container, CLI, route or browser. 4 Open the pull request: commit only the issue's files with typed subjects and lines within 100 characters; a pull request into dev titled exactly like the issue; a Delivery-Type line; Closes #N only if every acceptance item is proven. It never merges, deploys or closes the issue by hand. A red check is fixed if this branch caused it, proven to be red before, or named as a blocker.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
