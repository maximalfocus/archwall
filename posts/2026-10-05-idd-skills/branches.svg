<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills branches</title>
<desc id="d">Delivery phases start with protect-main.sh ensure. 1 dev, the integration branch: one issue/&lt;N&gt;-&lt;slug&gt; branch per issue; dev is the default branch every issue pull request targets; squash only, one commit per issue pull request; linear history, no force-push, no deletion. 2 main, the release branch: changed only by the optional /idd-promote, one dev to main pull request merged as a merge commit so main never drifts from dev, and only when GitHub reports it clean; the --open-only flag waits for review. Promoting is not deploying: nothing is hosted or published. 3 The PRD repository has one branch, main: the tracker changes through a progress/batch pull request merged at milestones, the contract through your own docs(prd) pull request on a prd/&lt;slug&gt; branch, and a local pre-push hook refuses a direct push. It never uses dev, and the first commit at bootstrap is its only direct push. 4 Set up by protect-main.sh: a pull request is required, with no bypass and review threads resolved. On a private repository only the merge settings apply, and the rules are applied once it is public. A line Integration-branch: main opts a repository out of dev. Protection is set at bootstrap and checked before every landing. Names are rules too: the pull request title equals the issue title, commit subjects are typed, and added lines stay within 100 characters.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
