<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-land</title>
<desc id="d">You run /idd-land with an issue; /idd-auto and /idd-publish may also call it. 1 Refuse early: a clean tree, the right repository and exactly one linked pull request; checks green, not a draft, no changes requested; and the tracker row found before anything on GitHub changes. Anything ambiguous stops before GitHub changes. 2 Acceptance gate: every acceptance item proven from the pull request, the tests and the current code, and the change fits the product model. If anything is unproven it stops; only the --accept-residuals flag goes on, and that flag never overrides red checks, requested changes or conflicts. 3 land.sh, one script: it checks the names (pull request title equals the issue title, branch issue/&lt;N&gt;-&lt;slug&gt;), the branch protection and the line width, composes the commit subject from the Delivery-Type line, for example fix: &lt;issue title&gt; (#PR), squash-merges into dev bound to the checked commit, closes the issue, deletes the branch, pulls dev and verifies all of it. 4 Then the tracker: the tracker gate keeps PROGRESS.md within budget, /idd-plan reconcile commits to the batch pull request, and if this fails the merge stands and the failure is reported. With no PRD repository it reports not configured. land.sh is read whole before it runs, so a checkout that changes cannot alter it.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
