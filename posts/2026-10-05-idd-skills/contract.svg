<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills product contract</title>
<desc id="d">Inside the private {project}-prd repository. 1 PRD.md is one coherent model: requirements with stable IDs, the accepted behaviour; slices, small and in order, one issue each; the domain boundary with explicit non-goals; and preserved artifacts, the files a rewrite must keep. 2 PROGRESS.md, using the same IDs, is a control panel: status per slice (ready, active, blocked), a baseline of what is done and verified, and an update rule for how rows may change. It carries no dates, since Git and GitHub keep the history. 3 Budgets checked by scripts: PRD.md at most 1,000 words a section and 10,000 in all; PROGRESS.md at most 80 words a cell and a baseline of at most 20 lines. They change only through /idd-evolve, never per project, and were set from 4 real contracts and 11 trackers. 4 Once a slice is validated, its acceptance moves into the requirement it extends and the slice shrinks to one row; the fold gate flags a slice still holding a section. So the PRD grows with the model, not with the number of deliveries. A product too big for one model splits its PRD into contexts, each with its own scope.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
