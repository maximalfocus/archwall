<text x="188.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="208.75" y="120" class="gt" text-anchor="start" >Bind the target</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Exact PRD and code pair</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >code repo missing? made, private</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Read PRD, tracker, GitHub</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >fresh at every turn</text>
