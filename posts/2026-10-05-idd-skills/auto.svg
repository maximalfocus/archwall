<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-auto loop</title>
<desc id="d">You run /idd-auto with a project, once. 1 Bind the target: the exact PRD and code pair, and if only the code repository is missing it is created, private; read the PRD, the tracker and GitHub fresh at every turn; done means every requirement has landed or been validated, with clean trees and no branch or batch left open. 2 One issue at a time, in a loop: resume active work before starting new; /idd-plan then /idd-issue for the one next issue; /idd-implement, which waits for checks and reviews; /idd-land to merge, close and reconcile; then the next issue. 3 When no issue is left, the whole product: merge the tracker batch, run /idd-acceptance as a required final gate, and turn a product bug into one repair issue under the same slice, back into the loop. A new feature stops for your OK, and the PRD changes first. 4 It stops and never bends: a red check, a conflict or an open product choice becomes one precise blocker; if you can clear it, it asks one question and resumes; it never publishes, promotes or accepts residuals. There is no trace file: each turn reads GitHub and the PRD again. Finishing ends its authority, so a later request needs its own go-ahead.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
