<rect x="654" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="891.0" y="335.0" class="ag" text-anchor="middle" >/idd-implement</text>
<text x="891.0" y="359.0" class="ag" text-anchor="middle" >waits for checks and reviews</text>
<rect x="654" y="388" width="468" height="64" rx="8" class="agent"/>
<rect x="654" y="398" width="5" height="44" rx="2" fill="#d64545"/>
<text x="891.0" y="415.0" class="ag" text-anchor="middle" >/idd-land</text>
<text x="891.0" y="439.0" class="ag" text-anchor="middle" >merge, close, reconcile</text>
<path d="M1122 420.0H1164V180.0H1124" class="flow back"/>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="741.5" cy="527" r="14" class="num"/>
<text x="741.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="761.5" y="536" class="gt" text-anchor="start" >Then the whole product</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="603.0" class="ag" text-anchor="middle" >Merge the tracker batch</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >/idd-acceptance</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >a required final gate</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Product bug?</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >one repair issue, same slice</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >New feature? Stop for your OK,</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >then the PRD changes first</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="168.5" cy="527" r="14" class="num"/>
<text x="168.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="188.5" y="536" class="gt" text-anchor="start" >Stops, never bends</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Red check, conflict, open choice</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >one precise blocker</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >You can clear it?</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >one question, then resume</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Never</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >publish, promote, accept residuals</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >No trace file: each turn reads</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >GitHub and the PRD again</text>
