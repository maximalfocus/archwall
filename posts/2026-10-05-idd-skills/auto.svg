<text x="303.0" y="359.0" class="ag" text-anchor="middle" >every requirement landed or validated</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Done also needs clean trees,</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >no branch or batch left open</text>
