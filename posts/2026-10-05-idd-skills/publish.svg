<text x="903.0" y="775.0" class="ag" text-anchor="middle" >metadata, package and doc links</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Any match blocks</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >the visibility change</text>
