<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-publish</title>
<desc id="d">You run /idd-publish with a project, explicitly. 1 Prepare, still private: reconcile the tracker at this pre-publish milestone; one preparation issue goes through plan, issue, implement and land; a license, MIT by default, green tests and an end-to-end check. The preparation change is scanned before it is pushed. 2 Scan every commit: every commit message and every file on every ref, old pull request refs too, since GitHub keeps them, for secrets and private names from a built-in list plus your terms. A hit in a commit message cannot be purged: publish from a new repository, or you accept it knowingly. 3 Check by hand: issues, comments, reviews and their edit history; Actions runs, logs and artifacts; branches, tags, releases, repository metadata, and package and documentation links. Any match blocks the visibility change. 4 Flip and verify: the code repository becomes public and the PRD repository stays private; check while signed out that the code is readable and the PRD is denied; re-apply protection, so the rulesets are now enforced. Publishing is not deploying: no hosting, release or package.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
