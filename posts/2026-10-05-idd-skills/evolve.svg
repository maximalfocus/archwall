<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-evolve</title>
<desc id="d">In: evidence from real runs, or a simplify pass. 1 Evidence: post-plan looks at issue order and tracker accuracy; post-create at how an issue was written; post-issue at one issue's diff, checks and pull request; simplify merges, compresses or deletes. 2 The gate is the constitution: proven and high value, not already covered, smaller than the friction it removes and preferring deletion to addition, leaving past issues the same or better by naming the one it could hurt, and within the size caps of 60 to 160 lines per skill file. 3 Pass: the smallest edit, with validate.sh passing; propose.sh opens a pull request on evolve/&lt;slug&gt; and never writes main; the maintainer reviews, and land-evolution.sh merges it on their word. Skills linked to the checkout keep serving main until it lands. 4 Fail: nothing happens, no log and no queue; git history is the only record. New features do not come this way; they go through the PRD and an issue. One reproduced defect is proof enough, while advice on behaviour needs several runs.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
