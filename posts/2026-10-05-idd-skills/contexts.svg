<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills contexts</title>
<desc id="d">One coherent product contract can be too big for one model; then the private PRD splits into contexts. The root PRD.md is the index: a Contexts table, a portfolio panel with a row for every context, and the manifest and cross-context invariants. A context is admitted only when work is planned there, and it is one coherent model with its own Scope of implementation paths, a Depends on list naming the contexts it references without restating them, and its own non-goals. An issue carries its context's name as a label, changed files must resolve to that context, and one context per issue goes dependency first; a change that crosses contexts is a design decision in the index first. The --context flag works on one context at a time, the contract gate runs over the index and then every context, and the portfolio order picks the earliest unmet dependency.</desc>
