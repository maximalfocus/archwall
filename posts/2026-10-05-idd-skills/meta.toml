title_zh = "idd-skills：AI 一次做一个 GitHub issue，把产品做出来"
title_en = "idd-skills: AI builds your product one GitHub issue at a time"
date = "2026-10-05"
tags = ["coding-agent", "skills", "github", "workflow", "git"]
figure = "diagram.svg"
alt_zh = "idd-skills 总览：输入是你的产品想法，或已有的代码；1 规划：/idd-plan 从想法或现有代码出发，写进私有的 PRD 仓库（PRD.md、PROGRESS.md），按依赖顺序挑下一个 issue；2 做一个 issue：/idd-issue 查重后建 issue，/idd-implement 开分支、写测试、开 PR 进 dev，它从不合并，合并是 /idd-land 的事；落地前可以用 /peerreview 评审，那是另一个技能；3 落地：/idd-land 检查后压成一个提交合进 dev，关 issue、删分支，进度更新进 PRD 仓库的批量 PR；虚线回到规划，开始下一轮，/idd-auto 会自己一轮轮做；4 收尾，全部落地之后：/idd-acceptance 端到端测整个产品，/idd-promote 在你决定时把 dev 推进 main（一个合并提交），可选的 /idd-publish 公开代码，PRD 保持私有；/idd 把任何请求交给对应阶段，/idd-evolve 改进方法本身"
alt_en = "idd-skills overview: in comes your product idea, or code you already have; 1 plan: /idd-plan, from an idea or from existing code, writes into a private PRD repo with PRD.md and PROGRESS.md, and picks one next issue in dependency order; 2 build one issue: /idd-issue files it after a duplicate search, /idd-implement makes a branch, tests and a PR into dev, and never merges, which is /idd-land's job; an optional review before landing comes from /peerreview, a separate skill; 3 land: /idd-land checks, then squashes into dev, the issue is closed and the branch deleted, and the tracker update goes into a batch PR in the PRD repo; a dashed arrow goes back to plan for the next round, and /idd-auto loops on its own; 4 finish, once all have landed: /idd-acceptance tests the whole product end to end, /idd-promote moves dev to main with one merge commit when you choose, and the optional /idd-publish makes the code public while the PRD stays private; /idd routes any request to its phase, and /idd-evolve improves the method itself"
source = "https://github.com/maximalfocus/idd-skills (commit f905928)"

[[figures]]
file = "package.svg"
alt_zh = "工具包：在 Claude Code、Codex、Pi 或 OpenCode 里运行；1 十个技能，纯文本：/idd、/idd-plan、/idd-issue、/idd-implement、/idd-land、/idd-auto、/idd-acceptance、/idd-promote、/idd-publish、/idd-evolve；2 配套脚本：建仓库和合并（init-*.sh、land.sh、promote.sh），GitHub 上的分支规则（protect-main.sh），各种关卡（PRD 字数、进度表、行宽、泄露扫描）；固定步骤写成脚本，判断留在技能文本里；3 通过 git 和 gh 操作 GitHub：issue 和 PR，合并和分支，仓库设置、规则集和公开状态；每个产品一个代码仓库，加一个做规划的私有 PRD 仓库；4 包里的规则：CONSTITUTION.md 规定方法怎么改，conventions.md 规定命名、分支和行宽，每个技能文件限 60 到 160 行；validate.sh 检查这些，每次提交前都跑；安装全部十个：npx skills add maximalfocus/idd-skills --skill '*'"
alt_en = "The kit: it runs inside Claude Code, Codex, Pi or OpenCode; 1 ten skills, plain text: /idd, /idd-plan, /idd-issue, /idd-implement, /idd-land, /idd-auto, /idd-acceptance, /idd-promote, /idd-publish and /idd-evolve; 2 bundled scripts they run: repo setup and merges (init-*.sh, land.sh, promote.sh), branch rules on GitHub (protect-main.sh), and gates for PRD size, the tracker, line width and exposure; fixed steps are scripts, judgment stays in the skill text; 3 GitHub, through git and gh: issues and pull requests, merges and branches, settings, rulesets and visibility; per product a code repo, plus a private PRD repo for planning; 4 rules in the box: CONSTITUTION.md, how the method may change, conventions.md, names, branches and line width, and size caps of 60 to 160 lines for each skill file; validate.sh checks them and runs before every commit; install all ten with npx skills add maximalfocus/idd-skills --skill '*'"
caption_zh = "工具包：十个技能、配套脚本和规则文件，在你的编程助手里运行"
caption_en = "The kit: ten skills, bundled scripts and rule files, run inside your coding agent"

[[figures]]
file = "repos.svg"
alt_zh = "两个仓库：一个产品，两个 GitHub 仓库，克隆在相邻目录；1 {project}，代码：代码、测试、文档，产品本身；issue 和 PR，每个 issue 一个 PR；分支 dev、main、issue/<N>-<slug>；由 IDD 创建时是私有的，/idd-publish 可以公开它；2 {project}-prd，规划：PRD.md（需求、切片、非目标），PROGRESS.md（哪些就绪、进行中、受阻），只有 main 一个分支，通过 PR 修改；永远私有，从不公开；PRD 这边把下一个 issue 交给代码这边，落地的结果流回进度表；3 怎么找到对方：相邻目录，比如 widget 和 widget-prd；同一个 GitHub 所有者，从两边的 origin 核对；所有者不同时用设置 git config idd.prdRepo；没有 PRD 仓库时 issue 照常能做，落地时跳过进度表；4 谁说了算：GitHub 管发生了什么（issue、PR、合并），PRD.md 管想要什么，PROGRESS.md 是核对过的证据，不是许可；提交、issue 和 PR 从不提私有 PRD 仓库的名字；新产品先有 PRD 仓库，/idd-auto 可以再建私有的代码仓库"
alt_en = "Two repos: one product, two GitHub repositories, cloned side by side; 1 {project}, the code: code, tests and docs, the product itself; issues and PRs, one PR for each issue; branches dev, main and issue/<N>-<slug>; private when IDD creates it, and /idd-publish can make it public; 2 {project}-prd, the plan: PRD.md with requirements, slices and non-goals, PROGRESS.md with what is ready, active or blocked, and one branch, main, changed by pull request; always private, never published; the PRD side sends the next issue to the code side and landed work flows back; 3 how they find each other: sibling folders such as widget and widget-prd, the same GitHub owner checked from both origins, or for another owner the setting git config idd.prdRepo; with no PRD repo issues still work and landing skips the tracker; 4 who is right about what: GitHub about what happened (issues, PRs, merges), PRD.md about what is wanted, and PROGRESS.md is checked evidence, not permission; commits, issues and PRs never name the private PRD repo; for a new product the PRD repo comes first, and /idd-auto can create the code repo, private"
caption_zh = "两个仓库：一个放代码，一个私有，放需求和进度"
caption_en = "Two repos: one for the code, one private for requirements and progress"

[[figures]]
file = "branches.svg"
alt_zh = "分支：交付阶段都先跑 protect-main.sh ensure；1 dev，集成分支：每个 issue 一个分支 issue/<N>-<slug>；dev 是默认分支，每个 issue 的 PR 都合到这里；只能压成一个提交合并；线性历史，不许强推、不许删除；2 main，发布分支：只有可选的 /idd-promote 能改它，一个 dev 到 main 的 PR，用合并提交，main 不会和 dev 分叉，只在状态为 CLEAN 时合并，参数 --open-only 只开 PR 等评审；发布到 main 不是部署，不托管也不发布任何东西；3 PRD 仓库只有 main：进度表通过 progress/batch PR，到里程碑才合并，需求改动由你自己在 prd/<slug> 上开 docs(prd) PR，本地 pre-push 钩子拒绝直接推送；从不用 dev，初始化时的第一个提交是唯一一次直接推送；4 由 protect-main.sh 设置：必须走 PR，没有例外，评审讨论要解决；私有仓库只有合并设置，公开后才加上规则；在文件里写一行 Integration-branch: main 就不用 dev；初始化时设置，每次落地前检查；命名也是规则：PR 标题等于 issue 标题，提交标题带类型，行宽不超过 100 个字符"
alt_en = "Branches: delivery phases start with protect-main.sh ensure; 1 dev, integration: one issue/<N>-<slug> branch per issue, dev is the default branch every issue PR targets, squash only with one commit per issue PR, and linear history with no force-push and no deletion; 2 main, release: only the optional /idd-promote changes it, with one dev to main PR, merged as a merge commit so main never drifts from dev, and only when CLEAN; the flag --open-only waits for review; promoting is not deploying, nothing is hosted or published; 3 the PRD repo has main only: the tracker through a progress/batch PR merged at milestones, contract changes through your own docs(prd) PR on prd/<slug>, and a local pre-push hook refuses a direct push; it never uses dev, and the first commit at bootstrap is its only direct push; 4 set up by protect-main.sh: PR required, no bypass, review threads resolved; a private repo gets the settings only and the rules once public; opt out of dev with the line Integration-branch: main; set at bootstrap, checked before every landing; names are rules too: PR title equals issue title, typed commit subjects, lines of at most 100 characters"
caption_zh = "分支：issue 合进 dev，main 只能通过 /idd-promote 前进"
caption_en = "Branches: issues land on dev; main moves only through /idd-promote"

[[figures]]
file = "router.svg"
alt_zh = "入口：你输入 /idd 加请求，比如 /idd 6；1 先弄清楚：protect-main.sh ensure 打印集成分支和发布分支；读请求：有没有 issue 号，有没有 PRD 配对，有没有点名阶段；加载那一个阶段的 SKILL.md，完整执行；需要的技能缺了就停下并说出名字；2 可以推断的：issue 号或链接交给 /idd-implement，下一步做什么交给只读的 /idd-plan，检查做完的产品交给 /idd-acceptance；3 只有你点名才做：/idd-issue、/idd-land、/idd-auto、/idd-promote、/idd-publish、/idd-evolve，以及 /idd-plan 的初始化、重建、对账三种模式；从不根据状态、历史或之前的对话推断；4 路由不增加权限：两个都合适或一个都不合适时，问一个问题，从不猜；一个请求只走一个阶段；关卡和直接调用那个阶段一样；用一句话说明选了哪个阶段、为什么；还没有 PRD 配对时要问你，绝不因此自动初始化"
alt_en = "The way in: you type /idd and a request, for example /idd 6; 1 orient first: protect-main.sh ensure prints the integration and release branches; read the request: an issue number, a PRD pair, a phase named; load that one phase's SKILL.md and run it in full; if a skill it needs is missing it stops and names it; 2 can be inferred: an issue number or URL goes to /idd-implement, what to do next goes to /idd-plan, read-only, and checking the finished product goes to /idd-acceptance; 3 only when you name it: /idd-issue, /idd-land, /idd-auto, /idd-promote, /idd-publish, /idd-evolve, and the /idd-plan modes bootstrap, reconstruct and reconcile; never from state, history or an earlier turn; 4 routing adds no authority: if two fit or none does it asks one question and never guesses, one phase per request, the same gates as calling the phase directly, and it says which phase it chose and why in one line; no PRD pair yet is a question, never a reason to bootstrap"
caption_zh = "入口：/idd 把请求交给一个阶段，路由不增加权限"
caption_en = "The way in: /idd hands a request to one phase and adds no authority"

[[figures]]
file = "plan.svg"
alt_zh = "规划：/idd-plan 按已有的东西选模式，还没有 PRD，或已有确定的配对；1 新产品，从零开始：一次问一个关于产品的决定；起草 PRD.md 和 PROGRESS.md，切片小、按依赖排序；推送一个受保护的私有仓库，你要求的话只给草稿；技术自己选，除非会改变产品；2 已有代码，重建：读整个仓库，代码、测试、文档、历史；在一个指定的提交上描述它做了什么；一个核对过的基线，过去的提交不变成切片；参数 --scope <paths> 用于大到一次读不完的仓库；两种模式推送 PRD 之后都进入默认模式；3 默认，下一步做什么：读 PRD、进度表和 GitHub，只读；挑一个下一个 issue，最早没满足的依赖；写 issue 合同，包括结果、验收和非目标；4 对账，进度表：参数 --reconcile，或 /idd-land 之后自动；只改 PROGRESS.md，从不改 PRD.md；先过关卡，再提交到批量 PR，到里程碑才合并；需求文字过时会报告，由你自己的 docs(prd) PR 修改；落地后从默认模式到对账，再回到默认模式挑下一个；没有哪个模式写计划文件或待办清单，最多只有一个下一个 issue"
alt_en = "Planning: /idd-plan picks its mode from what exists, no PRD yet or an exact pair; 1 new product, greenfield: ask about the product one decision at a time, draft PRD.md and PROGRESS.md with small slices in dependency order, and push a private, protected repo, or just drafts if you ask; it picks the tech itself unless that changes the product; 2 existing code, reconstruct: read the whole repo with code, tests, docs and history, describe what it does at one named commit, and keep one verified baseline, since past commits never become slices; the flag --scope <paths> is for a repo too big to read at once; both push the PRD and go on in default mode; 3 default, what next: read the PRD, tracker and GitHub, read-only, pick one next issue at the earliest unmet dependency, and write an issue contract with outcome, acceptance and non-goals; 4 reconcile, the tracker: the flag --reconcile, or automatically after /idd-land; edit PROGRESS.md only, never PRD.md; gates, then the batch PR, merged at a milestone; stale requirement text is reported and fixed by your own docs(prd) PR; after landing, default leads to reconcile and back to default for the next issue; no mode writes a plan file or a backlog, and there is at most one next issue"
caption_zh = "规划：四种模式，按已有的东西选"
caption_en = "Planning: four modes, picked by what already exists"

[[figures]]
file = "contract.svg"
alt_zh = "需求文档：在私有的 {project}-prd 里；1 PRD.md 是一个连贯的模型：需求，编号稳定，写的是已认可的行为；切片，小、有顺序，每个一个 issue；领域边界，明确的非目标；需保留的产物，重写时必须保留的文件；2 PROGRESS.md 是控制面板，用同样的编号：每个切片的状态，就绪、进行中、受阻；基线，已完成并核对过的；更新规则，行怎么改；不写日期，历史由 Git 和 GitHub 记着；3 字数上限，由脚本检查：PRD.md 每节不超过 1,000 词，全文不超过 10,000 词；PROGRESS.md 每格不超过 80 词，基线不超过 20 行；只能通过 /idd-evolve 修改，不按项目改；依据是 4 份真实的需求文档和 11 份进度表；4 切片验证通过之后：验收标准并进它扩展的那条需求，切片缩成表里的一行，折叠关卡会标出还占着一节的切片；PRD 跟着模型长，不跟着交付次数长；一个模型装不下的大产品，把 PRD 拆成几个上下文，各有自己的范围"
alt_en = "The contract: inside the private {project}-prd; 1 PRD.md, one coherent model: requirements with stable IDs, the accepted behaviour; slices, small, in order, one issue each; the domain boundary with explicit non-goals; preserved artifacts, the files a rewrite must keep; 2 PROGRESS.md, a control panel with the same IDs: status per slice, ready, active or blocked; a baseline of what is done and verified; an update rule for how rows may change; no dates, since Git and GitHub keep the history; 3 budgets checked by scripts: PRD.md at most 1,000 words a section and 10,000 in all, PROGRESS.md at most 80 words a cell and a baseline of at most 20 lines; changed only by /idd-evolve, never per project; set from 4 real contracts and 11 trackers; 4 a slice, once validated: its acceptance moves into the requirement it extends, the slice shrinks to one row in the slices table, and the fold gate flags a slice still holding a section; the PRD grows with the model, not with the number of deliveries; a product too big for one model splits its PRD into contexts, each with its own scope"
caption_zh = "需求文档：PRD.md 和 PROGRESS.md 装什么，限多少字"
caption_en = "The contract: what PRD.md and PROGRESS.md hold, and their word budgets"

[[figures]]
file = "issue.svg"
alt_zh = "建 issue：你要求建、创建或开一个 issue；1 先弄清楚：哪个仓库，来自 --repo、链接或当前目录；搜索开着的和关掉的 issue，像重复就停下、给出已有的那个；只收集需要的证据，不编造路径或标签；只有范围或行为真的不清楚时才问一个问题；2 写得小：标题写结果，不加类型前缀、编号或需求编号；问题和证据；验收标准，每条都能测；非目标，只在能避免误解时写；3 建之前的关卡：一个连贯的 issue，一次实现做得完；说法有证据，标准足够判断是否做完；符合产品模型，或把新概念、特例写成设计决定；不放私密内容，不放凭据、账号名或主目录路径；4 只建一次，再读回来：gh issue create，正文来自文件；结果不清楚就先搜索再重试；读回来核对仓库、标题、正文、OPEN 状态；只是起草或建议什么都不建；/idd-auto 可以建它的下一个 issue"
alt_en = "Filing an issue: you ask to file, create or open one issue; 1 pin it down: which repo, from --repo, a URL or this checkout; search open and closed issues, and on a likely duplicate stop and return it; only the evidence needed, no made-up paths or labels; one question only if scope or behaviour is really unclear; 2 draft it small: a title that states the outcome with no type prefix, number or IDs; problem and evidence; acceptance criteria, each one testable; non-goals only if they prevent confusion; 3 gate before creating: one coherent issue small enough for one run; claims backed by evidence, with criteria enough to judge done; fits the product model, or names a design decision; nothing private, no credentials, account names or home paths; 4 create once, read back: gh issue create with the body from a file; on an unclear result, search before any retry; read it back and check repo, title, body and OPEN; a request to draft or suggest creates nothing, and /idd-auto may file its one next issue"
caption_zh = "建 issue：只在你要求时建，先查重，建完读回来核对"
caption_en = "Filing an issue: only when asked, after a duplicate search, then read back"

[[figures]]
file = "implement.svg"
alt_zh = "实现：输入是一个开着的 issue，连同评论一起读；1 安全起步：protect-main.sh ensure，PR 都合到 dev；issue 和评论，必须是 OPEN、同一个仓库；分支 issue/<N>-<slug>，从不在默认分支上改；工作区不干净就先问，或在单独的 worktree 里做；2 小改动：在对话里列计划，结果、检查、非目标；从入口经过逻辑到结果，把路径走一遍；最小的连贯改动，沿用现有写法；在边界上写测试，修 bug 加回归测试；3 验证，便宜的先来：单元和回归测试，类型检查和 lint，集成测试和仓库的总检查，最后是改动真正生效的地方：容器、命令行、路由、浏览器；4 开 PR：只提交这个 issue 的文件，提交标题带类型，行宽不超过 100；PR 合到 dev，标题和 issue 一字不差；Delivery-Type 一行；只有全部验收都证明了才写 Closes #N；从不合并、部署或手动关 issue；检查变红：是这个分支造成的就修，证明原来就红，或说明卡在哪"
alt_en = "Implementing: in comes one open issue, read with its comments; 1 safe start: protect-main.sh ensure, so PRs target dev; issue and comments, which must be OPEN and in the same repo; the branch issue/<N>-<slug>, never the default branch; with a dirty tree it asks, or works in a separate worktree; 2 small change: a plan in chat with outcome, checks and non-goals; trace the path from entry point through logic to result; the smallest coherent diff, following existing patterns; tests at the boundary, a regression test for a bug; 3 verify, cheapest first: unit and regression tests, typecheck and lint, integration and the repo gate, then the changed boundary itself: container, CLI, route or browser; 4 open the PR: commit only the issue's files, typed subjects, lines of at most 100; a PR into dev titled exactly like the issue; a Delivery-Type line; Closes #N only if all is proven; it never merges, deploys or closes the issue by hand; a red check is fixed if new, proven red before, or named as the blocker"
caption_zh = "实现：从安全的分支到开 PR，到此为止"
caption_en = "Implementing: from a safe branch to an open PR, and no further"

[[figures]]
file = "land.svg"
alt_zh = "落地：你运行 /idd-land 加 issue，/idd-auto 和 /idd-publish 也会调用它；1 先拒绝不合格的：工作区干净、仓库对、正好一个关联的 PR；检查全绿、不是草稿、没人要求修改；在动 GitHub 之前找到进度表里那一行；有任何不明确就在 GitHub 变化前停下；2 验收关卡：每一项都证明了吗，依据 PR、测试和当前代码；符合产品模型，没有未记录的绕路；没证明就停下，只有参数 --accept-residuals 才继续，这个参数绝不越过红色检查、修改要求或冲突；3 land.sh 一个脚本：检查命名、保护和行宽，PR 标题等于 issue 标题，分支 issue/<N>-<slug>；从 Delivery-Type 组成提交标题，比如 fix: <issue title> (#PR)；压成一个提交合进 dev，绑定在检查过的那个提交上；关 issue、删分支、拉取 dev，全部核对；4 然后是进度表：进度表关卡，PROGRESS.md 不超限；/idd-plan 对账，提交到批量 PR；这一步失败的话，合并照样有效，并报告出来；没有 PRD 仓库就报告未配置；land.sh 运行前整个读进来，检出的文件变了也改不了它"
alt_en = "Landing: you run /idd-land with an issue, and /idd-auto and /idd-publish may also call it; 1 refuse early: clean tree, right repo, exactly one linked PR; checks green, not a draft, no changes requested; find the tracker row before touching GitHub; anything ambiguous stops before GitHub changes; 2 acceptance gate: every item proven from the PR, tests and current code; fits the product model with no unrecorded detours; not proven means stop, and only the flag --accept-residuals goes on, a flag that never overrides red checks, requested changes or conflicts; 3 land.sh, one script: names, protection and width checked, PR title equals the issue title and the branch is issue/<N>-<slug>; the subject comes from Delivery-Type, for example fix: <issue title> (#PR); squash into dev, bound to the checked commit; close the issue, delete the branch, pull dev and verify all; 4 then the tracker: the tracker gate keeps PROGRESS.md within budget, /idd-plan reconcile commits to the batch PR, and if this fails the merge stands and it is reported; with no PRD repo it reports not configured; land.sh is read whole before it runs, so a checkout that changes can't alter it"
caption_zh = "落地：唯一会合并的一步，然后更新进度"
caption_en = "Landing: the one step that merges, then the tracker update"

[[figures]]
file = "progress.svg"
alt_zh = "进度：输入是一个落地的 issue、它的 PR 和压缩提交；1 谁来写：/idd-land 每次合并后自动写；/idd-plan 加参数 --reconcile，用来修复或重新同步；/idd-publish 写公开那一行；只改 PROGRESS.md，从不改 PRD.md；2 先检查：进度表关卡，每格 80 词以内、不写日期；PRD 字数和折叠关卡，只报告；清单漂移，不许有没列出的文件；行宽不超过 100 个字符；3 一个开着的批量 PR：分支 progress/batch，提交标题 docs(progress): …；一直开着等评审，每次更新加一个提交；开着两个批量就停，直到只剩一个；4 到里程碑才合并：切片验证通过或一个版本完成，验收之前或公开之前，/idd-auto 结束时，或你自己运行 --reconcile；有修改要求或讨论没解决时，退出码 2，等待评审；pre-push 钩子拒绝直接推送到 PRD 的 main，如果克隆里已有自己的钩子就不装"
alt_en = "Progress: in come a landed issue, its PR and its squash commit; 1 who writes: /idd-land after every merge, automatically; /idd-plan with the flag --reconcile to repair or resync; /idd-publish for the publication row; only PROGRESS.md, never PRD.md; 2 checks first: the tracker gate with 80-word cells and no dates, the PRD size and fold gates, which only report, manifest drift with no unlisted files, and line width of at most 100 characters; 3 one open batch PR: the branch progress/batch with docs(progress) commits; it stays open for review and each update adds a commit; two batches open means stop until there is one; 4 merged at a milestone: a slice validated or a release finished, before acceptance or before publishing, at the end of /idd-auto, or your own --reconcile; with changes requested or threads open it exits with code 2, awaiting review; a pre-push hook refuses direct pushes to the PRD's main, skipped if the clone has its own hooks"
caption_zh = "进度：所有更新进一个批量 PR，到里程碑才合并"
caption_en = "Progress: updates gather in one batch PR, merged at milestones"

[[figures]]
file = "auto.svg"
alt_zh = "自动：你运行一次 /idd-auto 加项目；1 绑定目标：确定的 PRD 和代码配对，缺代码仓库就建一个私有的；每一轮都重新读 PRD、进度表和 GitHub；做完的意思是每条需求都已落地或已验证；还要工作区干净，没有留下开着的分支或批量；2 一次一个 issue：先接着做进行中的，再开始新的；/idd-plan 然后 /idd-issue，下一个 issue；/idd-implement，等检查和评审；/idd-land，合并、关闭、对账；虚线回到开头，做下一个 issue；3 没有 issue 剩下之后，整个产品：合并进度表的批量 PR；/idd-acceptance，必须通过的最后关卡；产品有 bug 就在同一个切片下开一个修复 issue，回到循环；新功能要停下等你同意，先改 PRD；4 只停下，不变通：检查变红、冲突、需要做产品选择，都变成一个明确的卡点；你能解决的，问一个问题再继续；从不公开、不发布到 main、不接受遗留问题；没有记录文件，每一轮重新读 GitHub 和 PRD；结束时它的权限也结束，之后的请求要重新授权"
alt_en = "Auto: you run /idd-auto with a project, once; 1 bind the target: the exact PRD and code pair, and a missing code repo is made, private; read the PRD, tracker and GitHub fresh at every turn; done means every requirement landed or validated, and also clean trees with no branch or batch left open; 2 one issue at a time: resume active work before starting new; /idd-plan, then /idd-issue for the one next issue; /idd-implement, which waits for checks and reviews; /idd-land to merge, close and reconcile; a dashed arrow loops back for the next issue; 3 then the whole product, when none are left: merge the tracker batch; /idd-acceptance, a required final gate; a product bug becomes one repair issue under the same slice, back into the loop; a new feature stops for your OK, and the PRD changes first; 4 stops, never bends: a red check, a conflict or an open choice becomes one precise blocker; if you can clear it, one question, then resume; it never publishes, promotes or accepts residuals; no trace file, each turn reads GitHub and the PRD again; finishing ends its authority, and a later request needs its own go-ahead"
caption_zh = "自动：一次一个 issue，循环到 PRD 做完，再验收"
caption_en = "Auto: one issue at a time until the PRD is done, then acceptance"

[[figures]]
file = "acceptance.svg"
alt_zh = "验收：输入是做完的配对，每个 issue 都已落地，工作区干净；1 绑定：确定的配对，全部落地，没有开着的 issue、PR 或分支；进度表的批量 PR 还开着就停，先对账；PRD 的结果变成用户旅程，再加上对整个产品的检查；只有单元测试永远不算最后一关；2 真实的边界：浏览器产品用 Playwright，按角色和标签定位；HTTP 服务用真实进程和真实依赖；命令行或库在全新环境里跑，输出固定好；容器、后台任务、数据迁移，等健康检查通过，用一次性的状态；3 运行：从干净或预置的状态开始，等就绪，不用固定的等待；每条旅程、一条出错的路径，必要时加上重启；需保留的产物，存在并且和那一行描述相符；一定要清理，失败了也要；4 通过，或按类型判失败：产品 bug，开一个正常的修复 issue；夹具或数据错了，修好再跑；规格不清楚，停下要一份清楚的合同；环境问题，报告具体卡在哪；从不部署、合并、改 PRD 或放松测试"
alt_en = "Acceptance: in comes a finished pair, every issue landed, trees clean; 1 bind: the exact pair, all landed, no open issue, PR or branch; a tracker batch still open means stop and reconcile it first; PRD outcomes become journeys, plus whole-product checks; unit tests alone are never the final boundary; 2 the real boundary: a browser through Playwright, by role and label; an HTTP service as its real process with real dependencies; a CLI or library in a fresh setup with pinned output; a container, worker or migration, waiting for health, with throwaway state; 3 run it: a clean or seeded start, waiting for readiness with no fixed sleeps; every journey, a bad path, and a restart when it matters; preserved artifacts exist and match their row; always tear down, even after a failure; 4 PASS, or FAIL by kind: a product bug becomes one normal repair issue; bad fixture or data is fixed and run again; an unclear spec stops and asks for a clear contract; an environment problem is reported as the exact blocker; it never deploys, merges, edits the PRD or weakens a test"
caption_zh = "验收：在用户真正使用的地方测整个产品，失败要分类"
caption_en = "Acceptance: the whole product tested where people use it, failures sorted by kind"

[[figures]]
file = "publish.svg"
alt_zh = "公开：你明确运行 /idd-publish 加项目；1 在私有状态下准备：对账进度表，这是公开前的里程碑；一个准备 issue，走规划、建 issue、实现、落地；许可证，默认 MIT，测试全绿，端到端检查；准备的改动推送前先扫描；2 扫描每个提交：每条提交说明，以及每个引用上的每个文件；旧的 PR 引用也扫，GitHub 会一直保留它们；查密钥和私有名称，用内置清单加上你给的词；提交说明里的命中清除不掉，只能用新仓库公开，或你明知后接受；3 人工检查：issue、评论、评审，以及它们的编辑历史；Actions 的运行、日志和产物；分支、标签、发布、仓库元数据、包和文档链接；任何命中都会阻止公开；4 切换并核对：代码仓库变成公开，PRD 仓库保持私有；退出登录检查，代码能看到，PRD 被拒绝；重新应用保护，规则集现在生效；公开不是部署，不托管、不发版本、不发包"
alt_en = "Publishing: you run /idd-publish with a project, explicitly; 1 prepare, still private: reconcile the tracker at this pre-publish milestone; one preparation issue through plan, issue, implement and land; a license, MIT by default, green tests and an end-to-end check; the preparation change is scanned before it is pushed; 2 scan every commit: every commit message and every file on every ref; old PR refs too, since GitHub keeps them; secrets and private names from a built-in list plus your terms; a hit in a commit message can't be purged, so it takes a new repo, or you accept it knowingly; 3 check by hand: issues, comments, reviews and their edit history; Actions runs, logs and artifacts; branches, tags, releases, metadata, and package and doc links; any match blocks the visibility change; 4 flip and verify: the code repo becomes public and the PRD repo stays private; a signed-out check finds the code readable and the PRD denied; re-applied protection means the rulesets are now enforced; publishing is not deploying: no hosting, release or package"
caption_zh = "公开：先在私有状态下准备、全面扫描，再只公开代码仓库"
caption_en = "Publishing: prepare while private, scan everything, then make only the code public"

[[figures]]
file = "evolve.svg"
alt_zh = "进化：输入是真实运行的证据，或一次精简；1 证据：post-plan，看 issue 顺序和进度表准不准；post-create，看 issue 是怎么写的；post-issue，看一个 issue 的改动、检查和 PR；simplify，合并、压缩、删除；2 关卡是宪法：证明过、价值高，还没被覆盖；比它消除的麻烦小，先删再加；以往的 issue 不变或更好，说出它最可能伤到哪一个；大小上限，每个技能文件 60 到 160 行；3 通过：最小的改动，validate.sh 通过；propose.sh 在 evolve/<slug> 上开 PR，从不写 main；维护者评审，由 land-evolution.sh 在他们点头后合并；链接到这个仓库的技能在合并前一直用 main 上的版本；4 不通过：什么都不发生，没有日志、没有队列；Git 历史是唯一的记录；新功能不走这条路，走 PRD 和 issue；一个能复现的缺陷就足以证明，关于行为的建议要多次运行"
alt_en = "Evolving: in comes evidence from real runs, or a simplify pass; 1 evidence: post-plan, issue order and tracker accuracy; post-create, how an issue was written; post-issue, one issue's diff, checks and PR; simplify, merge, compress and delete; 2 the gate is the constitution: proven and high value, not already covered; smaller than the friction, delete before adding; past issues the same or better, naming the one it could hurt; size caps of 60 to 160 lines per skill file; 3 pass: the smallest edit with validate.sh passing; propose.sh opens a PR on evolve/<slug> and never writes main; the maintainer reviews, and land-evolution.sh merges on their word; skills linked to the checkout keep serving main until it lands; 4 fail: nothing happens, no log and no queue, and git history is the only record; new features don't come this way, they go through the PRD and an issue; one reproduced defect is proof enough, advice on behaviour needs several runs"
caption_zh = "进化：证明过的教训走评审过的 PR，其余什么都不留"
caption_en = "Evolving: proven lessons go through a reviewed PR; the rest leaves nothing"
