<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills two repositories</title>
<desc id="d">One product, two GitHub repositories, cloned side by side. 1 {project}, the code: code, tests and docs; issues and pull requests, one pull request for each issue; branches dev, main and issue/&lt;N&gt;-&lt;slug&gt;. It is private when IDD creates it, and /idd-publish can make it public. 2 {project}-prd, the plan: PRD.md with requirements, slices and non-goals; PROGRESS.md with what is ready, active or blocked; a single main branch changed by pull request. It is always private. The PRD side sends the next issue to the code side, and landed work flows back to the tracker. 3 How they find each other: sibling folders such as widget and widget-prd, the same GitHub owner checked from both origins, or for another owner the local setting git config idd.prdRepo. With no PRD repository, issues still work and landing skips the tracker. 4 Who is right about what: GitHub about what happened, PRD.md about what is wanted, and PROGRESS.md is checked evidence, not permission. Commits, issues and pull requests never name the private PRD repository. For a new product the PRD repository comes first, and /idd-auto can create the code repository, private.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
