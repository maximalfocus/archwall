<rect x="654" y="734" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Fits the product model</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >or names a design decision</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Nothing private: no credentials,</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >account names or home paths</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="141.5" cy="527" r="14" class="num"/>
<text x="141.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="161.5" y="536" class="gt" text-anchor="start" >Create once, read back</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >gh issue create</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >body from a file</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Unclear result?</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >search before any retry</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Read it back</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >repo, title, body, OPEN</text>
