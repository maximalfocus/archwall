<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-issue</title>
<desc id="d">You ask to file, create or open one issue. 1 Pin it down: which repository, from the flag --repo, a URL or this checkout; search open and closed issues and stop with the existing one if it is a likely duplicate; gather only the evidence needed and invent no paths or labels. Ask one question only if scope or behaviour is really unclear. 2 Draft it small: a title that states the outcome, with no type prefix, number or IDs; the problem and its evidence; testable acceptance criteria; and non-goals only if they prevent confusion. 3 Gate before creating: one coherent issue, small enough for one run; claims backed by evidence, with criteria enough to judge when it is done; and it fits the product model, or names a new concept or special case as a design decision. Nothing private goes in: no credentials, account names or home paths. 4 Create once and read back: gh issue create with the body from a file; if the result is unclear, search before any retry; then read the issue back and check its repository, title, body and OPEN state. A request to draft or suggest creates nothing; /idd-auto may file its one next issue.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
