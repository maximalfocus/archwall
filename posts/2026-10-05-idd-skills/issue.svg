<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >You ask to file, create or open one issue</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="215.75" cy="111" r="14" class="num"/>
<text x="215.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="235.75" y="120" class="gt" text-anchor="start" >Pin it down</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Which repo?</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >flag --repo, a URL, or this checkout</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Search open and closed issues</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >duplicate? stop, return it</text>
