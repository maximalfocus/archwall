<text x="903.0" y="439.0" class="ag" text-anchor="middle" >only if they prevent confusion</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="755.0" cy="527" r="14" class="num"/>
<text x="755.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="775.0" y="536" class="gt" text-anchor="start" >Gate before creating</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >One coherent issue</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >small enough for one run</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
