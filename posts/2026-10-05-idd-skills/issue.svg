<text x="303.0" y="359.0" class="ag" text-anchor="middle" >no made-up paths or labels</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >One question, only if scope</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >or behaviour is really unclear</text>
