<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills overview</title>
<desc id="d">In: your product idea, or code you already have. 1 Plan: /idd-plan writes the product contract from an idea or from existing code into a private PRD repository holding PRD.md and PROGRESS.md, then picks one next issue in dependency order. 2 Build one issue: /idd-issue files it after a duplicate search, and /idd-implement makes a branch, tests the change and opens a pull request into dev; it never merges, which is /idd-land's job. An optional review with /peerreview, a separate skill, can come before landing. 3 Land: /idd-land checks the pull request and squash-merges it into dev, the issue is closed and the branch deleted, and the tracker update goes into a batch pull request in the PRD repository. Then the next round starts at plan again; /idd-auto runs these rounds by itself. 4 Finish, once every issue has landed: /idd-acceptance tests the whole product end to end; /idd-promote, whenever you choose, moves dev to main with one merge commit, and the optional /idd-publish makes the code public while the PRD stays private. /idd routes one request to the phase that owns it, and /idd-evolve improves the method itself.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
