<text x="148.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="168.25" y="536" class="gt" text-anchor="start" >Merged at a milestone</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
