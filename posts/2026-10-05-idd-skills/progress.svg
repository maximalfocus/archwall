<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">idd-skills progress batch</title>
<desc id="d">In: a landed issue, its pull request and its squash commit. 1 Who writes: /idd-land after every merge, automatically; /idd-plan with the --reconcile flag to repair or resync; /idd-publish for the publication row. Only PROGRESS.md is edited, never PRD.md. 2 Checks first: the tracker gate (80-word cells, no dates in cells), the PRD size and fold gates, which report, the manifest drift check for unlisted files, and line width within 100 characters. 3 One open batch pull request: the branch progress/batch with docs(progress) commits; it stays open for review and each update adds a commit; if two batches are open, it stops until there is one. 4 Merged only at a milestone: a slice validated or a release finished, before acceptance or before publishing, at the end of /idd-auto, or on your own --reconcile. With changes requested or review threads open it exits with code 2, awaiting review. A pre-push hook refuses direct pushes to the PRD's main; it is not added if the clone already has its own hooks.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
