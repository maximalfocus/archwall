<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Before acceptance</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >or before publishing</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >End of /idd-auto</text>
