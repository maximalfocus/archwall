<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">peerreview stop rule</title>
<desc id="d">1 All must hold: every acceptance check is met with evidence, the full gate exits clean, the host has no findings left and has swept every lens it opened, and the tree is clean with everything committed. 2 Then the verdict prompt: a read-only round with no edits, only neutral facts such as the raw gate output, and it says in its first paragraph that reading is allowed. 3 The peer answers CONVERGED, no substantive defects remain, which ends the loop; or NOT CONVERGED with the defects named, which starts round N+1. 4 Other endings: a round with no progress stops and reports; no reachable peer stops with no stand-in; and the result is never called perfect. At least one peer round always runs, with no upper cap.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: the committed state after the last edit round</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="202.25" cy="111" r="14" class="num"/>
<text x="202.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="222.25" y="120" class="gt" text-anchor="start" >All must hold</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Every acceptance check met</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >with evidence</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="267.0" class="ag" text-anchor="middle" >Full gate exits clean</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >No findings left</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >every lens swept, not sampled</text>
<rect x="54" y="388" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="398" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="415.0" class="ag" text-anchor="middle" >Tree clean</text>
<text x="303.0" y="439.0" class="ag" text-anchor="middle" >everything committed</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="795.5" cy="111" r="14" class="num"/>
<text x="795.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="120" class="gt" text-anchor="start" >Verdict prompt</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Read-only round</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >no edits allowed</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Neutral facts only</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >raw gate output, no "all green"</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Reading is allowed</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >said in the first paragraph</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >A leading prompt invites</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >false agreement</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="809.0" cy="527" r="14" class="num"/>
<text x="809.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="829.0" y="536" class="gt" text-anchor="start" >PEER answers</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >CONVERGED</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >no substantive defects remain</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >NOT CONVERGED</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >defects named → round N+1</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >At least 1 peer round,</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >no upper cap</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="202.25" cy="527" r="14" class="num"/>
<text x="202.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="222.25" y="536" class="gt" text-anchor="start" >Other endings</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >No progress</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >stop and report</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >No peer reachable</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >stop, no stand-in</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Never "perfect"</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >converged, leftovers listed</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >then ask</text>
<path d="M900.0 464V498" class="flow"/>
<text x="600" y="888" class="lb" text-anchor="middle" >The HOST cannot declare convergence alone: the PEER has to say it</text>
</svg>
