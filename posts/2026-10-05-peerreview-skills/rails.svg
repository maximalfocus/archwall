<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">peerreview guard rails</title>
<desc id="d">1 Claude Code as peer runs in safe mode, without the host user's CLAUDE.md, skills, hooks or MCP servers; in the verdict round Edit, Write and Bash are switched off. 2 The Codex CLI as peer edits inside a workspace-write sandbox; its verdict runs in a fresh read-only sandbox. 3 Pi has no sandbox; its verdict only gets read, grep, find and ls. dsh has no tool allowlist, so its verdict fails if the repo changed. 4 For every peer: a git guard on the PATH lets only read-only git commands run in the repo, which guards against mistakes but is not a sandbox; each round has a deadline of 1800 seconds by default; and only the host commits.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >Each driver script wraps its PEER CLI like this</text>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="161.75" cy="111" r="14" class="num"/>
<text x="161.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="181.75" y="120" class="gt" text-anchor="start" >Claude Code as PEER</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Safe mode</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >no HOST CLAUDE.md, hooks, MCP</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Edit rounds</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >all tools, git guarded</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Verdict round</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >Edit, Write, Bash switched off</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="775.25" cy="111" r="14" class="num"/>
<text x="775.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="795.25" y="120" class="gt" text-anchor="start" >Codex CLI as PEER</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Edit rounds</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >workspace-write sandbox</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Verdict round</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >fresh read-only sandbox</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Both rounds also</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >behind the git guard</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="768.5" cy="527" r="14" class="num"/>
<text x="768.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="788.5" y="536" class="gt" text-anchor="start" >Pi and dsh as PEER</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Pi: no sandbox</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >verdict gets read, grep, find, ls</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >dsh: no tool allowlist</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >verdict fails if the repo moved</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >A moved repo is not reverted:</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >the HOST looks at it first</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="195.5" cy="527" r="14" class="num"/>
<text x="195.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="215.5" y="536" class="gt" text-anchor="start" >For every PEER</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Git guard on PATH</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >only read-only git in the repo</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Round deadline</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >1800 s by default</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Only the HOST commits</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >and pushes</text>
<text x="600" y="888" class="lb" text-anchor="middle" >The git guard catches mistakes; it is not a sandbox against a PEER set on getting around it</text>
</svg>
