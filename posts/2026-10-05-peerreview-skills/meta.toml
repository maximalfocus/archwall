title_zh = "peerreview：两家厂商的 AI 一起审一个仓库，直到都说可以"
title_en = "peerreview: two AI vendors review one repo until both say it's done"
date = "2026-10-05"
tags = ["code-review", "agents", "cross-model", "skills", "git"]
figure = "diagram.svg"
alt_zh = "peerreview 总览：你运行 /peerreview [仓库]，可选参数 --chat、--dry-run；1 准备：章程（私有、临时、来自你的文档），选同伴（另一家厂商：Claude Code ↔ Codex），审查分支（先做基线提交）；文档冲突或没写就停下来问；2 一轮轮来，直到完成：主方审查、跑检查、写发现，同伴改文件、从不提交，主方读真实 diff、重跑检查，提交这一轮、git 归主方；3 只有这样才停：所有检查通过、没有遗留发现，同伴在只读、中立的提问下说 CONVERGED，至少一轮同伴、没有上限；一轮没进展就停下报告；NOT CONVERGED 就回去再来一轮；4 交付：一个压缩后的提交、在 evolve/<slug> 上开拉取请求，打上收敛标签、下次从这里开始，诚实的报告（每项检查、同伴档次、遗留问题）；从不说完美；一次运行的教训交给 /peerreview-evolve 决定留或丢"
alt_en = "peerreview overview: you run /peerreview [repo], with optional flags --chat and --dry-run; 1 set up: a charter (private, temporary, from your docs), pick the peer (another vendor: Claude Code ↔ Codex), a review branch (baseline commit first); if the docs conflict or say nothing, stop and ask; 2 rounds until done: the HOST reviews, runs the gate and writes findings, the PEER co-edits files and never commits, the HOST re-checks the real diff and reruns the gate, then commits the round, since the HOST owns git; 3 stop only when every check passes with no findings left, the PEER says CONVERGED to a read-only, neutral prompt, and at least 1 peer round ran, with no upper cap; a round with no progress stops and reports; NOT CONVERGED goes back for another round; 4 hand over: one squashed commit in a pull request on evolve/<slug>, a converged tag where the next review starts, and an honest report of each check, the peer tier and leftovers; never called perfect; lessons from a run go to /peerreview-evolve, which keeps or drops them"
source = "https://github.com/maximalfocus/peerreview-skills (commit 2f8d61e)"

[[figures]]
file = "charter.svg"
alt_zh = "章程：输入是你的指令和仓库自己的文档；1 意图从哪来，按顺序：你现在的指令，它点名的上游来源，PRD、计划、规格，测试和文档；2 章程（PROBLEM.md）：问题、范围、非目标，验收检查（每条都能测），验证门（每轮都跑的命令），遗留项（已知缺口、不在范围内）；3 核对来源：冲突或没写就停下来问你，一致就继续、不再停下确认；代码只是证据，不是意图，从代码推出检查会变成循环论证；4 审查计划：仓库类型决定审查视角（如 cdd-prd、evidence-docs、code），全量或只看上次收敛标签之后的改动，轮数预估只给你看、不是上限；--dry-run 参数到这里就停；章程放在私有临时目录，不进仓库，无论结果如何运行结束都删掉；你自己写的 PROBLEM.md 是输入，不动不删"
alt_en = "The charter: in come your instruction and the repo's own docs; 1 where intent comes from, in order: your instruction now, an upstream source it names, PRD, plan or spec, then tests and docs; 2 the charter (PROBLEM.md): problem, scope and non-goals, acceptance checks that are each testable, the verification gate of commands run every round, and residuals, the known gaps out of scope; 3 check the sources: if they conflict or nothing is written, stop and ask you; if they agree, go on with no confirmation stop; the code is evidence, never intent, since checks taken from the code would be circular; 4 review plan: the repo type picks the lenses (e.g. cdd-prd, evidence-docs, code), a full run or only the changes since the last converged tag, and a round forecast shown to you but not a cap; the --dry-run flag shows the plan and stops here; the charter sits in a private temp folder, never in the repo, and is deleted when the run ends, whatever the outcome; a PROBLEM.md you wrote yourself is an input, never edited or deleted"
caption_zh = "章程：每次从你的文档重新写下“完成”的标准，放在仓库外面"
caption_en = "The charter: each run writes down what \"done\" means from your docs, outside the repo"

[[figures]]
file = "peer.svg"
alt_zh = "选同伴：select-peer.sh 在循环之前选出同伴；1 主方是谁：Claude Code（Anthropic），Codex CLI（OpenAI），Pi 或 DeepSeek Harness dsh（DeepSeek），从环境变量和所用模型判断；2 第一档，另一家订阅：Claude Code（Claude 订阅），Codex CLI（ChatGPT 订阅）；Claude Code 当主方配 Codex，Codex 当主方配 Claude Code；3 第二档，只在第一档都用不了时：dsh、deepseek-v4-pro，用于 CDD 仓库；Pi、deepseek-flash，用于其它仓库；报告里写明这是较弱的一档，DeepSeek 当主方只有第一档；4 每个候选都要先查：CLI 已装、已登录、不打印密钥，额度探测（只对订阅档，发一个很小的提示，用完了就换下一个），一个都不剩就停，不用同厂商替代；同伴永远不和主方同一家厂商"
alt_en = "Picking the peer: select-peer.sh picks the PEER before the loop; 1 who is the HOST: Claude Code (Anthropic), the Codex CLI (OpenAI), or Pi or the DeepSeek Harness dsh (DeepSeek), read from the environment and the model in use; 2 tier 1, the other subscription: Claude Code on a Claude subscription, the Codex CLI on a ChatGPT subscription; a Claude Code HOST gets Codex, a Codex HOST gets Claude Code; 3 tier 2, only if tier 1 is out: dsh with deepseek-v4-pro for CDD repos, Pi with deepseek-flash for every other repo; named as the weaker tier in the report, and a DeepSeek HOST has tier 1 only; 4 each candidate is checked: CLI installed and signed in, no keys printed; a quota probe with one tiny prompt, only for the subscription peers, and a used-up peer means the next one; nobody left means stop, with no same-vendor stand-in; the PEER is never from the HOST's own vendor"
caption_zh = "选同伴：永远是另一家厂商，先第一档，用不了才降到第二档"
caption_en = "Picking the peer: always another vendor, tier 1 first, tier 2 only when tier 1 is out"

[[figures]]
file = "round.svg"
alt_zh = "一轮：输入是章程和上一次提交的状态；1 主方审查：按章程扫一遍、先看正确性和安全，重扫已经发现过的每类缺陷（每个同类，不只那一行），跑全部检查，写提示文件（完整章程加排好序的发现）；2 同伴修改：驱动脚本（claude-、codex-、pi- 或 dsh-round），自己也找问题、不是帮主方确认，最小改动、不提交不推送；每轮默认 30 分钟时限，可用环境变量改；3 主方复查：等驱动进程退出，做到一半的树不可信，看真实的 git diff 和 status、不信同伴的报告，重跑检查、核对所谓的修复，“修复”可能是倒退；4 提交这一轮：peerreview: round N，主方和同伴都列为作者，比之前更糟就回退、给更紧的发现；一轮没有进展就停止循环并报告；虚线箭头：下一轮；git 和何时停都由主方决定，同伴只改文件"
alt_en = "One round: in come the charter and the last committed state; 1 HOST reviews: sweep the charter, correctness and security first, re-sweep old defect kinds across every sibling, not one line, run the full gate, and write a prompt file with the whole charter and ranked findings; 2 PEER co-edits: through a driver script (claude-, codex-, pi- or dsh-round), with its own findings too, not a confirm-my-work pass, and minimal edits with no commit and no push; a 30 min deadline per round, set by an env var; 3 HOST re-checks: wait for the driver to exit because a mid-flight tree can't be trusted, read the real git diff and status rather than the PEER's report, rerun the gate and fact-check fixes, since a \"fix\" can be a regression; 4 commit the round as peerreview: round N with HOST and PEER as co-authors; worse than before means revert and tighter findings; no progress in a round stops the loop with a report; dashed arrow: next round; the HOST owns git and the decision to stop, the PEER only edits"
caption_zh = "一轮：主方审、同伴改、主方复查再提交"
caption_en = "One round: the HOST reviews, the PEER edits, the HOST re-checks and commits"

[[figures]]
file = "rails.svg"
alt_zh = "护栏：每个驱动脚本这样包住它的同伴 CLI；1 Claude Code 当同伴：安全模式，不带主方的 CLAUDE.md、hooks、MCP，修改轮所有工具可用、git 有防护，裁决轮关掉 Edit、Write、Bash；2 Codex CLI 当同伴：修改轮在 workspace-write 沙箱里，裁决轮用全新的只读沙箱，两种都在 git 防护后面；3 Pi 和 dsh 当同伴：Pi 没有沙箱，裁决轮只给 read、grep、find、ls；dsh 没有工具白名单，裁决轮仓库一动就判失败；动过的仓库不自动还原，主方先看；4 对每个同伴：PATH 上的 git 防护，仓库里只允许只读的 git 命令，每轮默认 1800 秒时限，只有主方提交和推送；git 防护防的是失误，挡不住存心绕过的同伴"
alt_en = "Guard rails: each driver script wraps its PEER CLI like this; 1 Claude Code as PEER: safe mode with no HOST CLAUDE.md, hooks or MCP, edit rounds with all tools and git guarded, the verdict round with Edit, Write and Bash switched off; 2 Codex CLI as PEER: edit rounds in a workspace-write sandbox, the verdict round in a fresh read-only sandbox, both behind the git guard; 3 Pi and dsh as PEER: Pi has no sandbox and its verdict gets read, grep, find and ls only; dsh has no tool allowlist, so its verdict fails if the repo moved; a moved repo is not reverted, the HOST looks at it first; 4 for every PEER: a git guard on PATH allows only read-only git in the repo, a round deadline of 1800 s by default, and only the HOST commits and pushes; the git guard catches mistakes, it is not a sandbox against a PEER set on getting around it"
caption_zh = "护栏：四种同伴 CLI 各自怎么被限制，只读裁决、git 防护、时限"
caption_en = "Guard rails: how each of the four PEER CLIs is held back: read-only verdicts, a git guard, a deadline"

[[figures]]
file = "verdict.svg"
alt_zh = "何时停：输入是最后一轮修改后提交的状态；1 必须全部满足：每条验收检查都满足、有证据，全部检查干净退出，没有遗留发现、每个视角都扫完而不是抽查，工作树干净，或留给人工提交；2 然后问裁决：只读的一轮、不许改，只给中立事实（原始检查输出，不说“全绿”），第一段就写明可以读文件；引导性的提问会换来假同意；3 同伴回答：CONVERGED，没有实质缺陷了；NOT CONVERGED，列出缺陷，进入第 N+1 轮；至少一轮同伴，没有上限；4 其它结局：没有进展，停下报告；找不到同伴，停下、不找替身；从不说完美，只说已收敛、遗留问题已列出；主方不能单方面宣布收敛，必须同伴说"
alt_en = "When to stop: in comes the committed state after the last edit round; 1 all must hold: every acceptance check met with evidence, the full gate exits clean, no findings left with every lens swept, not sampled, and the tree clean, or left for manual commit; 2 then the verdict prompt: a read-only round with no edits allowed, neutral facts only, the raw gate output and no \"all green\", and reading is allowed, said in the first paragraph; a leading prompt invites false agreement; 3 the PEER answers CONVERGED, no substantive defects remain, or NOT CONVERGED with defects named, which means round N+1; at least 1 peer round, no upper cap; 4 other endings: no progress means stop and report, no peer reachable means stop with no stand-in, and never \"perfect\", only converged with leftovers listed; the HOST cannot declare convergence alone, the PEER has to say it"
caption_zh = "何时停：检查全过，并且同伴在中立提问下说 CONVERGED"
caption_en = "When to stop: every check passes and the PEER says CONVERGED to a neutral prompt"

[[figures]]
file = "deliver.svg"
alt_zh = "落地：输入是你要审的仓库；1 审查期间：审查分支 peerreview/<slug>，已安装的技能指向这个仓库时用单独的 worktree，每轮的提交是证据、不是产品历史；先做基线提交，每轮的 diff 各归各；2 落地：压成一个提交放在 evolve/<slug>，先检查提交标题（类型、小写开头的描述），推送并开拉取请求，从不写基础分支；3 之后：打收敛标签 peerreview/converged/…，推送被审的仓库、推不上去就大声报错，维护者之后用 land-evolution.sh、得到明确同意才合并；4 例外：~/projects 下的仓库不做任何 git 写入，--chat 参数用临时仓库、在对话里给结果、然后删掉，点名了一个打开的拉取请求就在它的分支上审；标签给下次审查一个起点：全量，或只看之后的改动"
alt_en = "Landing: in comes the repo you asked to review; 1 during the review: the review branch peerreview/<slug>, its own worktree if installed skills point into this repo, and round commits as evidence, not history; a baseline commit first, so each round's diff is its own; 2 land: squash to one commit on evolve/<slug>, check the subject first (type and a lowercase description), then push and open a PR; the base branch is never written; 3 after: a converged tag peerreview/converged/..., push the reviewed repo and fail loud if it can't, and the maintainer merges later with land-evolution.sh on an explicit go-ahead; 4 exceptions: a repo under ~/projects gets no git writes at all, the --chat flag uses a temp repo, answers in chat and deletes it, and a named open PR is reviewed on its own branch; the tag gives the next review a starting point: a full pass, or only the changes since"
caption_zh = "落地：审查时在分支上，结束时压成一个提交开拉取请求"
caption_en = "Landing: the review runs on a branch and ends as one commit in a pull request"

[[figures]]
file = "evolve.svg"
alt_zh = "越用越好：输入是一次运行的教训、一个缺口或超了大小上限；1 触发：审查之后、从原始会话记录里找，研究一个真实的缺口、按需拉取、从不定时，精简、每月一次或超出大小上限，用 /peerreview-evolve 运行；2 关卡是宪法：经过证明、价值高（影响 × 把握 / 成本 ≥ 3），还没被覆盖，符合大小上限（1000 · 800 · 150 行），让以往每个案例保持不变或更好；3 通过：改技能，常常是 7 个视角模块之一，用 propose.sh 开拉取请求、维护者合并；视角模块每种仓库类型一个：PRD、一致性、证据文档等；4 不通过：什么都不发生，没有日志、没有队列，git 历史是唯一的记录；“以后也许用得上”算不通过，同样的触发还会再来；教训要么现在写进技能，要么丢掉"
alt_en = "Getting better: in comes a lesson from a run, a gap, or a size breach; 1 triggers: after a review, from the raw session traces; research on a real gap, pulled and never scheduled; simplify, monthly or when a size cap is breached; run with /peerreview-evolve; 2 the gate is the constitution: proven and high value (impact × confidence / effort ≥ 3), not already covered, fits the size caps of 1000, 800 and 150 lines, and leaves every past case the same or better; 3 pass: edit the skill, often one of 7 lens modules, and open a PR with propose.sh for the maintainer to land; lens modules are one per repo type: PRD, conformance, evidence docs and more; 4 fail: nothing happens, no log and no queue, and git history is the only record; \"maybe someday\" counts as fail, since the same trigger will come back; a lesson is either written into a skill now or dropped"
caption_zh = "越用越好：教训先过宪法，通过就改技能，不通过就丢掉"
caption_en = "Getting better: a lesson must pass the constitution to become a skill edit; otherwise it is dropped"
