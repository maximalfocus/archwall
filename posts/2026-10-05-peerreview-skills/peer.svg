<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">peerreview peer choice</title>
<desc id="d">1 Who is the host: Claude Code, the Codex CLI, Pi on DeepSeek, or the DeepSeek Harness dsh, read from environment markers and the model in use. 2 Tier 1 is the other subscription CLI: Claude Code on a Claude subscription, or the Codex CLI on a ChatGPT subscription. A Claude Code host gets Codex, a Codex host gets Claude Code. 3 Tier 2, only if no tier-1 peer is reachable: dsh with deepseek-v4-pro for CDD repos, Pi with deepseek-flash for every other repo. The report names it as the weaker tier. A DeepSeek host has tier 1 only. 4 Every candidate is checked first: the CLI is installed and signed in, without printing keys; a tiny prompt probes quota, and an out-of-quota peer is skipped; if nobody is left, the review stops. The peer is never from the host's own vendor.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >select-peer.sh picks the PEER before the loop</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="182.0" cy="111" r="14" class="num"/>
<text x="182.0" y="117" class="numt" text-anchor="middle" >1</text>
<text x="202.0" y="120" class="gt" text-anchor="start" >Who is the HOST?</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Claude Code</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >Anthropic</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Codex CLI</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >OpenAI</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Pi, or DeepSeek Harness (dsh)</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >DeepSeek</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Read from the environment</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >and the model in use</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="687.5" cy="111" r="14" class="num"/>
<text x="687.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="707.5" y="120" class="gt" text-anchor="start" >Tier 1: the other subscription</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Claude Code</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >Claude subscription</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Codex CLI</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >ChatGPT subscription</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Claude Code HOST gets Codex;</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >Codex HOST gets Claude Code</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="694.25" cy="527" r="14" class="num"/>
<text x="694.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="714.25" y="536" class="gt" text-anchor="start" >Tier 2: only if tier 1 is out</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >dsh, deepseek-v4-pro</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >for CDD repos</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Pi, deepseek-flash</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >for every other repo</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Named as the weaker tier in the report;</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >a DeepSeek HOST has tier 1 only</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="121.25" cy="527" r="14" class="num"/>
<text x="121.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="141.25" y="536" class="gt" text-anchor="start" >Each candidate is checked</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >CLI installed, signed in</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >no keys printed</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Quota probe</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >one tiny prompt; used up → next</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Nobody left → stop</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >no same-vendor stand-in</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >ladder</text>
<path d="M900.0 464V498" class="flow"/>
<text x="980.0" y="488" class="al" text-anchor="middle" >none reachable</text>
<text x="600" y="888" class="lb" text-anchor="middle" >The PEER is never from the HOST's own vendor</text>
</svg>
