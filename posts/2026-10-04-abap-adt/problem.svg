<text x="707.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="727.75" y="52" class="gt" text-anchor="start" >Problem 1: the client layer</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f6fd6"/>
