<text x="761.5" y="488" class="gt" text-anchor="start" >Problem 2: the editors</text>
<rect x="654" y="522" width="492" height="72" rx="8" class="agent"/>
<text x="903.0" y="553.0" class="ag" text-anchor="middle" >ABAP on SAP BTP</text>
<text x="903.0" y="577.0" class="ag" text-anchor="middle" >88 editors (2025)</text>
<rect x="654" y="624" width="236" height="72" rx="8" class="agent"/>
<text x="775.0" y="655.0" class="ag" text-anchor="middle" >CAP</text>
<text x="775.0" y="679.0" class="ag" text-anchor="middle" >1 editor (CDS)</text>
<rect x="910" y="624" width="236" height="72" rx="8" class="agent"/>
<text x="1031.0" y="655.0" class="ag" text-anchor="middle" >Java</text>
<text x="1031.0" y="679.0" class="ag" text-anchor="middle" >class, interface, enum</text>
<text x="900.0" y="816" class="lb" text-anchor="middle" >every new IDE would need them all</text>
<path d="M900.0 420V450" class="flow"/>
<text x="934.0" y="442" class="al" text-anchor="middle" >and</text>
<rect x="24" y="452" width="552" height="432" rx="12" class="grp"/>
<circle cx="202.25" cy="479" r="14" class="num"/>
<text x="202.25" y="485" class="numt" text-anchor="middle" >4</text>
<text x="222.25" y="488" class="gt" text-anchor="start" >The two fixes</text>
<rect x="54" y="522" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="532" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="553.0" class="ag" text-anchor="middle" >Reuse the client layer</text>
<text x="303.0" y="577.0" class="ag" text-anchor="middle" >as a language server</text>
<rect x="54" y="624" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="634" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="655.0" class="ag" text-anchor="middle" >Server-driven editors</text>
<text x="303.0" y="679.0" class="ag" text-anchor="middle" >two renderers</text>
<text x="300.0" y="816" class="lb" text-anchor="middle" >six years of rework, VS Code in 2026</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >solved by</text>
</svg>
