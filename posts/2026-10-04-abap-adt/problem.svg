<text x="903.0" y="237.0" class="ag" text-anchor="middle" >ATC, tracing</text>
<text x="900.0" y="354" class="lb" text-anchor="middle" >2.9 million lines with no UI</text>
<text x="900.0" y="382" class="lb" text-anchor="middle" >every new IDE needs one</text>
<path d="M576 218H622" class="flow"/>
