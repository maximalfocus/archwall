<text x="303.0" y="237.0" class="ag" text-anchor="middle" >JetBrains, Neovim, Zed</text>
<text x="300.0" y="354" class="lb" text-anchor="middle" >Official ABAP tools: only SAP GUI</text>
<text x="300.0" y="382" class="lb" text-anchor="middle" >and Eclipse</text>
