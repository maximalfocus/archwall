<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Why a new IDE was hard</title>
<desc id="d">1 Users want more choice: in SAP's 2023 and 2025 surveys VS Code was the most requested IDE; others asked for JetBrains IDEs, Neovim or Zed. Official ABAP tools existed only for SAP GUI and Eclipse. 2 Problem one: every IDE needs a client layer that talks to the ABAP server, wraps the REST APIs, keeps old releases working and holds the debugger, test runner, ATC and tracing: 2.9 million lines with no UI. 3 Problem two: ABAP has many object type editors, 88 on the SAP BTP ABAP environment alone in 2025, against one for CAP (CDS) and three for Java (class, interface, enumeration). 4 The fixes: reuse the client layer as a language server, and make editors server-driven.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
