<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ABAP Development Tools overview</title>
<desc id="d">1 The IDEs: Eclipse runs the ADT plug-ins with their UI; VS Code, from 2026, runs an ADT extension where objects are edited as files. 2 The shared client layer has no UI: wrappers for the ADT REST APIs, debugger, test runner, ATC, tracing and support for old releases, 2.9 million lines. Eclipse runs it directly; VS Code reaches it over LSP through the ADT Language Server. 3 It talks to the ABAP server over RFC or HTTP: one API for every release from SAP NetWeaver 7.3 EHP1 SP04. Objects are stored on the server, which also describes each new editor's UI in ABAP. 4 The client draws those UIs with two renderers, form-based and source-based.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
