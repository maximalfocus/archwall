<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">ABAP Development Tools architecture</title>
<desc id="d">1 The IDEs: Eclipse runs the ADT plug-ins directly; VS Code talks over the Language Server Protocol to the ADT Language Server, which wraps the same Eclipse plug-ins without their UI. 2 The client layer has no UI: wrappers for the ADT REST APIs and client-side tools such as the debugger, test runner, ATC and tracing, about 2.9 million lines shared by both IDEs. 3 It talks to the ABAP server over RFC or HTTP. The server offers the ADT REST APIs, one API for every release from SAP NetWeaver 7.3 EHP1 SP04, and the object types: new ones are server-driven, shown by one form-based and one source-based renderer.</desc>
