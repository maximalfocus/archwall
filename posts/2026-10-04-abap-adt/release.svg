<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">First VS Code release</title>
<desc id="d">1 The focus is the ABAP Cloud development model; the goal is every developer flow in it. Classic models such as Dynpro and Web Dynpro are not planned. 2 The first release, for early adopters, targets RAP UI services: around 12+ object types, enough to build one from scratch, with class and interface editors and the basic develop, test and debug flow. 3 For many other tasks developers still switch to ADT for Eclipse. 4 VS Code catches up one client release at a time: each tool moves to LSP and gets a VS Code UI. The Eclipse plug-in took 16 years to reach its scope. The plan is to support the same server releases as Eclipse, down to SAP NetWeaver 7.3 EHP1 SP04.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
