<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="148.25" cy="43" r="14" class="num"/>
<text x="148.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="168.25" y="52" class="gt" text-anchor="start" >Stays on your machine</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Code</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >tree-sitter</text>
<rect x="54" y="192" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="202" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="227.0" class="ag" text-anchor="middle" >Video, audio</text>
<text x="303.0" y="251.0" class="ag" text-anchor="middle" >faster-whisper</text>
<text x="300.0" y="336" class="lb" text-anchor="middle" >no telemetry</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="795.5" cy="43" r="14" class="num"/>
<text x="795.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="52" class="gt" text-anchor="start" >Goes to an LLM</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Docs, papers, images</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >the assistant's own model</text>
<rect x="654" y="192" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="202" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="227.0" class="ag" text-anchor="middle" >Headless runs</text>
<text x="903.0" y="251.0" class="ag" text-anchor="middle" >your API key, or local Ollama</text>
<text x="900.0" y="336" class="lb" text-anchor="middle" >Ollama keeps it all on your machine</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="802.25" cy="487" r="14" class="num"/>
<text x="802.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="822.25" y="496" class="gt" text-anchor="start" >Safety checks</text>
<rect x="654" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="559.0" class="ag" text-anchor="middle" >URLs</text>
<text x="776.0" y="583.0" class="ag" text-anchor="middle" >http(s), no private IPs</text>
<rect x="908" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="559.0" class="ag" text-anchor="middle" >Downloads</text>
<text x="1030.0" y="583.0" class="ag" text-anchor="middle" >50 MB cap, timeout</text>
<rect x="654" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="655.0" class="ag" text-anchor="middle" >Graph paths</text>
<text x="776.0" y="679.0" class="ag" text-anchor="middle" >inside graphify-out/</text>
<rect x="908" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="630" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="655.0" class="ag" text-anchor="middle" >Labels</text>
<text x="1030.0" y="679.0" class="ag" text-anchor="middle" >cleaned, 256 chars</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="168.5" cy="487" r="14" class="num"/>
<text x="168.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="188.5" y="496" class="gt" text-anchor="start" >Off unless you ask</text>
<rect x="54" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Query log</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >opt-in, env variable</text>
<rect x="54" y="636" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="646" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >HTTP server</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >localhost unless --host</text>
<text x="300.0" y="760" class="lb" text-anchor="middle" >opening it up? set --api-key too</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >transcripts</text>
</svg>
