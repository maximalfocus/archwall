<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify: keep it current, share it</title>
<desc id="d">1 Set up once per clone: graphify hook install adds a post-commit hook, a post-checkout hook and a git merge driver for graph.json. 2 By itself: every git commit and every branch switch rebuilds the code part in the background, AST only, no API cost. 3 You run it: after git pull or merge, graphify update; when docs or papers change, /graphify --update, which uses the LLM. With the watch extra, graphify watch rebuilds code at once and flags doc changes for --update. 4 Share with the team: commit graph.json and GRAPH_REPORT.md; the merge driver keeps conflict markers out of graph.json; or serve one graph over HTTP for everyone, with an API key when it is open beyond localhost.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
