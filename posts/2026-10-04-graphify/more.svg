<text x="222.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="242.5" y="52" class="gt" text-anchor="start" >Many repos</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#8a5cc7"/>
