<text x="303.0" y="139.0" class="ag" text-anchor="middle" >one graph across projects</text>
<rect x="54" y="192" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="202" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="227.0" class="ag" text-anchor="middle" >merge-graphs</text>
<text x="303.0" y="251.0" class="ag" text-anchor="middle" >join two graph.json files</text>
<text x="300.0" y="336" class="lb" text-anchor="middle" >kept in ~/.graphify/</text>
