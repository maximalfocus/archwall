<rect x="654" y="534" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Word, Excel → Markdown</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >office extra</text>
<rect x="654" y="636" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="646" width="5" height="60" rx="2" fill="#2f6fd6"/>
