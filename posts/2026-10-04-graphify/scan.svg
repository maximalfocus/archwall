<text x="303.0" y="139.0" class="ag" text-anchor="middle" >or several, or a GitHub URL</text>
<rect x="54" y="192" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="202" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="303.0" y="227.0" class="ag" text-anchor="middle" >graphify add &lt;url&gt;</text>
<text x="303.0" y="251.0" class="ag" text-anchor="middle" >paper, web page, tweet, video</text>
<text x="300.0" y="336" class="lb" text-anchor="middle" >fetched pages are saved as Markdown</text>
<text x="300.0" y="364" class="lb" text-anchor="middle" >video URLs need the video extra</text>
