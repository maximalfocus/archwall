<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify step 3: build the map</title>
<desc id="d">1 One graph: build() merges the code pass and the LLM pass into one NetworkX graph, then drops duplicates, the same thing found under two names; --dedup-llm lets an LLM settle close calls. 2 Communities: Leiden groups nodes that link a lot (leiden extra; otherwise Louvain from NetworkX). Weak, loose groups are split again. Each one is named after its busiest node, or by an LLM. No embeddings, no vector store. 3 What matters: the 10 most linked nodes (god nodes), the 5 most surprising cross-file links, up to 7 suggested questions, and import cycles. 4 graphify-out: graph.json, graph.html (a community view above 5,000 nodes), GRAPH_REPORT.md, and exports only on a flag: Obsidian, wiki, SVG (svg extra), GraphML, Neo4j. A rebuild will not overwrite a bigger graph without --force.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
