<rect x="54" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="176.0" y="559.0" class="ag" text-anchor="middle" >graph.json</text>
<text x="176.0" y="583.0" class="ag" text-anchor="middle" >the full graph</text>
<rect x="308" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="534" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="430.0" y="559.0" class="ag" text-anchor="middle" >graph.html</text>
<text x="430.0" y="583.0" class="ag" text-anchor="middle" >click, filter, search</text>
<rect x="54" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="630" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="176.0" y="655.0" class="ag" text-anchor="middle" >GRAPH_REPORT.md</text>
<text x="176.0" y="679.0" class="ag" text-anchor="middle" >the highlights</text>
<rect x="308" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="630" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="430.0" y="655.0" class="ag" text-anchor="middle" >Exports on a flag</text>
<text x="430.0" y="679.0" class="ag" text-anchor="middle" >Obsidian, wiki, SVG…</text>
<text x="300.0" y="760" class="lb" text-anchor="middle" >a rebuild won't overwrite a bigger graph</text>
