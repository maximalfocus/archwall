<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="111.0" class="ag" text-anchor="middle" >Leiden (leiden extra)</text>
<text x="903.0" y="135.0" class="ag" text-anchor="middle" >else Louvain</text>
