<rect x="908" y="534" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="1030.0" y="559.0" class="ag" text-anchor="middle" >Surprises</text>
<text x="1030.0" y="583.0" class="ag" text-anchor="middle" >top 5 cross-file</text>
<rect x="654" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="776.0" y="655.0" class="ag" text-anchor="middle" >Questions</text>
<text x="776.0" y="679.0" class="ag" text-anchor="middle" >up to 7 to ask</text>
<rect x="908" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="630" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="1030.0" y="667.0" class="ag" text-anchor="middle" >Import cycles</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="202.25" cy="487" r="14" class="num"/>
<text x="202.25" y="493" class="numt" text-anchor="middle" >4</text>
