<text x="229.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="249.25" y="52" class="gt" text-anchor="start" >One graph</text>
<rect x="54" y="80" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Merge</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >code pass + LLM pass</text>
<rect x="54" y="200" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="60" rx="2" fill="#d64545"/>
<text x="303.0" y="235.0" class="ag" text-anchor="middle" >Drop duplicates</text>
<text x="303.0" y="259.0" class="ag" text-anchor="middle" >same thing, two names</text>
<path d="M300.0 160V198" class="flow"/>
<text x="300.0" y="346" class="lb" text-anchor="middle" >--dedup-llm: an LLM settles close calls</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="815.75" cy="43" r="14" class="num"/>
<text x="815.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="835.75" y="52" class="gt" text-anchor="start" >Communities</text>
