<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify architecture</title>
<desc id="d">1 Scan the folder: detect() sorts files into code, docs and papers, images, and video or audio. 2 Extract in three passes; a SHA256 cache skips files that have not changed. Pass 1 parses code with tree-sitter, locally, with no LLM. Pass 2 transcribes video and audio with faster-whisper, locally (video extra). Pass 3 sends docs, papers, images and transcripts to parallel LLM subagents, which costs tokens. Passes 1 and 3 return nodes and edges, and each edge is tagged EXTRACTED, INFERRED or AMBIGUOUS. 3 Build and cluster: build() makes one NetworkX graph, cluster() finds communities with the Leiden algorithm (leiden extra; otherwise Louvain), and the analyze helpers find god nodes and surprising connections. 4 Output in graphify-out: graph.json, graph.html and GRAPH_REPORT.md, plus optional exports such as an Obsidian vault, a wiki, SVG, GraphML and Cypher.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
