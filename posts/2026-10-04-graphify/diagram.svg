<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify overview</title>
<desc id="d">Input: a folder of code, docs, papers, images and video. 1 Read the folder: detect() skips ignored files, build output and secret files, sorts the rest by type and warns when the folder is tiny or costly. 2 Pull out the facts in three passes: code is parsed on your machine with tree-sitter, no LLM; video and audio are transcribed locally with faster-whisper (video extra); docs, papers, images and transcripts go to an LLM, which costs tokens. A SHA256 cache skips unchanged files. 3 Build the map: one graph with duplicates dropped, communities found with Leiden or Louvain, then god nodes, surprising links and suggested questions. 4 Use the map: files in graphify-out, the assistant asks the graph through the CLI or an MCP server, and git hooks rebuild the code part for free. Side tools: PR dashboard, cross-repo graph.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
