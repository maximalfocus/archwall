<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify step 4: your assistant asks the graph first</title>
<desc id="d">1 Install once: graphify claude install writes a CLAUDE.md section and a PreToolUse hook. Other assistants get AGENTS.md or a rules file instead. Opt-in strict mode on Claude Code blocks the first raw file read of a session. 2 The hook: before a Grep or Bash search, and before a Read or Glob, it nudges the assistant to run graphify query, only when a graph exists. 3 Ask: the CLI has query for a question, path from A to B, and explain for one concept; an MCP server (mcp extra) offers the same as tools. 4 The answer: it finds the nodes that match the question, walks out from them breadth-first or depth-first, and returns a small subgraph as text, about 2,000 tokens by default, not whole files.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
