<path d="M900.0 310V356" class="flow"/>
<text x="900.0" y="448" class="lb" text-anchor="middle" >not the raw files</text>
<rect x="24" y="524" width="1152" height="336" rx="12" class="grp"/>
<circle cx="488.75" cy="551" r="14" class="num"/>
<text x="488.75" y="557" class="numt" text-anchor="middle" >3</text>
<text x="508.75" y="560" class="gt" text-anchor="start" >Keep it current</text>
<rect x="54" y="608" width="340" height="80" rx="8" class="agent"/>
<rect x="54" y="618" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="227.0" y="643.0" class="ag" text-anchor="middle" >git commit, switch</text>
<text x="227.0" y="667.0" class="ag" text-anchor="middle" >rebuilds by itself</text>
<text x="224.0" y="724" class="lb" text-anchor="middle" >AST only, no API cost</text>
<rect x="430" y="608" width="340" height="80" rx="8" class="agent"/>
<rect x="430" y="618" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="603.0" y="643.0" class="ag" text-anchor="middle" >git pull, merge</text>
<text x="603.0" y="667.0" class="ag" text-anchor="middle" >graphify update .</text>
<text x="600.0" y="724" class="lb" text-anchor="middle" >you run it</text>
<rect x="806" y="608" width="340" height="80" rx="8" class="agent"/>
<rect x="806" y="618" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="979.0" y="643.0" class="ag" text-anchor="middle" >docs changed</text>
<text x="979.0" y="667.0" class="ag" text-anchor="middle" >/graphify --update</text>
<text x="976.0" y="724" class="lb" text-anchor="middle" >LLM pass, costs tokens</text>
<text x="600" y="794" class="lb" text-anchor="middle" >graphify hook install sets up the git hooks once per clone</text>
