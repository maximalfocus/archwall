<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify in use</title>
<desc id="d">1 The assistant: graphify claude install writes a CLAUDE.md section that says to query the graph first, and a PreToolUse hook that fires before search commands and file reads and points the assistant to the graph. Platforms without hooks get an instruction file such as AGENTS.md. 2 Ask the graph: the CLI has query, path and explain; an MCP server offers query_graph, get_node, get_neighbors and shortest_path, over stdio for one developer or HTTP for a team. Both read graph.json and return a small subgraph instead of raw files. 3 Keep it current: after graphify hook install, git commit and branch switches rebuild the code part in the background with AST only and no API cost. After git pull or merge, run graphify update. When docs or papers change, run /graphify --update, which uses the LLM pass.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
