<text x="303.0" y="207.0" class="ag" text-anchor="middle" >CLAUDE.md</text>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >query the graph first</text>
<rect x="54" y="276" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="286" width="5" height="60" rx="2" fill="#d64545"/>
<text x="303.0" y="311.0" class="ag" text-anchor="middle" >PreToolUse hook</text>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >before grep and Read</text>
<text x="300.0" y="408" class="lb" text-anchor="middle" >no hooks on your platform:</text>
<text x="300.0" y="434" class="lb" text-anchor="middle" >an AGENTS.md-style file instead</text>
