<text x="303.0" y="139.0" class="ag" text-anchor="middle" >one grammar per language</text>
<rect x="54" y="192" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="202" width="5" height="60" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="227.0" class="ag" text-anchor="middle" >All CPU cores</text>
<text x="303.0" y="251.0" class="ag" text-anchor="middle" >many files at once</text>
<path d="M300.0 160V190" class="flow"/>
