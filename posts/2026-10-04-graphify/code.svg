<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">graphify step 2a: the code pass</title>
<desc id="d">1 Parse: tree-sitter reads each code file on your machine, with no LLM and no cost, many files at once on all CPU cores. A few languages need an extra, for example SQL, Terraform or OCaml. 2 What it finds: classes and functions, imports, calls, comments that explain the code such as # NOTE: and # WHY:, SQL tables and joins, and package manifests. 3 Link across files: a second pass resolves calls between files. A call it can pin down exactly is EXTRACTED with score 1.0; a best guess by name is INFERRED with score 0.85. 4 Cache and hand over: each file is fingerprinted with SHA256 so an unchanged file is skipped next time; the nodes and edges join the LLM pass output. A code-only folder needs no API key.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
