<text x="903.0" y="331.0" class="ag" text-anchor="middle" >generated routes + handlers</text>
<path d="M900 152V184" class="flow"/>
<text x="1000" y="175" class="al" text-anchor="middle" >HTTP requests</text>
<path d="M900 248V280" class="flow"/>
<text x="1000" y="271" class="al" text-anchor="middle" >route adapter</text>
<text x="900" y="388" class="lb" text-anchor="middle" >Operational APIs and MCP have separate entries.</text>
<path d="M576 120H624" class="flow"/>
<text x="600" y="107" class="al" text-anchor="middle" >client</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<text x="900.0" y="536" class="gt" text-anchor="middle" >Domain request checks</text>
<rect x="654" y="560" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="570" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="585.0" class="ag" text-anchor="middle" >CORS + origin</text>
<text x="903.0" y="609.0" class="ag" text-anchor="middle" >preflight or admit</text>
<rect x="654" y="634" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="644" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="659.0" class="ag" text-anchor="middle" >Credentials + entitlements</text>
<text x="903.0" y="683.0" class="ag" text-anchor="middle" >resolve caller access</text>
<rect x="654" y="708" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="718" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="733.0" class="ag" text-anchor="middle" >Rate limits</text>
<text x="903.0" y="757.0" class="ag" text-anchor="middle" >endpoint + caller</text>
<rect x="654" y="782" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="792" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="807.0" class="ag" text-anchor="middle" >Route + handler</text>
<text x="903.0" y="831.0" class="ag" text-anchor="middle" >execute or report error</text>
<path d="M900 620V634" class="flow"/>
