<text x="900" y="467" class="al" text-anchor="middle" >domain request</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<text x="300.0" y="536" class="gt" text-anchor="middle" >Response policy</text>
<rect x="54" y="560" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="570" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="587.0" class="ag" text-anchor="middle" >Cache policy</text>
<text x="303.0" y="611.0" class="ag" text-anchor="middle" >public / private / no-store</text>
<rect x="54" y="654" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="664" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="681.0" class="ag" text-anchor="middle" >Optional JSON projection</text>
<text x="303.0" y="705.0" class="ag" text-anchor="middle" >?jmespath=expression</text>
<rect x="54" y="748" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="758" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >ETag comparison</text>
<text x="303.0" y="799.0" class="ag" text-anchor="middle" >unchanged → 304</text>
<path d="M300 624V654" class="flow"/>
<text x="380" y="645" class="al" text-anchor="middle" >body</text>
