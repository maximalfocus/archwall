<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Contracts and the API gateway</title>
<desc id="d">HTTP-annotated protobuf services generate TypeScript clients, server routes and OpenAPI. Browser clients send requests through a shared domain gateway. It checks origins, credentials and entitlements, limits requests and invokes handwritten handlers. Status-200 GET or HEAD bodies receive cache policy, optional JSON projection and ETag validation. Operational APIs and MCP have separate entry points.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="24" width="552" height="400" rx="12" class="grp"/>
<text x="300.0" y="60" class="gt" text-anchor="middle" >Contract and generation</text>
<rect x="54" y="88" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Protobuf services</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >HTTP paths + types</text>
<path d="M300 152V174" class="flow"/>
<text x="420" y="168" class="al" text-anchor="middle" >Buf + sebuf</text>
<rect x="54" y="174" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="184" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="201.0" class="ag" text-anchor="middle" >Generated TypeScript</text>
<text x="303.0" y="225.0" class="ag" text-anchor="middle" >clients + server routes</text>
<rect x="54" y="264" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="274" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="291.0" class="ag" text-anchor="middle" >Generated OpenAPI</text>
<text x="303.0" y="315.0" class="ag" text-anchor="middle" >API reference</text>
<text x="300" y="378" class="lb" text-anchor="middle" >Handlers remain handwritten.</text>
<rect x="624" y="24" width="552" height="400" rx="12" class="grp"/>
<text x="900.0" y="60" class="gt" text-anchor="middle" >Request entry points</text>
<rect x="654" y="88" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="98" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Browser services</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >generated TS clients</text>
<rect x="654" y="184" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="194" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="211.0" class="ag" text-anchor="middle" >Domain HTTP routes</text>
<text x="903.0" y="235.0" class="ag" text-anchor="middle" >api/&lt;domain&gt;/v1/[rpc]</text>
<rect x="654" y="280" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="290" width="5" height="44" rx="2" fill="#2f6fd6"/>
