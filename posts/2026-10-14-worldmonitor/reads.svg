<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Stock and index quotes: seed first</title>
<desc id="d">A stock or index quote request reads the fixed market seed first. An invalid or empty seed returns unavailable without calling a provider. Symbols found in the seed are answered. Missing symbols must first be admitted: a provider has to be configured, support the symbol and fit the per-request limit. Only admitted symbols check their per-symbol cache, and a cache hit answers without a provider call. A provider is called only on a cache miss. The answer keeps the requested order and gives a reason for each unavailable symbol.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="24" width="552" height="440" rx="12" class="grp"/>
<circle cx="222.5" cy="51" r="14" class="num"/>
<text x="222.5" y="57" class="numt" text-anchor="middle" >1</text>
<text x="242.5" y="60" class="gt" text-anchor="start" >Seed check</text>
<rect x="54" y="88" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="98" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="115.0" class="ag" text-anchor="middle" >Quote request</text>
<text x="303.0" y="139.0" class="ag" text-anchor="middle" >stock or index symbols</text>
<rect x="54" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="180" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="197.0" class="ag" text-anchor="middle" >Seed snapshot</text>
<text x="303.0" y="221.0" class="ag" text-anchor="middle" >market:stocks-bootstrap:v1</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Invalid or empty seed: unavailable.</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >All symbols found: answer now.</text>
<rect x="624" y="24" width="552" height="440" rx="12" class="grp"/>
<circle cx="815.75" cy="51" r="14" class="num"/>
<text x="815.75" y="57" class="numt" text-anchor="middle" >2</text>
<text x="835.75" y="60" class="gt" text-anchor="start" >Seed lookup</text>
<rect x="654" y="88" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="98" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="115.0" class="ag" text-anchor="middle" >Symbols found</text>
<text x="903.0" y="139.0" class="ag" text-anchor="middle" >answered from the seed</text>
<rect x="654" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="180" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="197.0" class="ag" text-anchor="middle" >Symbols missing</text>
<text x="903.0" y="221.0" class="ag" text-anchor="middle" >not in the seed</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Found symbols stay in the answer.</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >Missing symbols go on below.</text>
<path d="M576 260H624" class="flow"/>
<text x="600" y="250" class="al" text-anchor="middle" >seed rows</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="788.75" cy="527" r="14" class="num"/>
<text x="788.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="808.75" y="536" class="gt" text-anchor="start" >Missing symbols</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Provider admitted</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >configured and supported</text>
<rect x="654" y="646" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="656" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="673.0" class="ag" text-anchor="middle" >Per-symbol cache</text>
<text x="903.0" y="697.0" class="ag" text-anchor="middle" >hit answers, no call</text>
<rect x="654" y="728" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="738" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="755.0" class="ag" text-anchor="middle" >Provider call</text>
<text x="903.0" y="779.0" class="ag" text-anchor="middle" >cache miss only</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Not admitted: unavailable, no cache read.</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >Provider errors are not cached.</text>
<path d="M900 464V500" class="flow"/>
<text x="900" y="482" class="al" text-anchor="middle" >missing symbols</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="249.5" cy="527" r="14" class="num"/>
<text x="249.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="536" class="gt" text-anchor="start" >Answer</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Quotes</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >seed and fetched answers</text>
<rect x="54" y="646" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="656" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="673.0" class="ag" text-anchor="middle" >Unavailable symbols</text>
<text x="303.0" y="697.0" class="ag" text-anchor="middle" >one reason each</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Output keeps the requested order.</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >Unknown symbols get a reason.</text>
<path d="M624 700H576" class="flow"/>
<text x="600" y="690" class="al" text-anchor="middle" >answers</text>
<path d="M760 464V482H300V500" class="flow"/>
<text x="530" y="477" class="al" text-anchor="middle" >found symbols</text>
</svg>
