<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Desktop and Docker choices</title>
<desc id="d">Tauri wraps the dashboard. Native Rust owns the operating-system keyring and authenticates loopback calls to a Node sidecar. The sidecar runs local handlers and uses selected cloud-preferred routes or gated fallback. The frontend Docker image serves static assets through nginx and proxies APIs to its configured upstream. The root Docker image combines nginx and Node, with Compose wiring Redis REST, Redis and an AIS relay. Docker mode disables public-cloud fallback; provider keys are optional.</desc>
