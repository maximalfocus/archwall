<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Data collection and delivery</title>
<desc id="d">Railway relays collect streams and RSS. Scheduled seed bundles validate upstream data before publishing Redis keys. Consumer Prices Core stores retailer observations in PostgreSQL and aggregates prices into snapshots. Redis carries canonical data, optional freshness envelopes and seed metadata. Bootstrap batches fast and slow tier reads into a browser hydration cache, while RPC handlers read domain keys. Health checks inspect freshness and service status.</desc>
