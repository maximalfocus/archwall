<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Build, deploy and observe</title>
<desc id="d">GitHub checks types, code, tests, security, proto generation and stacked merges; Deploy Gate aggregates results for a commit. Vercel serves the web app and API; Railway runs ingestion; Convex and Cloudflare have separate deployment workflows. Desktop releases build the Tauri app with its Node sidecar; GHCR publishes container images. Scheduled probes check data freshness, API cache and authentication, and Railway drift; Sentry reports client faults when a DSN is set. These are independent checks and deployment surfaces, not one ordered release pipeline.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
