<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Accounts, durable state and access</title>
<desc id="d">Clerk signs in dashboard users. Edge APIs verify session JWTs and persist preferences, followed countries, notification settings and subscription state in Convex. Dodo checkout sends signed payment webhooks that update subscription records. External agents use API keys or MCP OAuth; MCP domain tools can call the same domain handlers through authenticated requests. Redis caches access rights while Convex holds durable records. Separately, seeders append intelligence events and vectors to Convex for timeline and semantic search.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
