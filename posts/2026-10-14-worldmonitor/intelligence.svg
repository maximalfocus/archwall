<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">From observations to signals and summaries</title>
<desc id="d">News items receive keyword threat labels and locations, then word-overlap clustering with optional semantic refinement. Cached physical and news observations also feed server country and strategic risk, geographic correlations and seasonal-count anomalies. Risk health checks source coverage; anomalies require enough baseline samples. Optional local ML supplies embeddings, sentiment and named entities. Summary requests use configured entitled APIs Ollama then OpenRouter in normal mode, followed by available browser T5; beta can try already-loaded local T5 first. RSS breaking alerts and OREF sirens form distinct notification inputs.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
