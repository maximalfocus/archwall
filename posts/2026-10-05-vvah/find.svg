<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">VVAH phase 1: find where to look</title>
<desc id="d">1 What goes in: your repo, plus optional files: known CVEs, design controls and a CMDB export. Missing files just mean less context; the CMDB is used when scoring the report. 2 Map the code: an AI pass drops non-production files, S0 builds a static code map of where input reaches risky calls (in the default profile an AI helps label it), and S1 an AI explorer surveys the repo with read-only tools. 3 Threat model, S2: assets worth protecting, trust boundaries where outsiders get in, and ranked threats; known CVEs raise a threat's likelihood. 4 Split the work, S3: risk chunks, taint chunks, specialist chunks for 11 lenses, catch-all chunks for files no lens claimed, and threat chunks. Ten of the eleven lenses need their surface; logic-bug always runs.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
