<text x="903.0" y="651.0" class="ag" text-anchor="middle" >Kill switch</text>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >env var or file → advice only</text>
<rect x="654" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="726" width="5" height="52" rx="2" fill="#d64545"/>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >No shell</text>
<text x="903.0" y="771.0" class="ag" text-anchor="middle" >left out on purpose</text>
<text x="900.0" y="830" class="lb" text-anchor="middle" >no policy file → no edits at all</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="222.5" cy="487" r="14" class="num"/>
<text x="222.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="242.5" y="496" class="gt" text-anchor="start" >Fix record</text>
<rect x="54" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="555.0" class="ag" text-anchor="middle" >finding_case.json</text>
<text x="303.0" y="579.0" class="ag" text-anchor="middle" >finding, fix, status</text>
<rect x="54" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="630" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="651.0" class="ag" text-anchor="middle" >diff.patch</text>
<text x="303.0" y="675.0" class="ag" text-anchor="middle" >the change, secrets masked</text>
<rect x="54" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="726" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="747.0" class="ag" text-anchor="middle" >Stopgap</text>
<text x="303.0" y="771.0" class="ag" text-anchor="middle" >rule, config or flag to try</text>
<text x="300.0" y="830" class="lb" text-anchor="middle" >next: S11 grades the fix</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >findings</text>
<path d="M900.0 428V458" class="flow"/>
<text x="983.0" y="449" class="al" text-anchor="middle" >proposed change</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >allowed</text>
</svg>
