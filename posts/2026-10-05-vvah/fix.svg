<text x="903.0" y="555.0" class="ag" text-anchor="middle" >Policy gate</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >no edits to CI, hooks, .git</text>
<rect x="654" y="620" width="492" height="72" rx="8" class="agent"/>
