<rect x="54" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="194" width="5" height="60" rx="2" fill="#d64545"/>
<text x="303.0" y="219.0" class="ag" text-anchor="middle" >Turn it on</text>
<text x="303.0" y="243.0" class="ag" text-anchor="middle" >--remediate or remediate command</text>
<path d="M300.0 160V182" class="flow"/>
<text x="300.0" y="316" class="lb" text-anchor="middle" >off in the default profile</text>
<text x="300.0" y="344" class="lb" text-anchor="middle" >--top N: only the N worst</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="802.25" cy="43" r="14" class="num"/>
<text x="802.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="822.25" y="52" class="gt" text-anchor="start" >Plan and edit</text>
<rect x="654" y="80" width="492" height="80" rx="8" class="agent"/>
