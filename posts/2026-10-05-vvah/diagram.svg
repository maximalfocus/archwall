<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">VVAH overview</title>
<desc id="d">Input: your code repository plus optional context files. 1 Find where to look: S0 builds a static code map and S1 surveys the repo, S2 builds a threat model, S3 splits the work into chunks for the reviewers, including 11 specialist lenses. 2 Hunt and double-check: S4 AI reviewers look for weaknesses in each chunk, optionally voting; S5 filters obvious mistakes with rules and no AI; S6 a fresh verifier tries to prove each finding wrong, with an optional live check. 3 Report: S7 merges duplicates, S8 links findings into attack chains and re-ranks them, S9 writes a Markdown report and SARIF. 4 Fix and grade, off in the default profile: S10 proposes a minimal code fix, S11 two AI reviewers grade it, and people review every finding and fix.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >Your code repo  +  optional context files</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="360" rx="12" class="grp"/>
<circle cx="168.5" cy="111" r="14" class="num"/>
<text x="168.5" y="117" class="numt" text-anchor="middle" >1</text>
<text x="188.5" y="120" class="gt" text-anchor="start" >Find where to look</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Map the code</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >S0 code map · S1 repo survey</text>
<rect x="54" y="238" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="248" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="265.0" class="ag" text-anchor="middle" >Threat model</text>
<text x="303.0" y="289.0" class="ag" text-anchor="middle" >S2: what is valuable, who attacks</text>
<path d="M300.0 212V236" class="flow"/>
<rect x="54" y="328" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="338" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="355.0" class="ag" text-anchor="middle" >Split the work</text>
<text x="303.0" y="379.0" class="ag" text-anchor="middle" >S3: chunks for 11 specialist lenses</text>
<path d="M300.0 302V326" class="flow"/>
<rect x="624" y="84" width="552" height="360" rx="12" class="grp"/>
<circle cx="748.25" cy="111" r="14" class="num"/>
<text x="748.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="768.25" y="120" class="gt" text-anchor="start" >Hunt and double-check</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Hunt in each chunk</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >S4: AI reviewers, optional vote</text>
<rect x="654" y="238" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="248" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="265.0" class="ag" text-anchor="middle" >Filter the obvious</text>
<text x="903.0" y="289.0" class="ag" text-anchor="middle" >S5: rules, no AI</text>
<path d="M900.0 212V236" class="flow"/>
<rect x="654" y="328" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="338" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="355.0" class="ag" text-anchor="middle" >Try to prove it wrong</text>
<text x="903.0" y="379.0" class="ag" text-anchor="middle" >S6: verifier, optional live check</text>
<path d="M900.0 302V326" class="flow"/>
<rect x="624" y="480" width="552" height="372" rx="12" class="grp"/>
<circle cx="849.5" cy="507" r="14" class="num"/>
<text x="849.5" y="513" class="numt" text-anchor="middle" >3</text>
<text x="869.5" y="516" class="gt" text-anchor="start" >Report</text>
<rect x="654" y="544" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="554" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="571.0" class="ag" text-anchor="middle" >Merge duplicates</text>
<text x="903.0" y="595.0" class="ag" text-anchor="middle" >S7: same root cause, one finding</text>
<rect x="654" y="634" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="644" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="661.0" class="ag" text-anchor="middle" >Link into attack chains</text>
<text x="903.0" y="685.0" class="ag" text-anchor="middle" >S8: re-rank by real risk</text>
<path d="M900.0 608V632" class="flow"/>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Write the report</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >S9: Markdown + SARIF</text>
<path d="M900.0 698V722" class="flow"/>
<rect x="24" y="480" width="552" height="372" rx="12" class="grp"/>
<circle cx="141.5" cy="507" r="14" class="num"/>
<text x="141.5" y="513" class="numt" text-anchor="middle" >4</text>
<text x="161.5" y="516" class="gt" text-anchor="start" >Fix and grade (opt-in)</text>
<rect x="54" y="544" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="554" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="571.0" class="ag" text-anchor="middle" >Propose a fix</text>
<text x="303.0" y="595.0" class="ag" text-anchor="middle" >S10: minimal code change</text>
<rect x="54" y="634" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="644" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="661.0" class="ag" text-anchor="middle" >Grade the fix</text>
<text x="303.0" y="685.0" class="ag" text-anchor="middle" >S11: two AI reviewers</text>
<path d="M300.0 608V632" class="flow"/>
<rect x="54" y="724" width="492" height="64" rx="8" class="human"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >People decide</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >review every finding and fix</text>
<path d="M300.0 698V722" class="flow"/>
<text x="300.0" y="830" class="lb" text-anchor="middle" >S10 and S11 are off in the default profile</text>
<path d="M576 294H622" class="flow"/>
<text x="600" y="282" class="al" text-anchor="middle" >chunks</text>
<path d="M900.0 444V478" class="flow"/>
<text x="990.0" y="468" class="al" text-anchor="middle" >true positives</text>
<path d="M624 680H578" class="flow"/>
<text x="600" y="668" class="al" text-anchor="middle" >findings</text>
<text x="600" y="884" class="lb" text-anchor="middle" >Every finding is a lead for a person to check, not a final answer</text>
</svg>
