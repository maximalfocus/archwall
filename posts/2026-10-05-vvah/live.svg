<text x="303.0" y="135.0" class="ag" text-anchor="middle" >EV_API_COLLECTION</text>
<rect x="54" y="176" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="186" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="207.0" class="ag" text-anchor="middle" >Target on this machine</text>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >localhost only, no override</text>
<path d="M300.0 152V174" class="flow"/>
<rect x="54" y="272" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="282" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="303.0" class="ag" text-anchor="middle" >Reachability probe</text>
<text x="303.0" y="327.0" class="ag" text-anchor="middle" >before any AI spend</text>
<path d="M300.0 248V270" class="flow"/>
<text x="300.0" y="396" class="lb" text-anchor="middle" >safe mode skips destructive tests</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="863.0" cy="43" r="14" class="num"/>
<text x="863.0" y="49" class="numt" text-anchor="middle" >2</text>
<text x="883.0" y="52" class="gt" text-anchor="start" >Plan</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="111.0" class="ag" text-anchor="middle" >Classify</text>
<text x="903.0" y="135.0" class="ag" text-anchor="middle" >can a web request test it?</text>
<rect x="654" y="176" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="186" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="207.0" class="ag" text-anchor="middle" >Map</text>
<text x="903.0" y="231.0" class="ag" text-anchor="middle" >finding → endpoint</text>
<path d="M900.0 152V174" class="flow"/>
<rect x="654" y="272" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="282" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="303.0" class="ag" text-anchor="middle" >Pick a test</text>
<text x="903.0" y="327.0" class="ag" text-anchor="middle" >by kind of weakness</text>
<path d="M900.0 248V270" class="flow"/>
<text x="900.0" y="396" class="lb" text-anchor="middle" >not testable over the web → static only</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
