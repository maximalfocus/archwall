<text x="795.5" y="493" class="numt" text-anchor="middle" >3</text>
<text x="815.5" y="496" class="gt" text-anchor="start" >Test and judge</text>
<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >Send and check</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >look for a clear sign</text>
<rect x="654" y="620" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="651.0" class="ag" text-anchor="middle" >Attacker agent</text>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >a few more tries, capped</text>
<path d="M900.0 596V618" class="flow"/>
<rect x="654" y="716" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="726" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >Independent judge</text>
<text x="903.0" y="771.0" class="ag" text-anchor="middle" >sees only real traffic</text>
<path d="M900.0 692V714" class="flow"/>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="242.75" cy="487" r="14" class="num"/>
<text x="242.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="496" class="gt" text-anchor="start" >Outcome</text>
<rect x="54" y="524" width="238" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="555.0" class="ag" text-anchor="middle" >Confirmed</text>
<text x="176.0" y="579.0" class="ag" text-anchor="middle" >with a repro</text>
<rect x="308" y="524" width="238" height="72" rx="8" class="agent"/>
<rect x="308" y="534" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="430.0" y="555.0" class="ag" text-anchor="middle" >Not confirmed</text>
<text x="430.0" y="579.0" class="ag" text-anchor="middle" >evidence against</text>
<rect x="54" y="610" width="238" height="72" rx="8" class="agent"/>
<rect x="54" y="620" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="176.0" y="641.0" class="ag" text-anchor="middle" >Needs review</text>
<text x="176.0" y="665.0" class="ag" text-anchor="middle" >could not decide</text>
<rect x="308" y="610" width="238" height="72" rx="8" class="agent"/>
<rect x="308" y="620" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="430.0" y="641.0" class="ag" text-anchor="middle" >Static only</text>
<text x="430.0" y="665.0" class="ag" text-anchor="middle" >not testable live</text>
<g transform="translate(272 538)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<rect x="54" y="708" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="718" width="5" height="52" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="739.0" class="ag" text-anchor="middle" >ev-replay</text>
<text x="303.0" y="763.0" class="ag" text-anchor="middle" >re-run a confirmed test after the fix</text>
<text x="300.0" y="830" class="lb" text-anchor="middle" >the static verifier still owns the verdict</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >routes</text>
<path d="M900.0 428V458" class="flow"/>
<text x="955.4" y="449" class="al" text-anchor="middle" >test plan</text>
