<text x="775.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="795.25" y="52" class="gt" text-anchor="start" >Filter: S5, no AI</text>
<rect x="654" y="80" width="238" height="80" rx="8" class="agent"/>
