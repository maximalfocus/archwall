<rect x="654" y="176" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="186" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="211.0" class="ag" text-anchor="middle" >Low confidence</text>
<text x="776.0" y="235.0" class="ag" text-anchor="middle" >below the bar</text>
<rect x="908" y="176" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="186" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="211.0" class="ag" text-anchor="middle" >No evidence</text>
<text x="1030.0" y="235.0" class="ag" text-anchor="middle" >no source, sink</text>
<text x="900.0" y="316" class="lb" text-anchor="middle" >one optional AI call</text>
<text x="900.0" y="344" class="lb" text-anchor="middle" >merges look-alikes</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="768.5" cy="487" r="14" class="num"/>
<text x="768.5" y="493" class="numt" text-anchor="middle" >3</text>
<text x="788.5" y="496" class="gt" text-anchor="start" >Prove it wrong: S6</text>
<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#e8973a"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >Fresh verifier per finding</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >re-reads code, hunts for defences</text>
<rect x="654" y="656" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="666" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="776.0" y="691.0" class="ag" text-anchor="middle" >True positive</text>
<text x="776.0" y="715.0" class="ag" text-anchor="middle" >gets a CVSS score</text>
<rect x="908" y="656" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="666" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="1030.0" y="691.0" class="ag" text-anchor="middle" >False positive</text>
<text x="1030.0" y="715.0" class="ag" text-anchor="middle" >kept for audit</text>
<g transform="translate(872 670)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<g transform="translate(1126 670)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#d64545"/><path d="M-4.5-4.5l9 9M4.5-4.5l-9 9" stroke="#fff" stroke-width="2.4"/></g>
<path d="M773 596V654" class="flow"/>
<path d="M1027 596V654" class="flow"/>
<text x="900.0" y="790" class="lb" text-anchor="middle" >true positives go on to the report</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="121.25" cy="487" r="14" class="num"/>
<text x="121.25" y="493" class="numt" text-anchor="middle" >4</text>
<text x="141.25" y="496" class="gt" text-anchor="start" >Live check (beta, opt-in)</text>
<rect x="54" y="524" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#e8973a"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Exploit verification</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >tests a running copy of the app</text>
<rect x="54" y="628" width="492" height="80" rx="8" class="agent"/>
