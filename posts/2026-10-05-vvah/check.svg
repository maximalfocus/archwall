<text x="236.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="256.0" y="52" class="gt" text-anchor="start" >Hunt: S4</text>
<rect x="54" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="111.0" class="ag" text-anchor="middle" >AI reviewer per chunk</text>
<text x="303.0" y="135.0" class="ag" text-anchor="middle" >looks for weaknesses</text>
<rect x="54" y="192" width="238" height="72" rx="8" class="agent"/>
<rect x="54" y="202" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="176.0" y="223.0" class="ag" text-anchor="middle" >Language lens</text>
<text x="176.0" y="247.0" class="ag" text-anchor="middle" >42 languages</text>
<rect x="308" y="192" width="238" height="72" rx="8" class="agent"/>
<rect x="308" y="202" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="430.0" y="223.0" class="ag" text-anchor="middle" >Specialist lens</text>
<text x="430.0" y="247.0" class="ag" text-anchor="middle" >11 kinds</text>
<path d="M173 192V154" class="flow"/>
<path d="M427 192V154" class="flow"/>
<text x="300.0" y="326" class="lb" text-anchor="middle" >optional vote: 3 runs, 2 must agree</text>
<text x="300.0" y="354" class="lb" text-anchor="middle" >on in the full profile only</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
