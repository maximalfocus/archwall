<rect x="54" y="184" width="492" height="80" rx="8" class="agent"/>
<rect x="54" y="194" width="5" height="60" rx="2" fill="#d64545"/>
<text x="303.0" y="219.0" class="ag" text-anchor="middle" >Discover</text>
<text x="303.0" y="243.0" class="ag" text-anchor="middle" >picks cases to grade, no AI</text>
<path d="M300.0 160V182" class="flow"/>
<text x="300.0" y="316" class="lb" text-anchor="middle" >off in the default scan;</text>
<text x="300.0" y="344" class="lb" text-anchor="middle" >the validate command runs it any time</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="734.75" cy="43" r="14" class="num"/>
<text x="734.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="754.75" y="52" class="gt" text-anchor="start" >Review panel, read-only</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
