<rect x="54" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="559.0" class="ag" text-anchor="middle" >Fixed</text>
<text x="176.0" y="583.0" class="ag" text-anchor="middle" >score ≥ 0.80</text>
<rect x="308" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="534" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="430.0" y="559.0" class="ag" text-anchor="middle" >Partially fixed</text>
<text x="430.0" y="583.0" class="ag" text-anchor="middle" >score ≥ 0.50</text>
<rect x="54" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="630" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="176.0" y="655.0" class="ag" text-anchor="middle" >Not fixed</text>
<text x="176.0" y="679.0" class="ag" text-anchor="middle" >score &lt; 0.50</text>
<rect x="308" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="630" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="430.0" y="655.0" class="ag" text-anchor="middle" >Inconclusive</text>
<text x="430.0" y="679.0" class="ag" text-anchor="middle" >reviewers split</text>
<g transform="translate(272 538)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2f9e6e"/><path d="M-5 0l3.5 4 6.5-8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<text x="300.0" y="760" class="lb" text-anchor="middle" >root cause or new bugs fail →</text>
<text x="300.0" y="788" class="lb" text-anchor="middle" >at best partially fixed</text>
<path d="M576 222H622" class="flow"/>
<text x="600" y="210" class="al" text-anchor="middle" >one case</text>
<path d="M900.0 428V458" class="flow"/>
<text x="983.0" y="449" class="al" text-anchor="middle" >votes per check</text>
<path d="M624 660H578" class="flow"/>
<text x="600" y="648" class="al" text-anchor="middle" >score</text>
