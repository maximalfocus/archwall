<rect x="654" y="598" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="608" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="903.0" y="635.0" class="ag" text-anchor="middle" >Every instance · 25%</text>
<rect x="654" y="672" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="682" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="903.0" y="709.0" class="ag" text-anchor="middle" >No new bugs · 19%</text>
<rect x="654" y="746" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="756" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="903.0" y="783.0" class="ag" text-anchor="middle" >Best practice · 14%</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="242.75" cy="487" r="14" class="num"/>
<text x="242.75" y="493" class="numt" text-anchor="middle" >4</text>
