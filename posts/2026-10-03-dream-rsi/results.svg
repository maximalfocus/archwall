<text x="256.0" y="52" class="gt" text-anchor="start" >The test</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Same start policy</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >parallel refine, round 1 identical</text>
<rect x="54" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="180" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="197.0" class="ag" text-anchor="middle" >Fixed exploration</text>
<text x="303.0" y="221.0" class="ag" text-anchor="middle" >never changes the policy</text>
<rect x="54" y="260" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="270" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="287.0" class="ag" text-anchor="middle" >Dream-RSI</text>
<text x="303.0" y="311.0" class="ag" text-anchor="middle" >rewrites it between rounds</text>
<text x="300.0" y="368" class="lb" text-anchor="middle" >same agent, evaluator, budget</text>
<text x="300.0" y="394" class="lb" text-anchor="middle" >cost = total agent calls</text>
