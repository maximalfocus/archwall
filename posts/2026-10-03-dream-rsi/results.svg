<rect x="654" y="270" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="287.0" class="ag" text-anchor="middle" >162× fewer calls</text>
<text x="903.0" y="311.0" class="ag" text-anchor="middle" >than SimpleTES (51,200)</text>
<text x="900.0" y="368" class="lb" text-anchor="middle" >faster than sklearn and glmnet on all 6</text>
