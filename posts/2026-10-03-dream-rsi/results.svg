<circle cx="782.0" cy="495" r="14" class="num"/>
<text x="782.0" y="501" class="numt" text-anchor="middle" >3</text>
<text x="802.0" y="504" class="gt" text-anchor="start" >Math, 3 problems</text>
<rect x="654" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Sum–difference</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >1.145427, best listed</text>
<rect x="654" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="632" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="649.0" class="ag" text-anchor="middle" >Circle packing</text>
<text x="903.0" y="673.0" class="ag" text-anchor="middle" >2.635983, tied best</text>
<rect x="654" y="712" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="722" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="739.0" class="ag" text-anchor="middle" >Autocorrelation</text>
<text x="903.0" y="763.0" class="ag" text-anchor="middle" >competitive, not best</text>
<text x="900.0" y="820" class="lb" text-anchor="middle" >under 1,000 generations</text>
<text x="900.0" y="846" class="lb" text-anchor="middle" >(SimpleTES: 51,200)</text>
<rect x="24" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="155.0" cy="495" r="14" class="num"/>
<text x="155.0" y="501" class="numt" text-anchor="middle" >4</text>
<text x="175.0" y="504" class="gt" text-anchor="start" >GPU kernels, 4 tasks</text>
<rect x="54" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >VGG16 2.43×, LayerNorm 1.79×</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >fewer generations, same result</text>
<rect x="54" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="632" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="649.0" class="ag" text-anchor="middle" >ConvDiv 2.09×, ConvMax 1.44×</text>
<text x="303.0" y="673.0" class="ag" text-anchor="middle" >higher score, same budget</text>
<text x="300.0" y="768" class="lb" text-anchor="middle" >KernelBench, Gemini-3.1 Pro</text>
</svg>
