<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Dream-RSI step 3: dream</title>
<desc id="d">1 Start: version 0 is the current policy; the pool of t trees stays fixed while dreaming. 2 Score: each version is replayed on every tree at zero executions and gets its average score. 3 Rewrite: a policy-development agent, an LLM that stays the same, reads the replay traces and scores, plus feedback from earlier versions, and writes the next version of the policy code, which is scored the same way. 4 Pick: after M versions, the one with the best average score is deployed for the next online run. Version 0 competes too, so the pick never scores worse on replay of these trees.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="256.25" cy="43" r="14" class="num"/>
<text x="256.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="276.25" y="52" class="gt" text-anchor="start" >Start</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Current policy</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >version 0</text>
<rect x="54" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="180" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="197.0" class="ag" text-anchor="middle" >Pool of t trees</text>
<text x="303.0" y="221.0" class="ag" text-anchor="middle" >fixed while dreaming</text>
<rect x="624" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="856.25" cy="43" r="14" class="num"/>
<text x="856.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="876.25" y="52" class="gt" text-anchor="start" >Score</text>
<rect x="654" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="107.0" class="ag" text-anchor="middle" >Replay on every tree</text>
<text x="903.0" y="131.0" class="ag" text-anchor="middle" >zero executions</text>
<rect x="654" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="180" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="197.0" class="ag" text-anchor="middle" >Average score</text>
<text x="903.0" y="221.0" class="ag" text-anchor="middle" >over all t trees</text>
<path d="M900.0 144V168" class="flow"/>
<rect x="624" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="842.75" cy="495" r="14" class="num"/>
<text x="842.75" y="501" class="numt" text-anchor="middle" >3</text>
<text x="862.75" y="504" class="gt" text-anchor="start" >Rewrite</text>
<rect x="654" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Policy-dev agent</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >reads traces + scores</text>
<rect x="654" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="632" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="649.0" class="ag" text-anchor="middle" >Next version</text>
<text x="903.0" y="673.0" class="ag" text-anchor="middle" >new policy code</text>
<path d="M900.0 596V620" class="flow"/>
<text x="900.0" y="768" class="lb" text-anchor="middle" >also reads feedback</text>
<text x="900.0" y="794" class="lb" text-anchor="middle" >from earlier versions</text>
<rect x="24" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="263.0" cy="495" r="14" class="num"/>
<text x="263.0" y="501" class="numt" text-anchor="middle" >4</text>
<text x="283.0" y="504" class="gt" text-anchor="start" >Pick</text>
<rect x="54" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Best average score</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >out of all M versions</text>
<rect x="54" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="632" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="649.0" class="ag" text-anchor="middle" >Deploy it</text>
<text x="303.0" y="673.0" class="ag" text-anchor="middle" >for the next online run</text>
<path d="M300.0 596V620" class="flow"/>
<text x="300.0" y="768" class="lb" text-anchor="middle" >version 0 competes too: never worse</text>
<text x="300.0" y="794" class="lb" text-anchor="middle" >on replay of these trees</text>
<path d="M576 200H622" class="flow"/>
<text x="600" y="188" class="al" text-anchor="middle" >version 0</text>
<path d="M810.0 420V466" class="flow"/>
<text x="754.0" y="450" class="al" text-anchor="middle" >scores</text>
<path d="M990.0 468V422" class="flow back"/>
<text x="1066.0" y="450" class="al" text-anchor="middle" >next version</text>
<path d="M624 668H578" class="flow"/>
<text x="600" y="656" class="al" text-anchor="middle" >M done</text>
</svg>
