<rect x="24" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="134.75" cy="43" r="14" class="num"/>
<text x="134.75" y="49" class="numt" text-anchor="middle" >1</text>
<text x="154.75" y="52" class="gt" text-anchor="start" >What the policy decides</text>
<rect x="54" y="80" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="115.0" class="ag" text-anchor="middle" >Where next</text>
<text x="176.0" y="139.0" class="ag" text-anchor="middle" >which node</text>
<rect x="308" y="80" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="90" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="430.0" y="115.0" class="ag" text-anchor="middle" >How many at once</text>
<text x="430.0" y="139.0" class="ag" text-anchor="middle" >up to W</text>
<rect x="54" y="180" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="190" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="176.0" y="215.0" class="ag" text-anchor="middle" >When to stop</text>
<text x="176.0" y="239.0" class="ag" text-anchor="middle" >end the run</text>
<rect x="308" y="180" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="190" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="430.0" y="215.0" class="ag" text-anchor="middle" >How wide, how deep</text>
<text x="430.0" y="239.0" class="ag" text-anchor="middle" >the next run's grid</text>
<text x="300.0" y="316" class="lb" text-anchor="middle" >it is code, rewritten by an agent</text>
<text x="300.0" y="342" class="lb" text-anchor="middle" >between rounds</text>
<rect x="624" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="795.5" cy="43" r="14" class="num"/>
<text x="795.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="52" class="gt" text-anchor="start" >One knob: beta</text>
<rect x="654" y="80" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="776.0" y="115.0" class="ag" text-anchor="middle" >High beta</text>
<text x="776.0" y="139.0" class="ag" text-anchor="middle" >wider, more patient</text>
<rect x="908" y="80" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="90" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="1030.0" y="115.0" class="ag" text-anchor="middle" >Low beta</text>
<text x="1030.0" y="139.0" class="ag" text-anchor="middle" >fewer tries, stops early</text>
<text x="900.0" y="216" class="lb" text-anchor="middle" >fixed during a run;</text>
<text x="900.0" y="242" class="lb" text-anchor="middle" >default re-chosen between rounds</text>
<rect x="624" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="755.0" cy="495" r="14" class="num"/>
<text x="755.0" y="501" class="numt" text-anchor="middle" >3</text>
<text x="775.0" y="504" class="gt" text-anchor="start" >Rules while dreaming</text>
<rect x="654" y="532" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="567.0" class="ag" text-anchor="middle" >Sees only</text>
<text x="776.0" y="591.0" class="ag" text-anchor="middle" >what it revealed</text>
<rect x="908" y="532" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="542" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="567.0" class="ag" text-anchor="middle" >No copying</text>
<text x="1030.0" y="591.0" class="ag" text-anchor="middle" >scores or node ids</text>
<rect x="654" y="632" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="642" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="667.0" class="ag" text-anchor="middle" >Traces only</text>
<text x="776.0" y="691.0" class="ag" text-anchor="middle" >between rounds</text>
<rect x="908" y="632" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="642" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="667.0" class="ag" text-anchor="middle" >Agent edits only</text>
<text x="1030.0" y="691.0" class="ag" text-anchor="middle" >the policy file</text>
<text x="900.0" y="768" class="lb" text-anchor="middle" >set in the policy-dev agent's prompt</text>
<rect x="24" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="168.5" cy="495" r="14" class="num"/>
<text x="168.5" y="501" class="numt" text-anchor="middle" >4</text>
<text x="188.5" y="504" class="gt" text-anchor="start" >What never changes</text>
<rect x="54" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Coding agent + model</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >no training at all</text>
<rect x="54" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="632" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="649.0" class="ag" text-anchor="middle" >Evaluator + tools</text>
<text x="303.0" y="673.0" class="ag" text-anchor="middle" >same every round</text>
<text x="300.0" y="738" class="lb" text-anchor="middle" >only the policy code changes</text>
<path d="M576 200H622" class="flow"/>
<text x="600" y="188" class="al" text-anchor="middle" >uses</text>
</svg>
