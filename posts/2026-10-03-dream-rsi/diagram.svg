<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Dream-RSI overview</title>
<desc id="d">1 Explore online: the exploration policy, which is code, decides where a coding agent continues, how many tries run at once and when to stop; a fixed evaluator scores each try. 2 Store the tree: the run leaves a discovery tree of every try and its score, added to a pool that grows by one tree per round; replaying a tree reruns nothing. 3 Dream: a policy-development agent rewrites the policy M times; each version is replayed on every tree in the pool at zero executions, and its scores and traces guide the next rewrite. 4 Deploy the best: the version with the best replay score runs the next round; the current policy competes too, so the pick never scores worse on replay.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="195.5" cy="43" r="14" class="num"/>
<text x="195.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="215.5" y="52" class="gt" text-anchor="start" >Explore online</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Exploration policy (code)</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >where, how many, when to stop</text>
<rect x="54" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="180" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="197.0" class="ag" text-anchor="middle" >Coding agent</text>
<text x="303.0" y="221.0" class="ag" text-anchor="middle" >makes one new try per pick</text>
<path d="M300.0 144V168" class="flow"/>
<rect x="54" y="260" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="270" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="303.0" y="287.0" class="ag" text-anchor="middle" >Fixed evaluator</text>
<text x="303.0" y="311.0" class="ag" text-anchor="middle" >scores every try</text>
<path d="M300.0 234V258" class="flow"/>
<text x="300.0" y="368" class="lb" text-anchor="middle" >many tries run in parallel</text>
<rect x="624" y="16" width="552" height="404" rx="12" class="grp"/>
<circle cx="795.5" cy="43" r="14" class="num"/>
<text x="795.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="52" class="gt" text-anchor="start" >Store the tree</text>
<rect x="654" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="107.0" class="ag" text-anchor="middle" >Discovery tree</text>
<text x="903.0" y="131.0" class="ag" text-anchor="middle" >every try + its real score</text>
<rect x="654" y="170" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="180" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="197.0" class="ag" text-anchor="middle" >Simulator pool</text>
<text x="903.0" y="221.0" class="ag" text-anchor="middle" >one more tree each round</text>
<path d="M900.0 144V168" class="flow"/>
<text x="900.0" y="316" class="lb" text-anchor="middle" >a tree replays exactly:</text>
<text x="900.0" y="342" class="lb" text-anchor="middle" >every result is already saved</text>
<rect x="624" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="856.25" cy="495" r="14" class="num"/>
<text x="856.25" y="501" class="numt" text-anchor="middle" >3</text>
<text x="876.25" y="504" class="gt" text-anchor="start" >Dream</text>
<rect x="654" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="559.0" class="ag" text-anchor="middle" >Policy-dev agent</text>
<text x="903.0" y="583.0" class="ag" text-anchor="middle" >rewrites the policy code</text>
<rect x="654" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="632" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="649.0" class="ag" text-anchor="middle" >Replay on every tree</text>
<text x="903.0" y="673.0" class="ag" text-anchor="middle" >zero executions</text>
<path d="M900.0 596V620" class="flow"/>
<rect x="654" y="712" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="722" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="739.0" class="ag" text-anchor="middle" >Scores + traces</text>
<text x="903.0" y="763.0" class="ag" text-anchor="middle" >guide the next rewrite</text>
<path d="M900.0 686V710" class="flow"/>
<text x="900.0" y="820" class="lb" text-anchor="middle" >M versions, current one included</text>
<path d="M1146 744H1162V564H1148" class="flow back"/>
<rect x="24" y="468" width="552" height="404" rx="12" class="grp"/>
<circle cx="188.75" cy="495" r="14" class="num"/>
<text x="188.75" y="501" class="numt" text-anchor="middle" >4</text>
<text x="208.75" y="504" class="gt" text-anchor="start" >Deploy the best</text>
<rect x="54" y="532" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="542" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="559.0" class="ag" text-anchor="middle" >Best replay score</text>
<text x="303.0" y="583.0" class="ag" text-anchor="middle" >wins</text>
<rect x="54" y="622" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="632" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="649.0" class="ag" text-anchor="middle" >Never worse on replay</text>
<text x="303.0" y="673.0" class="ag" text-anchor="middle" >the current policy competes</text>
<path d="M300.0 596V620" class="flow"/>
<rect x="54" y="712" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="722" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="739.0" class="ag" text-anchor="middle" >New policy</text>
<text x="303.0" y="763.0" class="ag" text-anchor="middle" >runs the next round</text>
<path d="M300.0 686V710" class="flow"/>
<path d="M576 200H622" class="flow"/>
<text x="600" y="188" class="al" text-anchor="middle" >tree</text>
<path d="M900.0 420V466" class="flow"/>
<text x="940.0" y="450" class="al" text-anchor="middle" >pool</text>
<path d="M624 668H578" class="flow"/>
<text x="600" y="656" class="al" text-anchor="middle" >versions</text>
<path d="M300.0 468V422" class="flow back"/>
<text x="370.0" y="450" class="al" text-anchor="middle" >next round</text>
</svg>
