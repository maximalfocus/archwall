<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Dream-RSI loop</title>
<desc id="d">1 Online explore: the exploration policy (code) guides a coding agent, which grows a discovery tree. 2 Each tree becomes an exact replay simulator, added to a growing pool. 3 A policy-development agent revises the policy M times in a row; each version is scored by replay over the whole pool at zero executions, and the scores and traces go into its history for the next revision. The best version, never worse than the current one, is deployed for the next round.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:21px;font-weight:700}
.st{font-size:16px;font-weight:700}
.ag{font-size:15px}
.q{font-size:14px;fill:#3d4a5c}
.lb{font-size:13px;fill:#5b6675}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:13px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="380" rx="12" class="grp"/>
<circle cx="218.5" cy="39" r="11" class="num"/>
<text x="218.5" y="44" class="numt" text-anchor="middle" >1</text>
<text x="234.5" y="46" class="gt" text-anchor="start" >Online explore</text>
<rect x="36" y="60" width="528" height="130" rx="9" class="sub"/>
<text x="300.0" y="84" class="st" text-anchor="middle" >Discovery run</text>
<rect x="54" y="104" width="180" height="60" rx="8" class="agent"/>
<rect x="54" y="114" width="5" height="40" rx="2" fill="#2f9e6e"/>
<text x="147.0" y="130.0" class="ag" text-anchor="middle" >Exploration policy</text>
<text x="147.0" y="150.0" class="ag" text-anchor="middle" >(code)</text>
<rect x="366" y="104" width="180" height="60" rx="8" class="agent"/>
<rect x="366" y="114" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="459.0" y="130.0" class="ag" text-anchor="middle" >Coding</text>
<text x="459.0" y="150.0" class="ag" text-anchor="middle" >agent</text>
<path d="M234 134H360" class="flow"/>
<text x="297" y="124" class="lb" text-anchor="middle" >guides</text>
<rect x="36" y="206" width="528" height="176" rx="9" class="sub"/>
<text x="300.0" y="230" class="st" text-anchor="middle" >Recorded</text>
<rect x="366" y="250" width="180" height="60" rx="8" class="agent"/>
<rect x="366" y="260" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="459.0" y="276.0" class="ag" text-anchor="middle" >Discovery</text>
<text x="459.0" y="296.0" class="ag" text-anchor="middle" >tree</text>
<text x="456" y="340" class="lb" text-anchor="middle" >every attempt +</text>
<text x="456" y="358" class="lb" text-anchor="middle" >its real result</text>
<path d="M456 164V244" class="flow"/>
<rect x="624" y="16" width="552" height="380" rx="12" class="grp"/>
<circle cx="776.5" cy="39" r="11" class="num"/>
<text x="776.5" y="44" class="numt" text-anchor="middle" >2</text>
<text x="792.5" y="46" class="gt" text-anchor="start" >Build replay simulator</text>
<rect x="636" y="60" width="528" height="130" rx="9" class="sub"/>
<text x="900.0" y="84" class="st" text-anchor="middle" >Each tree becomes a world</text>
<rect x="654" y="104" width="180" height="60" rx="8" class="agent"/>
<rect x="654" y="114" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="747.0" y="130.0" class="ag" text-anchor="middle" >Discovery</text>
