<circle cx="195.5" cy="43" r="14" class="num"/>
<text x="195.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="215.5" y="52" class="gt" text-anchor="start" >Online explore</text>
<rect x="36" y="60" width="528" height="130" rx="9" class="sub"/>
<text x="300.0" y="88" class="st" text-anchor="middle" >Discovery run</text>
<rect x="54" y="104" width="200" height="64" rx="8" class="agent"/>
<rect x="54" y="114" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="157.0" y="131.0" class="ag" text-anchor="middle" >Exploration policy</text>
<text x="157.0" y="155.0" class="ag" text-anchor="middle" >(code)</text>
<rect x="346" y="104" width="200" height="64" rx="8" class="agent"/>
<rect x="346" y="114" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="449.0" y="131.0" class="ag" text-anchor="middle" >Coding</text>
<text x="449.0" y="155.0" class="ag" text-anchor="middle" >agent</text>
<path d="M254 136H340" class="flow"/>
<text x="300.0" y="126" class="al" text-anchor="middle" >guides</text>
<rect x="36" y="206" width="528" height="176" rx="9" class="sub"/>
<text x="300.0" y="234" class="st" text-anchor="middle" >Recorded</text>
<rect x="346" y="250" width="200" height="64" rx="8" class="agent"/>
<rect x="346" y="260" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="449.0" y="277.0" class="ag" text-anchor="middle" >Discovery</text>
<text x="449.0" y="301.0" class="ag" text-anchor="middle" >tree</text>
<text x="446.0" y="342" class="lb" text-anchor="middle" >every attempt +</text>
<text x="446.0" y="364" class="lb" text-anchor="middle" >its real result</text>
<path d="M446.0 168V244" class="flow"/>
<rect x="624" y="16" width="552" height="380" rx="12" class="grp"/>
