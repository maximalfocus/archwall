<rect x="654" y="250" width="152" height="64" rx="8" class="agent"/>
<rect x="654" y="260" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="733.0" y="289.0" class="ag" text-anchor="middle" >Tree 1</text>
<rect x="824" y="250" width="152" height="64" rx="8" class="agent"/>
<rect x="824" y="260" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="289.0" class="ag" text-anchor="middle" >Tree 2</text>
<rect x="994" y="250" width="152" height="64" rx="8" class="agent"/>
<rect x="994" y="260" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="1073.0" y="289.0" class="ag" text-anchor="middle" >… Tree t</text>
<text x="900.0" y="352" class="lb" text-anchor="middle" >one more world every round</text>
<path d="M1046.0 168V244" class="flow"/>
<path d="M546 282H600V136H648" class="flow"/>
<text x="600" y="230" class="al" text-anchor="middle" >store</text>
<rect x="24" y="436" width="1152" height="380" rx="12" class="grp"/>
<circle cx="448.25" cy="463" r="14" class="num"/>
<text x="448.25" y="469" class="numt" text-anchor="middle" >3</text>
<text x="468.25" y="472" class="gt" text-anchor="start" >Dream a better policy</text>
<rect x="36" y="480" width="740" height="324" rx="9" class="sub"/>
<text x="406.0" y="508" class="st" text-anchor="middle" >Inner loop · zero executions</text>
<rect x="72" y="536" width="200" height="64" rx="8" class="agent"/>
<rect x="72" y="546" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="175.0" y="563.0" class="ag" text-anchor="middle" >Policy-dev</text>
<text x="175.0" y="587.0" class="ag" text-anchor="middle" >agent</text>
<rect x="524" y="536" width="200" height="64" rx="8" class="agent"/>
<rect x="524" y="546" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="627.0" y="563.0" class="ag" text-anchor="middle" >Revised policy</text>
<text x="627.0" y="587.0" class="ag" text-anchor="middle" >πᵐ⁺¹</text>
<rect x="524" y="676" width="200" height="64" rx="8" class="agent"/>
<rect x="524" y="686" width="5" height="44" rx="2" fill="#e8973a"/>
