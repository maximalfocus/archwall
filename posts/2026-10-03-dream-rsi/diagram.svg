<rect x="966" y="114" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="1059.0" y="130.0" class="ag" text-anchor="middle" >Replay</text>
<text x="1059.0" y="150.0" class="ag" text-anchor="middle" >simulator</text>
<path d="M834 134H960" class="flow"/>
<text x="897" y="124" class="lb" text-anchor="middle" >exact</text>
<rect x="636" y="206" width="528" height="176" rx="9" class="sub"/>
<text x="900.0" y="230" class="st" text-anchor="middle" >Simulator pool</text>
<rect x="654" y="250" width="152" height="60" rx="8" class="agent"/>
<rect x="654" y="260" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="733.0" y="286.0" class="ag" text-anchor="middle" >Tree 1</text>
<rect x="824" y="250" width="152" height="60" rx="8" class="agent"/>
<rect x="824" y="260" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="903.0" y="286.0" class="ag" text-anchor="middle" >Tree 2</text>
<rect x="994" y="250" width="152" height="60" rx="8" class="agent"/>
<rect x="994" y="260" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="1073.0" y="286.0" class="ag" text-anchor="middle" >… Tree t</text>
<text x="900.0" y="349" class="lb" text-anchor="middle" >one more world every round</text>
<path d="M1056 164V244" class="flow"/>
<path d="M546 280H600V134H648" class="flow"/>
<text x="600" y="300" class="lb" text-anchor="middle" >store</text>
<rect x="24" y="436" width="1152" height="380" rx="12" class="grp"/>
<circle cx="481.75" cy="459" r="11" class="num"/>
<text x="481.75" y="464" class="numt" text-anchor="middle" >3</text>
<text x="497.75" y="466" class="gt" text-anchor="start" >Dream a better policy</text>
<rect x="36" y="480" width="740" height="324" rx="9" class="sub"/>
<text x="406.0" y="504" class="st" text-anchor="middle" >Inner loop · zero executions</text>
<rect x="72" y="536" width="200" height="64" rx="8" class="agent"/>
<rect x="72" y="546" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="175.0" y="564.0" class="ag" text-anchor="middle" >Policy-dev</text>
<text x="175.0" y="584.0" class="ag" text-anchor="middle" >agent</text>
<rect x="524" y="536" width="200" height="64" rx="8" class="agent"/>
<rect x="524" y="546" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="627.0" y="564.0" class="ag" text-anchor="middle" >Revised policy</text>
<text x="627.0" y="584.0" class="ag" text-anchor="middle" >πᵐ⁺¹</text>
<rect x="524" y="676" width="200" height="64" rx="8" class="agent"/>
<rect x="524" y="686" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="627.0" y="704.0" class="ag" text-anchor="middle" >Replay over</text>
<text x="627.0" y="724.0" class="ag" text-anchor="middle" >the whole pool</text>
<rect x="72" y="676" width="200" height="64" rx="8" class="agent"/>
<rect x="72" y="686" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="175.0" y="704.0" class="ag" text-anchor="middle" >History H</text>
<text x="175.0" y="724.0" class="ag" text-anchor="middle" >scores + traces</text>
<path d="M272 568H518" class="flow"/>
<text x="395" y="558" class="lb" text-anchor="middle" >revise</text>
<path d="M624 600V670" class="flow"/>
<path d="M524 708H278" class="flow"/>
<text x="401" y="698" class="lb" text-anchor="middle" >store</text>
<path d="M172 676V606" class="flow"/>
<text x="184" y="646" class="lb" text-anchor="start" >next revision</text>
<path d="M776 632H862" class="flow"/>
<text x="1008" y="560" class="lb" text-anchor="middle" >after M revisions,</text>
<text x="1008" y="578" class="lb" text-anchor="middle" >pick the best</text>
<rect x="868" y="592" width="280" height="80" rx="8" class="agent"/>
<rect x="868" y="602" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="1011.0" y="628.0" class="ag" text-anchor="middle" >Best policy</text>
<text x="1011.0" y="648.0" class="ag" text-anchor="middle" >never worse</text>
