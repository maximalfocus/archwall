<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 430" width="1540" height="430" role="img" aria-labelledby="t d">
<title id="t">Dream-RSI loop</title>
<desc id="d">1 Online explore: the exploration policy guides a coding agent, which grows a discovery tree. 2 Each tree becomes an exact replay simulator, added to a growing pool. 3 A policy-development agent revises the policy M times in a row; each version is scored by replay over the whole pool at zero executions, and the scores and traces go into its history for the next revision. The best policy, never worse than the current one, is deployed for the next round.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:21px;font-weight:700}
.st{font-size:16px;font-weight:700}
.ag{font-size:15px}
.q{font-size:14px;fill:#3d4a5c}
.lb{font-size:13px;fill:#5b6675}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:13px;font-weight:700;fill:#ffffff}
</style>
<rect width="1540" height="430" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="472" height="330" rx="12" class="grp"/>
<circle cx="178.5" cy="39" r="11" class="num"/>
<text x="178.5" y="44" class="numt" text-anchor="middle" >1</text>
<text x="194.5" y="46" class="gt" text-anchor="start" >Online explore</text>
<rect x="36" y="56" width="448" height="120" rx="9" class="sub"/>
<text x="260.0" y="80" class="st" text-anchor="middle" >Discovery run</text>
<rect x="52" y="96" width="164" height="60" rx="8" class="agent"/>
<rect x="52" y="106" width="5" height="40" rx="2" fill="#2f9e6e"/>
<text x="137.0" y="122.0" class="ag" text-anchor="middle" >Exploration policy</text>
<text x="137.0" y="142.0" class="ag" text-anchor="middle" >(code)</text>
<rect x="304" y="96" width="164" height="60" rx="8" class="agent"/>
<rect x="304" y="106" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="389.0" y="122.0" class="ag" text-anchor="middle" >Coding</text>
<text x="389.0" y="142.0" class="ag" text-anchor="middle" >agent</text>
<path d="M216 126H298" class="flow"/>
<text x="257" y="116" class="lb" text-anchor="middle" >guides</text>
<rect x="36" y="192" width="448" height="140" rx="9" class="sub"/>
<text x="260.0" y="216" class="st" text-anchor="middle" >Recorded</text>
<rect x="304" y="226" width="164" height="60" rx="8" class="agent"/>
<rect x="304" y="236" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="389.0" y="252.0" class="ag" text-anchor="middle" >Discovery</text>
<text x="389.0" y="272.0" class="ag" text-anchor="middle" >tree</text>
<text x="386" y="310" class="lb" text-anchor="middle" >every attempt + its real result</text>
<path d="M386 156V220" class="flow"/>
<rect x="534" y="16" width="472" height="330" rx="12" class="grp"/>
<circle cx="646.5" cy="39" r="11" class="num"/>
<text x="646.5" y="44" class="numt" text-anchor="middle" >2</text>
<text x="662.5" y="46" class="gt" text-anchor="start" >Build replay simulator</text>
<rect x="546" y="56" width="448" height="120" rx="9" class="sub"/>
<text x="770.0" y="80" class="st" text-anchor="middle" >Each tree becomes a world</text>
<rect x="562" y="96" width="164" height="60" rx="8" class="agent"/>
<rect x="562" y="106" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="647.0" y="122.0" class="ag" text-anchor="middle" >Discovery</text>
<text x="647.0" y="142.0" class="ag" text-anchor="middle" >tree</text>
<rect x="814" y="96" width="164" height="60" rx="8" class="agent"/>
<rect x="814" y="106" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="899.0" y="122.0" class="ag" text-anchor="middle" >Replay</text>
<text x="899.0" y="142.0" class="ag" text-anchor="middle" >simulator</text>
<path d="M726 126H808" class="flow"/>
<text x="767" y="116" class="lb" text-anchor="middle" >exact</text>
<rect x="546" y="192" width="448" height="140" rx="9" class="sub"/>
<text x="770.0" y="216" class="st" text-anchor="middle" >Simulator pool</text>
<rect x="562" y="226" width="128" height="60" rx="8" class="agent"/>
<rect x="562" y="236" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="629.0" y="262.0" class="ag" text-anchor="middle" >Tree 1</text>
<rect x="702" y="226" width="128" height="60" rx="8" class="agent"/>
<rect x="702" y="236" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="769.0" y="262.0" class="ag" text-anchor="middle" >Tree 2</text>
<rect x="842" y="226" width="128" height="60" rx="8" class="agent"/>
<rect x="842" y="236" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="909.0" y="262.0" class="ag" text-anchor="middle" >… Tree t</text>
<text x="770.0" y="310" class="lb" text-anchor="middle" >one more world every round</text>
<path d="M896 156V220" class="flow"/>
<path d="M484 256H515V126H556" class="flow"/>
<text x="515" y="286" class="lb" text-anchor="middle" >store</text>
<rect x="1044" y="16" width="472" height="330" rx="12" class="grp"/>
<circle cx="1161.75" cy="39" r="11" class="num"/>
<text x="1161.75" y="44" class="numt" text-anchor="middle" >3</text>
<text x="1177.75" y="46" class="gt" text-anchor="start" >Dream a better policy</text>
<rect x="1056" y="56" width="448" height="180" rx="9" class="sub"/>
<text x="1280.0" y="80" class="st" text-anchor="middle" >Inner loop · zero executions</text>
<rect x="1072" y="92" width="164" height="60" rx="8" class="agent"/>
<rect x="1072" y="102" width="5" height="40" rx="2" fill="#2f9e6e"/>
<text x="1157.0" y="118.0" class="ag" text-anchor="middle" >Policy-dev</text>
<text x="1157.0" y="138.0" class="ag" text-anchor="middle" >agent</text>
<rect x="1324" y="92" width="164" height="60" rx="8" class="agent"/>
<rect x="1324" y="102" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="1409.0" y="118.0" class="ag" text-anchor="middle" >Revised policy</text>
<text x="1409.0" y="138.0" class="ag" text-anchor="middle" >πᵐ⁺¹</text>
<rect x="1324" y="166" width="164" height="60" rx="8" class="agent"/>
<rect x="1324" y="176" width="5" height="40" rx="2" fill="#e8973a"/>
<text x="1409.0" y="192.0" class="ag" text-anchor="middle" >Replay over</text>
<text x="1409.0" y="212.0" class="ag" text-anchor="middle" >the whole pool</text>
<rect x="1072" y="166" width="164" height="60" rx="8" class="agent"/>
<rect x="1072" y="176" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="1157.0" y="192.0" class="ag" text-anchor="middle" >History H</text>
<text x="1157.0" y="212.0" class="ag" text-anchor="middle" >scores + traces</text>
<path d="M1236 122H1318" class="flow"/>
<text x="1277" y="112" class="lb" text-anchor="middle" >revise</text>
<path d="M1406 152V160" class="flow"/>
<path d="M1324 196H1242" class="flow"/>
<text x="1283" y="186" class="lb" text-anchor="middle" >store</text>
<path d="M1154 166V158" class="flow"/>
<text x="1166" y="162" class="lb" text-anchor="start" >next revision</text>
<path d="M1280 236V256" class="flow"/>
<text x="1294" y="252" class="lb" text-anchor="start" >after M revisions, pick the best</text>
<rect x="1120" y="262" width="320" height="56" rx="8" class="agent"/>
<rect x="1120" y="272" width="5" height="36" rx="2" fill="#2f9e6e"/>
<text x="1283.0" y="286.0" class="ag" text-anchor="middle" >Best policy, never worse</text>
<text x="1283.0" y="306.0" class="ag" text-anchor="middle" >(the current one is a candidate too)</text>
<path d="M994 262H1025V206H1050" class="flow"/>
<text x="1025" y="286" class="lb" text-anchor="middle" >replay</text>
<path d="M1280 318V390H134V162" class="flow back"/>
<text x="654.0" y="412" class="lb" text-anchor="middle" >deploy the best policy → next round explores further</text>
</svg>
