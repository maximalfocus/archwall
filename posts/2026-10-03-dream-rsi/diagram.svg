<text x="627.0" y="727.0" class="ag" text-anchor="middle" >the whole pool</text>
<rect x="72" y="676" width="200" height="64" rx="8" class="agent"/>
<rect x="72" y="686" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="175.0" y="703.0" class="ag" text-anchor="middle" >History H</text>
<text x="175.0" y="727.0" class="ag" text-anchor="middle" >scores + traces</text>
