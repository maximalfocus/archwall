<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Dream-RSI discovery tree</title>
<desc id="d">1 One node is one try: the saved workspace after the try, the program and proposal the agent wrote, and the evaluator's score and diagnostics; each try starts from its parent's workspace. 2 How a tree grows: the root is the starting workspace; branches hang off the root, and each branch is a chain of tries. Only the root and the leaves can be picked. 3 What a pick does: picking the root opens a new branch, picking a leaf adds the next step on that branch, a refine or a repair; up to W picks run per round, one per worker; recorded nodes never change. 4 The pool: every finished tree joins the pool, one per round; the next run reads it as context but grows a new tree.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
