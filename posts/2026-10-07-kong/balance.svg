<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Picking a backend</title>
<desc id="d">In: a call has matched a route, so Kong knows its service. 1 Where it goes: the service names a host. If that host is the name of an upstream, Kong balances the call across the upstream's targets, each an address and port with a weight, 100 by default; otherwise it goes to that one host. 2 Algorithm: round-robin by default, or consistent-hashing on the consumer, IP, a header, a cookie, the path, a query argument or a URI capture, or least-connections, or latency. 3 Health checks: active probing sends test requests to targets; it is off by default. Passive checks watch real responses as a circuit breaker; also off by default. Unhealthy targets get no calls. 4 Retries and timeouts: on a failure Kong reports it to the health checker and tries again, up to the service's retries, 5 by default; connect, write and read timeouts are 60 seconds by default.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: the call matched a route and its service</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="202.25" cy="111" r="14" class="num"/>
<text x="202.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="222.25" y="120" class="gt" text-anchor="start" >Where it goes</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Service</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >names a host</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Upstream</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >a pool, if the host is its name</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Targets</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >address:port · weight 100 default</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Not an upstream → that one host</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="829.25" cy="111" r="14" class="num"/>
<text x="829.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="849.25" y="120" class="gt" text-anchor="start" >Algorithm</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Round-robin</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >the default</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Consistent hashing</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >consumer · IP · header · cookie …</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Least connections</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >or latency</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="802.25" cy="527" r="14" class="num"/>
<text x="802.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="822.25" y="536" class="gt" text-anchor="start" >Health checks</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Active probes</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >test requests · off by default</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Passive checks</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >circuit breaker · off by default</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Unhealthy targets get no calls</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="155.0" cy="527" r="14" class="num"/>
<text x="155.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="175.0" y="536" class="gt" text-anchor="start" >Retries and timeouts</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Try again on failure</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >up to 5 retries by default</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Timeouts</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >connect · write · read 60 s</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Failure reported</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >to the health checker</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >pool</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >target</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >call sent</text>
</svg>
