<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Kong in front of LLMs</title>
<desc id="d">In: an app sends a chat call to a Kong route. 1 The app calls a route: a chat call (llm/v1/chat), a completions call (llm/v1/completions), or preserve, which is passed on without translation. 2 Shape the request, in priority order: AI Request Transformer asks an LLM to rewrite the body, AI Prompt Template fills a named template's placeholders, AI Prompt Decorator adds chat messages before or after, and AI Prompt Guard checks allow and deny patterns. 3 AI Proxy translates the call into the provider's format, adds the provider key as a header or parameter, and sends it to one of 9 providers: OpenAI, Azure, Anthropic, Cohere, Mistral, Llama 2, Gemini, Bedrock and Hugging Face. 4 Answer back: the reply is translated back into the same call shape, AI Response Transformer can ask an LLM to rewrite it, and token statistics go to the log plugins only when log_statistics is on; prompts and replies are logged only when log_payloads is on. Both are off by default.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: an app sends a chat call to a Kong route</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="148.25" cy="111" r="14" class="num"/>
<text x="148.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="168.25" y="120" class="gt" text-anchor="start" >The app calls a route</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Chat call</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >llm/v1/chat</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Completions call</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >llm/v1/completions</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Preserve</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >passed on as is</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Same call shape for every provider</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="775.25" cy="111" r="14" class="num"/>
<text x="775.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="795.25" y="120" class="gt" text-anchor="start" >Shape the request</text>
<rect x="654" y="144" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="154" width="5" height="40" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="169.0" class="ag" text-anchor="middle" >AI Request Transformer</text>
<text x="903.0" y="193.0" class="ag" text-anchor="middle" >an LLM rewrites the body</text>
<rect x="654" y="218" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="228" width="5" height="40" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="243.0" class="ag" text-anchor="middle" >AI Prompt Template</text>
<text x="903.0" y="267.0" class="ag" text-anchor="middle" >fills {{placeholders}}</text>
<rect x="654" y="292" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="302" width="5" height="40" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="317.0" class="ag" text-anchor="middle" >AI Prompt Decorator</text>
<text x="903.0" y="341.0" class="ag" text-anchor="middle" >adds messages before · after</text>
<rect x="654" y="366" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="376" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="391.0" class="ag" text-anchor="middle" >AI Prompt Guard</text>
<text x="903.0" y="415.0" class="ag" text-anchor="middle" >allow · deny patterns</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="836.0" cy="527" r="14" class="num"/>
<text x="836.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="856.0" y="536" class="gt" text-anchor="start" >AI Proxy</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Translate</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >into the provider's format</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Add the provider key</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >header or parameter</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >9 providers</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >OpenAI · Anthropic · Gemini …</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="215.75" cy="527" r="14" class="num"/>
<text x="215.75" y="533" class="numt" text-anchor="middle" >4</text>
<text x="235.75" y="536" class="gt" text-anchor="start" >Answer back</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Translate back</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >into the same call shape</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >AI Response Transformer</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >an LLM rewrites the reply</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Token statistics</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >to the log plugins</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Statistics · payload logs: off by default</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >call</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >prompt</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >reply</text>
</svg>
