<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">One call through Kong</title>
<desc id="d">In: an app sends an HTTP call to Kong. 1 Arrive: the proxy listens on port 8000 for HTTP and 8443 for HTTPS; for HTTPS Kong picks the TLS certificate by the server name (SNI); global plugins run their rewrite step before routing. TCP and UDP ports are off by default. 2 Match a route: the router checks host, path, method and more, finds the Route and the Service behind it; with no match Kong answers 404, no Route matched. 3 Run plugins: the access step runs the plugins for this route, service or consumer, such as auth, limits and transforms; a plugin may answer early and stop the call. 4 Proxy and return: the balancer picks a target, the upstream answers, response plugins change headers and body, and log plugins run after the reply.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: an app sends an HTTP call</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="249.5" cy="111" r="14" class="num"/>
<text x="249.5" y="117" class="numt" text-anchor="middle" >1</text>
<text x="269.5" y="120" class="gt" text-anchor="start" >Arrive</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Proxy port</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >8000 http · 8443 https</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >TLS certificate</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >picked by server name (SNI)</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Global plugins</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >rewrite step · before routing</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >TCP and UDP ports: off by default</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="802.25" cy="111" r="14" class="num"/>
<text x="802.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="822.25" y="120" class="gt" text-anchor="start" >Match a route</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Router</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >host · path · method …</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Route → Service</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >which backend to call</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >No match</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >404 · no Route matched</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="815.75" cy="527" r="14" class="num"/>
<text x="815.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="835.75" y="536" class="gt" text-anchor="start" >Run plugins</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Auth</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >key-auth · jwt · oauth2 …</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Limits</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >rate-limiting · ip-restriction …</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Transforms</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >request-transformer …</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >A plugin may answer early and stop</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="182.0" cy="527" r="14" class="num"/>
<text x="182.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="202.0" y="536" class="gt" text-anchor="start" >Proxy and return</text>
<rect x="54" y="560" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="570" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="585.0" class="ag" text-anchor="middle" >Balancer</text>
<text x="303.0" y="609.0" class="ag" text-anchor="middle" >picks a target</text>
<rect x="54" y="634" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="644" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="659.0" class="ag" text-anchor="middle" >Upstream answers</text>
<text x="303.0" y="683.0" class="ag" text-anchor="middle" >the reply comes back</text>
<rect x="54" y="708" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="718" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="733.0" class="ag" text-anchor="middle" >Response plugins</text>
<text x="303.0" y="757.0" class="ag" text-anchor="middle" >change headers · body</text>
<rect x="54" y="782" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="792" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="303.0" y="807.0" class="ag" text-anchor="middle" >Log plugins</text>
<text x="303.0" y="831.0" class="ag" text-anchor="middle" >run after the reply</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >request</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >matched</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >allowed</text>
</svg>
