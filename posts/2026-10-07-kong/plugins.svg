<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">What the bundled plugins do</title>
<desc id="d">In: a call that matched a route. Kong bundles 45 plugins; within each phase, the higher priority runs first. The 6 AI plugins have their own figure. 1 Who is calling, 9 plugins: keys and tokens (key-auth, jwt, oauth2), passwords and signatures (basic-auth, ldap-auth, hmac-auth, standard-webhooks), sessions and groups (session, acl). 2 Guard traffic, 9 plugins: limits (rate-limiting, response-ratelimiting, request-size-limiting), who may come in (ip-restriction, bot-detection, cors), and cache, stop or certificates (proxy-cache, request-termination, acme). 3 Change or forward, 9 plugins: rewrite the call (request-transformer, response-transformer, redirect), other backends (aws-lambda, azure-functions, grpc-gateway, grpc-web), and your own code (pre-function runs first, post-function last). 4 Watch and log, 12 plugins: metrics (prometheus, statsd, datadog), traces (opentelemetry, zipkin, correlation-id) and logs (http-log, file-log, tcp-log, udp-log, syslog, loggly). Most of them run in the log phase, after the reply.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
