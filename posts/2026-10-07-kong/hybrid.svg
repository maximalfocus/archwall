<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: an admin changes the config</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="202.25" cy="111" r="14" class="num"/>
<text x="202.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="222.25" y="120" class="gt" text-anchor="start" >Control plane</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Admin API</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >required here</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Postgres</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >a database is required</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Cluster port 8005</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >data planes connect here</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Setting: role = control_plane</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="768.5" cy="111" r="14" class="num"/>
<text x="768.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="788.5" y="120" class="gt" text-anchor="start" >Package the config</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Export the whole config</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >with a hash</text>
