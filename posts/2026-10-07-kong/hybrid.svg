<rect x="654" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Fit each data plane</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >same major · minor not newer</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Compress with gzip</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >up to 16 MB by default</text>
<rect x="24" y="500" width="1152" height="364" rx="12" class="grp"/>
<circle cx="380.75" cy="527" r="14" class="num"/>
<text x="380.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="400.75" y="536" class="gt" text-anchor="start" >Data planes, as many as you run</text>
<rect x="102" y="620" width="440" height="84" rx="8" class="agent"/>
<rect x="90" y="608" width="440" height="84" rx="8" class="agent"/>
<rect x="78" y="596" width="440" height="84" rx="8" class="agent"/>
<rect x="78" y="606" width="5" height="64" rx="2" fill="#2f6fd6"/>
<text x="301.0" y="633.0" class="ag" text-anchor="middle" >Data plane</text>
<text x="301.0" y="657.0" class="ag" text-anchor="middle" >role = data_plane</text>
<text x="324" y="812" class="lb" text-anchor="middle" >No cached config yet:</text>
<text x="324" y="838" class="lb" text-anchor="middle" >start from a config file</text>
<rect x="654" y="560" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="570" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="585.0" class="ag" text-anchor="middle" >Secure link</text>
<text x="903.0" y="609.0" class="ag" text-anchor="middle" >WebSocket · mutual TLS (shared or pki)</text>
<rect x="654" y="634" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="644" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="903.0" y="659.0" class="ag" text-anchor="middle" >No database</text>
<text x="903.0" y="683.0" class="ag" text-anchor="middle" >database = off · config in LMDB</text>
<rect x="654" y="708" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="718" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="733.0" class="ag" text-anchor="middle" >Proxy calls</text>
<text x="903.0" y="757.0" class="ag" text-anchor="middle" >ports 8000 · 8443</text>
<rect x="654" y="782" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="792" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="903.0" y="807.0" class="ag" text-anchor="middle" >Ping every 30 s</text>
<text x="903.0" y="831.0" class="ag" text-anchor="middle" >sends its config hash</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >on change</text>
<path d="M900 464V482H324V594" class="flow"/>
<text x="744" y="488" class="al" text-anchor="middle" >push to each</text>
</svg>
