<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Which plugin runs, and in what order</title>
<desc id="d">In: a plugin, bundled or your own. 1 Write or pick: 45 plugins come bundled, for auth, limits, logs and more; you can write your own in Lua with the Plugin Development Kit, or in Go or JavaScript through plugin servers set with the pluginserver_names setting. Wasm filters need the setting wasm = on, which is off by default. 2 Load: the plugins setting, bundled by default, only loads the code; a plugin entity turns it on; Kong will not start if a configured plugin is not loaded. 3 Scope: a plugin can be set globally or for a route, a service, a consumer or a mix of them; for each call the most specific of 8 levels wins, route plus service plus consumer first and global last. 4 Order: plugins run by PRIORITY, higher first, in each phase from rewrite and access to header_filter, body_filter and log; for example correlation-id 100001, key-auth 1250, rate-limiting 910 and syslog 4. pre-function runs Lua snippets near the start and post-function near the end.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a plugin, bundled or your own</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="202.25" cy="111" r="14" class="num"/>
<text x="202.25" y="117" class="numt" text-anchor="middle" >1</text>
<text x="222.25" y="120" class="gt" text-anchor="start" >Write or pick</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >45 bundled plugins</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >auth · limits · logs …</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Your own in Lua</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >with the Plugin Development Kit</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Go or JavaScript</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >config: pluginserver_names</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Wasm filters: config wasm = on (default off)</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="863.0" cy="111" r="14" class="num"/>
<text x="863.0" y="117" class="numt" text-anchor="middle" >2</text>
<text x="883.0" y="120" class="gt" text-anchor="start" >Load</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >plugins = bundled</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >config: loads the code only</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Plugin entity</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >turns it on · Admin API or file</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Configured but not loaded</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >Kong will not start</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="856.25" cy="527" r="14" class="num"/>
<text x="856.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="876.25" y="536" class="gt" text-anchor="start" >Scope</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Route + service + consumer</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >the most specific wins</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >8 levels</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >route · service · consumer · mixes</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Global</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >used when nothing closer is set</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="256.25" cy="527" r="14" class="num"/>
<text x="256.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="276.25" y="536" class="gt" text-anchor="start" >Order</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Higher PRIORITY first</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >correlation-id 100001</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >key-auth 1250</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >before rate-limiting 910</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Each phase in turn</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >rewrite · access · … · log</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >pre-function runs early · post-function late</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >code</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >enabled</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >chosen</text>
</svg>
