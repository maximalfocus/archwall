<rect x="920" y="724" width="226" height="64" rx="8" class="agent"/>
<rect x="920" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="1036.0" y="751.0" class="ag" text-anchor="middle" >POST /config</text>
<text x="1036.0" y="775.0" class="ag" text-anchor="middle" >replaces it all</text>
<text x="900" y="602" class="lb" text-anchor="middle" >or</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Pick one: the database setting</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >DB-less: no edits to single entities</text>
