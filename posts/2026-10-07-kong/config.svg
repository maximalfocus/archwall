<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Where the config lives</title>
<desc id="d">In: an admin changes routes, plugins or upstreams. 1 Change it: the Admin API listens on 127.0.0.1 port 8001, or 8444 with TLS, and should stay with admins; Kong Manager is a web UI on port 8002; a declarative config file is used with no database. 2 What it describes: services and routes say where calls go, consumers and plugins say who calls and what runs, upstreams and targets list backend addresses; also certificates, SNIs, vaults and keys. 3 Store it, one of two options picked with the database setting: Postgres, the default, where the Admin API edits each entity; or DB-less, database = off, where the config file is loaded into LMDB, the Admin API cannot create, update or delete single entities, and POST /config replaces the whole config. 4 Spread to workers: each node keeps two memory caches of 128 MB each, nodes on Postgres poll for changes every 5 seconds, and every 5 seconds each worker rebuilds its router and plugin list if needed.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
