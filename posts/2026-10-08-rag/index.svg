<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Building the index</title>
<desc id="d">In: raw files such as PDF, HTML, Word and Markdown, cleaned into plain text. 1 Gather the sources: unstructured text, such as Wikipedia dumps or domain data like medical or legal text; PDFs that mix text and tables, handled with Text-2-SQL on the tables or by turning the tables into text; knowledge graphs, which are checked and more precise but take work to build and maintain; and content the LLM writes itself. 2 Pick the unit size: in text, from fine to coarse, token, phrase, sentence, proposition, chunk and document; in a knowledge graph, entity, triplet and sub-graph. Coarse units carry more information but also more noise; fine units mean more retrieval work and may lose the meaning. 3 Split into chunks: most often a fixed number of tokens, for example 100, 256 or 512; or recursive splits and a sliding window; or Small2Big, which searches on a sentence and hands the LLM the sentences before and after it. Bigger chunks hold more context but more noise, and splitting a PDF can break its tables. 4 Add metadata: page number, file name, author, category and timestamp from the file, which the search can filter on; plus made-up metadata, such as paragraph summaries and hypothetical questions an LLM writes that the text can answer, known as Reverse HyDE. 5 Add structure: a hierarchical index, with files in parent-child order, chunks linked to them and a summary at each node to help pick chunks; or a knowledge graph index that links concepts and entities, which KGP builds across many documents. 6 Embed and store: an embedding model turns each chunk into a vector, and a vector database stores it. How well the index is built decides whether retrieval finds the right context.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
