<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Building the index</title>
<desc id="d">Naive RAG builds the index in three steps, in order. The rest is optional. 1 Clean the files: raw files such as PDF, HTML, Word and Markdown, or text such as Wikipedia dumps and medical or legal data, cleaned into plain text. 2 Split into chunks: most often a fixed number of tokens, for example 100, 256 or 512; or recursive splits and a sliding window; or Small2Big, which searches on a sentence and hands the LLM the sentences before and after it. The unit can be anything from a token, phrase, sentence or proposition up to a chunk or a whole document. Bigger units hold more context but more noise; smaller ones mean more retrieval work and may lose the meaning. Splitting a PDF can break its tables. 3 Embed and store: an embedding model turns each chunk into a vector, and a vector database stores it. How well the index is built decides whether retrieval finds the right context. Optional, other sources: tables in PDFs can be turned into text, or kept in a database and queried with Text-2-SQL when a question comes in; knowledge graphs, searched by entity, triplet or sub-graph, which are checked and more precise but take work to build and maintain; and content the LLM writes itself. Optional, add metadata, which Advanced RAG uses: page number, file name, author, category and timestamp from the file, which the search can filter on; plus made-up metadata, such as paragraph summaries and hypothetical questions an LLM writes that the text can answer, known as Reverse HyDE. Optional, add structure: a hierarchical index, with files in parent-child order, chunks linked to them and a summary at each node to help pick chunks; or a knowledge graph index that links concepts and entities, which KGP builds across many documents.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
