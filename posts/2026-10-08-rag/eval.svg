<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Checking a RAG system</title>
<desc id="d">In: a RAG system to check, on two targets, retrieval and generation, either by hand or automatically. What it is tested on: question answering is the core task, single-hop, multi-hop and long-form, plus domain questions and multiple choice; other tasks include information extraction, dialogue and code search. The survey counts 26 tasks and nearly 50 datasets. Benchmarks and tools check both targets: the benchmarks RGB, RECALL and CRUD test the four abilities; the tools RAGAS, ARES and TruLens use an LLM to grade the three quality scores. Classic metrics such as EM, F1, BLEU and ROUGE are traditional and not yet a standard for RAG. Retrieval quality: search metrics Hit Rate, MRR and NDCG; the score context relevance, meaning the retrieved text is on point with no extras; and the ability noise robustness, meaning the system copes with documents that are related to the question but hold nothing useful. Generation quality: without labels, the answer should be faithful, relevant and not harmful; with labels, it should be accurate. The scores answer faithfulness and answer relevance. Three abilities: negative rejection, saying no when the documents lack the answer; information integration, combining several documents; and counterfactual robustness, ignoring known false facts in the documents.</desc>
