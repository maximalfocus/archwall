<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">From chunks to answer</title>
<desc id="d">In: the question and its top K retrieved chunks. Feeding them all straight to the LLM is not a good idea: too much context adds noise, and in long text LLMs focus on the start and the end and lose the middle. 1 Rerank: put the most relevant chunks first, with rules (diversity, relevance, MRR) or with models (the BERT family, Cohere rerank, bge-reranker-large, or a general LLM like GPT), and move the best chunks to the edges of the prompt. 2 Select and compress: LLMLingua uses a small language model, GPT-2 Small or LLaMA-7B, to drop unimportant tokens; PRCA and RECOMP train a compressor; fewer documents also help: in Filter-Reranker small models filter and the LLM reorders, or the LLM critiques the retrieved documents and drops weak ones, as in Chatlaw. 3 Build the prompt and answer: the question and the kept chunks go into one prompt, plus the chat history in a multi-turn chat; the LLM answers from its own knowledge or only from the documents, depending on the task. Beside this, you can also adjust the LLM itself by fine-tuning it: add domain knowledge it lacks, set the format and style of its answers, align it with human or retriever preferences through reinforcement learning, or distill a stronger model such as GPT-4. RA-DIT tunes the LLM and the retriever together. It is a big plus of on-premise LLMs.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
