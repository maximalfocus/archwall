title_zh = "RAG：先查资料，再让大模型回答"
title_en = "RAG: look it up first, then let the LLM answer"
date = "2026-10-08"
tags = ["rag", "llm", "retrieval", "vector-database", "embeddings"]
figure = "diagram.svg"
alt_zh = "RAG 总览：输入是你的文档和用户的问题。1 建索引，提前做好：把原始文件（PDF、HTML、Word、Markdown）清理成纯文本，切成文本块，用嵌入模型把每块变成向量，存进向量数据库。2 检索，每个问题做一次：高级 RAG 先改写或扩展问题；用同一个嵌入模型把问题变成向量，取出最相似的前 K 个文本块。3 整理文本块，这一步是高级 RAG 加的：重新排序，把最相关的放前面，再压缩，免得大模型被噪声淹没。4 生成：问题、选出的文本块和聊天记录放进同一个提示词，大模型据此写出答案。朴素 RAG 只有第 1、2、4 步。"
source = "https://arxiv.org/abs/2312.10997v5"

[[figures]]
file = "paradigms.svg"
alt_zh = "三种做 RAG 的方式并排放着，每一种都是从前一种长出来的。朴素 RAG 是最早的一种：先给文档建索引，再找出最相近的前 K 个文本块，最后让 LLM 生成答案，也叫\"检索-阅读\"。它的短板有三个。一是检索不准，挑错了块或漏掉关键信息。二是幻觉，答案里有文本块撑不住的内容。三是冗余，几个来源给了同样的信息，答案就会重复。高级 RAG 补上这些短板，但仍是一条链。检索之前，它用滑动窗口和元数据改进索引，把文本切得更细，并通过改写或扩展让问题更清楚。检索和生成跟朴素 RAG 一样。检索之后，它给文本块重新排序，把最相关的放到提示词的两头，再压缩到只剩关键部分。模块化 RAG 建立在前两种之上，把这条链拆成模块。可以加新模块，比如搜索、记忆、路由，也可以替换已有的模块。流程不必只走一遍：可以迭代地检索，也可以自适应地检索，先判断要不要检索。检索器、生成器这些部件都可以微调。"
caption_zh = "三种 RAG：朴素、高级、模块化，一种从另一种长出来"
caption_en = "Three kinds of RAG: naive, advanced, modular, each growing out of the last"

[[figures]]
file = "index.svg"
alt_zh = "输入：原始文件，比如 PDF、HTML、Word 和 Markdown，清理成纯文本。1 收集来源：非结构化文本，比如维基百科转储，或医疗、法律这类领域数据；文字和表格混在一起的 PDF，可以对表格用 Text-2-SQL，或者把表格转成文字；知识图谱，经过核实、更精确，但搭建和维护要花功夫；还有 LLM 自己写的内容。2 选单元大小：文本从细到粗是词元、短语、句子、命题、文本块、整篇文档；知识图谱里是实体、三元组、子图。粗的单元信息多，噪声也多；细的单元检索更费事，还可能丢掉意思。3 切成文本块：最常见的是按固定词元数切，比如 100、256 或 512；也可以递归切分、用滑动窗口；或者用 Small2Big，拿句子去检索，再把前后的句子一起交给 LLM。块越大，上下文越多，噪声也越多；切分还可能把 PDF 里的表格切坏。4 加元数据：从文件里取页码、文件名、作者、类别和时间戳，检索时可以按这些过滤；还可以人工造元数据，比如段落摘要，或者让 LLM 写出这段文字能回答的假设问题，这叫 Reverse HyDE。5 加结构：层级索引，文件按父子关系排列，文本块挂在上面，每个节点存一份摘要，帮助挑块；或者知识图谱索引，把概念和实体连起来，KGP 用它在多篇文档之间建索引。6 向量化并存储：嵌入模型把每个文本块变成向量，存进向量数据库。索引建得好不好，决定了检索能不能找到对的上下文。"
caption_zh = "建索引：收集来源、选单元大小、切块、加元数据、加结构、存进向量库"
caption_en = "Building the index: gather sources, pick the unit size, split, tag, add structure, store as vectors"

[[figures]]
file = "query.svg"
alt_zh = "输入：用户原样输入的问题。朴素 RAG 直接拿它去检索，问题提得不好，找到的块也不好。为什么要改：用词可能有歧义，比如 \"LLM\" 可以指大语言模型，也可以指法学硕士；问题也可能很复杂、组织得不好。有三种改法，彼此没有先后顺序。扩展，一个问题变成多个：多查询让 LLM 写出几个查询并行检索；子查询用由少到多提示法，把复杂问题拆成几个更简单的子问题；验证链让 LLM 检查扩展出来的查询，减少幻觉。转换，用改过的问题检索：用 LLM 或 RRR 这样的小模型改写问题；HyDE 先写一个假设的答案，再拿它去检索；后退提示先写一个更概括的问题，和原问题一起检索。淘宝的改写方法 BEQUE 提高了长尾查询的召回率。路由，把每个问题送到合适的 RAG 流水线：元数据路由从问题里提取关键词，按关键词筛选块；语义路由按问题的意思来分；也可以两者混用。"
caption_zh = "检索前先改问题：为什么要改，以及扩展、转换、路由三种改法"
caption_en = "Fix the question before the search: why, then expand, transform or route"

[[figures]]
file = "search.svg"
alt_zh = "输入：用户的问题，以及索引里已经存好的文本块向量。检索过程：用建索引时的同一个模型把问题转成向量，算出每个文本块的向量和问题向量有多相似（比如用余弦相似度），取最相似的前 K 块放进提示词。检索要用到嵌入模型，分两类：稀疏编码器（如 BM25）和基于 BERT 类预训练模型的稠密检索器。较新的模型有 AngIE、Voyage、BGE。排行榜可以用来比较它们：MTEB 覆盖 8 个任务、58 个数据集；C-MTEB 针对中文，覆盖 6 个任务、35 个数据集。没有哪个模型适合所有场景。改进检索有三种办法，不分先后。一是混合稀疏和稠密：稀疏检索能帮稠密检索处理少见实体和零样本问题，它的结果可以用来训练稠密模型，预训练语言模型也可以学习词的权重来增强稀疏检索。二是微调模型：在医疗、法律这类术语多的领域，用自己的领域数据微调；或者让检索器和大模型对齐，用大模型的输出作训练信号（LSR）。REPLUG 用 KL 散度训练，LLM-Embedder 用大模型给的奖励训练。三是加适配器，用在没法微调的时候，比如模型只能通过 API 调用，或者算力有限：BGM 固定检索器和大模型，在两者之间训练一个桥接模型；UPRISE、AAR、PRCA 是其他外挂适配器。"
caption_zh = "检索：问题转向量、算相似度、取前 K 块，再看三种改进办法"
caption_en = "Search: embed the question, score the chunks, keep the top K, and three ways to improve it"

[[figures]]
file = "generate.svg"
alt_zh = "输入：问题，以及为它检索到的前 K 个片段。把它们全部直接交给大模型并不好：上下文太多会带进噪声，而且长文本里大模型只关注开头和结尾，会漏掉中间。1 重排：用规则（多样性、相关性、MRR）或用模型（BERT 系列、Cohere rerank、bge-reranker-large，或 GPT 这样的通用大模型）把最相关的片段排到前面，并把最好的片段放到提示词的两端。2 挑选与压缩：LLMLingua 用一个小模型（GPT-2 Small 或 LLaMA-7B）删掉不重要的 token；PRCA 和 RECOMP 训练一个压缩器；文档少一些也有帮助：Filter-Reranker 让小模型过滤、大模型重新排序，或者让大模型评判检索到的文档、去掉弱的，比如 Chatlaw。3 拼提示词并回答：问题和留下的片段放进同一个提示词，多轮对话时再加上聊天记录；大模型按任务需要，要么用自己的知识回答，要么只依据这些文档回答。此外，也可以微调大模型本身：补上它缺的领域知识，设定回答的格式和风格，用强化学习让它对齐人或检索器的偏好，或者从 GPT-4 这样更强的模型蒸馏。RA-DIT 把大模型和检索器一起调。这是本地部署大模型的一大好处。"
caption_zh = "生成：重排、挑选压缩、拼提示词回答，旁边可微调大模型"
caption_en = "Generation: rerank, select and compress, build the prompt and answer, with fine-tuning the LLM on the side"

[[figures]]
file = "flows.svg"
alt_zh = "输入：一个问题。RAG 搜索知识库有四种方式，并排展示。一次检索：只搜一次，然后生成答案。这是最常见的做法，但遇到需要多步推理的难题，往往不够用。迭代检索：搜索、生成，再重复；每次搜索都用原问题加上已生成的文字。ITER-RETGEN 就是这样做的。风险是语义断裂，不相关的信息越积越多。递归检索：先改进查询，把问题拆成子问题，再搜索、生成，然后再改进。IRCoT 用思维链来引导，ToC 会建一棵澄清树。如果有结构化索引，就先搜摘要，再到文档内部搜。自适应检索：由 LLM 自己决定要不要搜、什么时候停，常用特殊 token 来控制。FLARE 在生成词的概率低于阈值时才去搜；Self-RAG 用 retrieve 和 critic 两种 token。"
caption_zh = "搜几次：一次、迭代、递归、自适应"
caption_en = "How many times to search: once, iterative, recursive, adaptive"

[[figures]]
file = "modular.svg"
alt_zh = "模块化 RAG 建立在朴素 RAG 和高级 RAG 之上，但可以替换部件、加入新部件，或调整它们的运行顺序。这里按用途分组，不按顺序。负责查找的模块：Search 让 LLM 写代码或查询语言，去搜索引擎、数据库和知识图谱里查；RAG-Fusion 把一个查询扩成几个，并行搜索，再重排结果；Memory 用 LLM 自己的记忆来引导检索。负责选择或适配的模块：Routing 为查询选合适的路径，比如做摘要、查某个数据库，或合并几路信息；Predict 让 LLM 自己写出上下文，减少噪声和重复；Task Adapter 让 RAG 适配下游任务，为零样本输入检索提示，并用少样本生成的查询训练专门的检索器。改变链条的模式：Rewrite-Retrieve-Read 先让 LLM 改写查询；Generate-Read 用 LLM 自己写的内容代替检索，Recite-Read 从模型权重里回忆；混合检索把关键词、语义和向量搜索结合起来；子查询和 HyDE 拿草拟的答案去匹配真实文档。循环或自适应的模式：Demonstrate-Search-Predict 把一个模块的输出交给另一个模块用；ITER-RETGEN 按“检索、阅读、再检索、再阅读”来跑；FLARE 和 Self-RAG 判断到底要不要检索；灵活的结构也让微调检索器、生成器或两者一起微调变得更容易。"
caption_zh = "模块化 RAG 的积木：查找、选择适配、调整链条、循环自适应"
caption_en = "Modular RAG's building blocks: find, pick or fit, change the chain, loop or adapt"

[[figures]]
file = "compare.svg"
alt_zh = "用三种方法让大语言模型变得更好，并排对比。提示词工程用的是模型本身已有的能力：它不太需要外部知识，也不太需要改动模型，两方面的需求都是三者里最低的。RAG 好比给模型一本量身定做的课本，让它去查事实。好处：知识可以从外部来源实时更新，答案也容易追溯。坏处：回答更慢，取数据还涉及伦理问题。早期的朴素 RAG 几乎不用改模型；模块化 RAG 更多地结合微调。微调好比学生慢慢把知识学进去，做法是继续训练模型。好处：能照搬特定的结构、风格或格式。坏处：它是静态的，更新就得重新训练，准备数据和训练都要大量算力。它能减少幻觉，但遇到不熟悉的数据可能吃力。综述报告的结果：在知识密集型任务上，不管是已知知识还是新知识，RAG 都胜过无监督微调；大语言模型很难通过无监督微调学会新事实；超过 200,000 个 token 的长上下文也替代不了 RAG，因为它更慢，而且是个黑箱，而 RAG 会给出原始出处，用户可以核对答案。RAG 和微调不是二选一：一起用可能效果最好。"
caption_zh = "三种做法并排比：提示词工程、RAG、微调，以及综述报告的结果"
caption_en = "Three options side by side: prompt engineering, RAG, fine-tuning, and what the survey reports"

[[figures]]
file = "eval.svg"
alt_zh = "输入：一个要检查的 RAG 系统，看两个目标：检索和生成，可以人工检查，也可以自动检查。测试用的任务：核心任务是问答，包括单跳、多跳和长篇问答，还有领域问答和选择题；其他任务有信息抽取、对话和代码搜索。综述共统计了 26 个任务、近 50 个数据集。基准和工具检查这两个目标：基准 RGB、RECALL 和 CRUD 测四种能力；工具 RAGAS、ARES 和 TruLens 用大模型给三项质量分打分。EM、F1、BLEU、ROUGE 这类经典指标是传统做法，还不是 RAG 的标准。检索质量：搜索指标 Hit Rate、MRR 和 NDCG；质量分\"上下文相关性\"，指检索到的内容切题、没有多余的东西；能力\"抗噪声\"，指文档和问题相关但没有有用信息时，系统也能应对。生成质量：没有标注时，答案要忠实、相关、无害；有标注时，答案要准确。质量分是答案忠实度和答案相关性。三种能力：拒答，文档里没有答案时不作答；信息整合，把多篇文档的内容合起来；反事实鲁棒性，忽略文档里已知的错误事实。"
caption_zh = "检查 RAG：测哪些任务、检索质量、生成质量、用什么基准和工具"
caption_en = "Checking RAG: the tasks, retrieval quality, generation quality, and the benchmarks and tools"
