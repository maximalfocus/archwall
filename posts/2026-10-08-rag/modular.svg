<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Modular RAG building blocks</title>
<desc id="d">Modular RAG builds on Naive and Advanced RAG, but lets you swap parts, add new ones, or change the order they run in. The parts are grouped here by job, not by order. Modules that find: Search lets the LLM write code or query languages to search engines, databases and knowledge graphs; RAG-Fusion turns one query into several, searches them in parallel and reranks the results; Memory uses the LLM's own memory to guide retrieval. Modules that pick or fit: Routing picks the right path for a query, such as a summary, a specific database, or merging several streams; Predict has the LLM write the context itself, to cut noise and repetition; Task Adapter fits RAG to a downstream task, retrieving prompts for zero-shot inputs and building task-specific retrievers from few-shot query generation. Patterns that change the chain: Rewrite-Retrieve-Read has the LLM rewrite the query first; Generate-Read uses text the LLM writes instead of retrieval, and Recite-Read recalls from the model's weights; hybrid retrieval mixes keyword, semantic and vector search; sub-queries and HyDE match a drafted answer against real documents. Patterns that loop or adapt: Demonstrate-Search-Predict feeds one module's output into another; ITER-RETGEN runs Retrieve-Read-Retrieve-Read; FLARE and Self-RAG decide whether retrieval is needed at all; and the flexible setup makes it easier to fine-tune the retriever, the generator, or both together.</desc>
