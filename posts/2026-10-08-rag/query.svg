<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Fix the question first</title>
<desc id="d">In: the user's question, as typed. Naive RAG searches with it directly, and a poor question finds poor chunks. Why fix it: words can be ambiguous, for example "LLM" can mean a large language model or a Master of Laws; and a question can be complex and not well organized. Three ways to fix it, with no order between them. Expand, one question becomes many: multi-query has an LLM write several queries and runs them in parallel; sub-query breaks a complex question into simpler sub-questions with least-to-most prompting; Chain-of-Verification has an LLM check the expanded queries to cut hallucinations. Transform, search with a changed question: rewrite it with an LLM or a smaller model such as RRR; HyDE writes a hypothetical answer and searches with that; step-back prompting writes a more general question and searches with it and the original. Taobao's rewrite, BEQUE, raised recall for long-tail queries. Route, send each question to a fitting RAG pipeline: a metadata router pulls keywords from the question and filters chunks on them; a semantic router goes by what the question means; or mix both.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
