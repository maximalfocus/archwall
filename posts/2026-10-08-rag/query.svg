<text x="600.0" y="46.0" class="q" text-anchor="middle" >In: the user's question, as typed · three ways to fix it before the search</text>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<text x="300.0" y="120" class="gt" text-anchor="middle" >Why fix it</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Ambiguous words</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >"LLM": language model or law degree?</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Messy questions</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >complex · not well organized</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Naive RAG searches as is</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >poor question · poor chunks</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<text x="900.0" y="120" class="gt" text-anchor="middle" >Expand: one becomes many</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Multi-query</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >LLM writes several · run in parallel</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Sub-query</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >split into simpler questions</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Chain-of-Verification</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >LLM checks the new queries</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Sub-query uses least-to-most prompting</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >Checked queries: fewer hallucinations</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<text x="300.0" y="536" class="gt" text-anchor="middle" >Transform: search with a new question</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Rewrite</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >by an LLM or a small model (RRR)</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >HyDE</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >search with a made-up answer</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Step-back question</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >searched along with the original</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Taobao's BEQUE rewrite: better recall</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >for long-tail queries</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<text x="900.0" y="536" class="gt" text-anchor="middle" >Route: pick the right pipeline</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Metadata router</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >keywords filter the chunks</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Semantic router</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >by what the question means</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Hybrid routing</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >semantic + metadata</text>
