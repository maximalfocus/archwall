<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">How the search works</title>
<desc id="d">In: a user's question, and the chunk vectors already in the index. The search: embed the question with the same model used for the index, score each chunk by how similar its vector is to the question's, for example with cosine similarity, and keep the top K chunks for the prompt. The search uses an embedding model. There are two kinds: a sparse encoder such as BM25, and a dense retriever built on a BERT-style pre-trained model. Newer models include AngIE, Voyage and BGE. Leaderboards compare them: MTEB covers 8 tasks and 58 datasets; C-MTEB, for Chinese, covers 6 tasks and 35 datasets. No one model fits every use. Three ways to make it better, in no order. Mix sparse and dense: sparse retrieval helps dense retrieval with rare entities and zero-shot questions, its results can help train dense models, and a pre-trained language model can learn term weights to boost sparse retrieval. Fine-tune the model: on your own domain data, for fields full of jargon such as healthcare and legal; or to align the retriever with the LLM, using the LLM's output as the training signal (LSR). REPLUG trains with KL divergence; LLM-Embedder uses rewards from the LLM. Add an adapter, when you cannot fine-tune because the model is only behind an API or compute is limited: BGM keeps the retriever and the LLM fixed and trains a bridge model between them; UPRISE, AAR and PRCA are other add-on adapters.</desc>
