<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">RAG next to the other options</title>
<desc id="d">Three ways to improve an LLM, side by side. Prompt engineering uses what the model can already do: it needs little outside knowledge and little change to the model, the least of the three on both. RAG is like giving the model a tailored textbook to look facts up in. Good: knowledge can be updated in real time from outside sources, and answers are easy to trace. Bad: answers are slower, and fetching data raises ethical questions. Early, naive RAG needs little change to the model; modular RAG leans more on fine-tuning. Fine-tuning is like a student learning the material over time, by training the model further. Good: it can copy a specific structure, style or format. Bad: it is static, so updates mean retraining, and it needs a lot of computing for data preparation and training. It can cut hallucinations but may struggle with unfamiliar data. What the survey reports: RAG beat unsupervised fine-tuning on knowledge-heavy tasks, for both known and new knowledge; LLMs struggle to learn new facts through unsupervised fine-tuning; and a long context of over 200,000 tokens does not replace RAG, because it is slower and a black box, while RAG shows the original sources so users can check the answer. RAG and fine-tuning are not either-or: used together they may work best.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
