<rect x="54" y="654" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Connections</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >secrets encrypted when a key is set</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
