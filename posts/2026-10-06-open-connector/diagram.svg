<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">OpenConnector overview</title>
<desc id="d">In: AI agents and apps that need your accounts on other services. 1 Way in: MCP at /mcp with five tools, the HTTP API under /v1 used by the SDK, the oo CLI and OpenAPI clients, and the Web Console on the admin API under /api. 2 Checks: a bearer token when one is configured (runtime token, JWT or admin), allow and block rules per action, then picking which connected account to use. 3 Run: the input is checked against the action's schema, the provider's code loads the first time it is used, and its requests go out through a guarded fetch that blocks private addresses; out to 1,000+ provider APIs, or to OOMOL's Marketplace or SaaS for remote accounts. 4 Records: a redacted run log, the connections with their secrets (encrypted when a key is set), and temporary transit files. Secrets never go back to the agent.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
