<text x="900.0" y="812" class="lb" text-anchor="middle" >Out to 1,000+ provider APIs,</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >or to OOMOL Marketplace / SaaS</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="242.75" cy="527" r="14" class="num"/>
<text x="242.75" y="533" class="numt" text-anchor="middle" >4</text>
<text x="262.75" y="536" class="gt" text-anchor="start" >Records</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Run log</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >redacted · last 5,000 by default</text>
