<rect x="654" y="574" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Check the input</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >against the action schema</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
