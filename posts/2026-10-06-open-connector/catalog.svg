<text x="303.0" y="175.0" class="ag" text-anchor="middle" >definition.ts</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >actions · schemas · scopes</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
