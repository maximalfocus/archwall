<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Providers and the catalog</title>
<desc id="d">1 Source: one folder per provider under src/providers, with definition.ts for actions, schemas and scopes, and executors.ts for the code that calls the provider's API. 2 Build: npm run generate:catalog writes one JSON file per provider plus an index, and a generated registry maps each provider to a lazy import of its executors. 3 Runtime: the catalog loads at startup for listing and search; with the optional flag below the generated index is read instead of every provider file, and a provider's code loads the first time one of its actions, its proxy or its credential check runs; keeping schemas on disk is that flag on Node and the single binary, OOMOL_CONNECT_CATALOG_LAZY_SCHEMAS. 4 What callers see: an agent-readable guide per action, an OpenAPI document, and for each action whether it reads, writes or destroys, and whether it can run locally or is catalog only.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
