<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a call names a connection, or none</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="263.0" cy="111" r="14" class="num"/>
<text x="263.0" y="117" class="numt" text-anchor="middle" >1</text>
<text x="283.0" y="120" class="gt" text-anchor="start" >Pick</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Named</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >must exist · no fallback</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >No name</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >default → no_auth → Marketplace</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Token grant</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >only the allowed IDs</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Agents see an account label,</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >never the secret</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
