<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Connections</title>
<desc id="d">In: a call names a connection, or none. 1 Pick: a named connection must exist and is never swapped for another; with no name, the stored default comes first, then no_auth, then the Marketplace; a token can be limited to some connection IDs. 2 Stored here: API key or custom fields that each provider declares, and OAuth2 through your own OAuth app, refreshed automatically when the provider gave a refresh token. Secrets sit in the runtime database, encrypted only when OOMOL_CONNECT_ENCRYPTION_KEY is set. 3 Nothing stored: no_auth providers such as Hacker News, and Marketplace actions run by OOMOL with one Marketplace API key; only the action ID and input are sent. 4 Kept on SaaS: an OAuth account authorised through an OOMOL SaaS project; its tokens stay on SaaS and its actions run there. Agents only ever see an account label, never a secret.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
