<text x="815.75" y="117" class="numt" text-anchor="middle" >2</text>
<text x="835.75" y="120" class="gt" text-anchor="start" >Stored here</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >API key · custom</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >fields the provider declares</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >OAuth2</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >your own OAuth app</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Auto refresh</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >when a refresh token exists</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Encrypted only with</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >OOMOL_CONNECT_ENCRYPTION_KEY</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="795.5" cy="527" r="14" class="num"/>
<text x="795.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="815.5" y="536" class="gt" text-anchor="start" >Nothing stored</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >no_auth</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >e.g. Hacker News</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Marketplace</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >actions run by OOMOL</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >One Marketplace key</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >sends only action + input</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="209.0" cy="527" r="14" class="num"/>
<text x="209.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="229.0" y="536" class="gt" text-anchor="start" >Kept on SaaS</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >SaaS OAuth account</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >via an OOMOL project key</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Tokens stay on SaaS</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >only a reference here</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Runs remotely</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >no local fallback</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >local</text>
