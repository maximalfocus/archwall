<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Where it runs</title>
<desc id="d">1 Node server: the Docker image from GHCR on port 3000, a single binary for six platforms built with Bun, or the Helm chart and Fly.io, both from that Dockerfile; SQLite by default, PostgreSQL 15 or newer with a database URL, and transit files on local disk or S3. 2 Cloudflare: Workers run it, D1 keeps the records, R2 or Workers KV keeps transit files, and a once-a-minute cron does cleanup. 3 Inside your app: the npm package @oomol-lab/open-connector; your server owns HTTP, configuration and the process; there is no Web Console and one runtime per process. 4 OOMOL hosted: OOMOL's OAuth apps and runtime, with the same provider and action IDs, so you can move to self-hosting later.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
