<rect x="654" y="238" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="253.0" class="ag" text-anchor="middle" >Connection grant</text>
<text x="903.0" y="277.0" class="ag" text-anchor="middle" >exact connection IDs</text>
<rect x="654" y="302" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="312" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="327.0" class="ag" text-anchor="middle" >Trigger grant</text>
<text x="903.0" y="351.0" class="ag" text-anchor="middle" >empty = no triggers</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="849.5" cy="527" r="14" class="num"/>
<text x="849.5" y="533" class="numt" text-anchor="middle" >3</text>
<text x="869.5" y="536" class="gt" text-anchor="start" >Layers</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Deployment</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >env allow / block lists</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Runtime policy</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >saved in the Console</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Token grants</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >can only narrow</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Every layer must allow;</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >a block always wins</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="188.75" cy="527" r="14" class="num"/>
<text x="188.75" y="533" class="numt" text-anchor="middle" >4</text>
<text x="208.75" y="536" class="gt" text-anchor="start" >Data and egress</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Guarded fetch</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >blocks private · metadata IPs</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Private network</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >flag, self-hosted only</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Secrets at rest</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >AES-256-GCM, with a key</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >issues</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >checked by</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >then</text>
</svg>
