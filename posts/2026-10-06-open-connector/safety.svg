<rect x="24" y="16" width="552" height="448" rx="12" class="grp"/>
<circle cx="222.5" cy="43" r="14" class="num"/>
<text x="222.5" y="49" class="numt" text-anchor="middle" >1</text>
<text x="242.5" y="52" class="gt" text-anchor="start" >Admin side</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Admin token</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >guards /api · /docs · Console</text>
<rect x="54" y="160" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="170" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="187.0" class="ag" text-anchor="middle" >Binds to 127.0.0.1</text>
<text x="303.0" y="211.0" class="ag" text-anchor="middle" >HOST=0.0.0.0 to open it</text>
<rect x="54" y="240" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="250" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="267.0" class="ag" text-anchor="middle" >Runtime tokens</text>
<text x="303.0" y="291.0" class="ag" text-anchor="middle" >made here, shown once</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Set it whenever the Console</text>
<text x="300.0" y="438" class="lb" text-anchor="middle" >is reachable beyond your machine</text>
<rect x="624" y="16" width="552" height="448" rx="12" class="grp"/>
<circle cx="802.25" cy="43" r="14" class="num"/>
<text x="802.25" y="49" class="numt" text-anchor="middle" >2</text>
<text x="822.25" y="52" class="gt" text-anchor="start" >Caller tokens</text>
<rect x="654" y="80" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="40" rx="2" fill="#d64545"/>
<text x="903.0" y="105.0" class="ag" text-anchor="middle" >Action rules</text>
<text x="903.0" y="129.0" class="ag" text-anchor="middle" >allow / block per token</text>
<rect x="654" y="154" width="492" height="60" rx="8" class="agent"/>
<rect x="654" y="164" width="5" height="40" rx="2" fill="#d64545"/>
