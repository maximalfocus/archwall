<text x="721.25" y="493" class="numt" text-anchor="middle" >3</text>
<text x="741.25" y="496" class="gt" text-anchor="start" >Prompts: the user decides</text>
<rect x="654" y="532" width="492" height="80" rx="8" class="agent"/>
<rect x="654" y="542" width="5" height="60" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="567.0" class="ag" text-anchor="middle" >Reusable templates</text>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >e.g. few-shot examples</text>
<rect x="654" y="636" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="646" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >prompts/list → prompts/get</text>
<text x="900.0" y="794" class="lb" text-anchor="middle" >often shown as slash commands</text>
<text x="900.0" y="822" class="lb" text-anchor="middle" >or menu items</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="87.5" cy="487" r="14" class="num"/>
<text x="87.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="107.5" y="496" class="gt" text-anchor="start" >One database server, all three</text>
<rect x="54" y="524" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >Tool</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >run a query</text>
<rect x="54" y="610" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="620" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="637.0" class="ag" text-anchor="middle" >Resource</text>
<text x="303.0" y="661.0" class="ag" text-anchor="middle" >the database schema</text>
<rect x="54" y="696" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="706" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="723.0" class="ag" text-anchor="middle" >Prompt</text>
<text x="303.0" y="747.0" class="ag" text-anchor="middle" >few-shot examples</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Optional extensions, such as Tasks for long jobs, add more; both sides must opt in</text>
</svg>
