<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">When the server needs the user</title>
<desc id="d">1 The client sends a call, for example tools/call as request 1. Its capabilities say it can ask the user (elicitation). Only tools/call, resources/read and prompts/get can get this answer. 2 The server replies 'input required' with an elicitation/create request inside, plus optional requestState, its own notes that the client sends back unchanged. The server sends no request of its own and needs no stored state. 3 The client asks the user. Form mode collects things like names and choices; URL mode, which the client opts into, sends the user to a web page, and must be used for passwords, keys and payment details. The user accepts, declines or cancels. 4 The client tries again as request 2 with the same parameters plus the answers, and gets the final result. Sampling and roots use the same path but are deprecated in 2026-07-28.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="161.75" cy="43" r="14" class="num"/>
<text x="161.75" y="49" class="numt" text-anchor="middle" >1</text>
<text x="181.75" y="52" class="gt" text-anchor="start" >Client sends a call</text>
<rect x="54" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="111.0" class="ag" text-anchor="middle" >Capabilities: elicitation</text>
<text x="303.0" y="135.0" class="ag" text-anchor="middle" >the client can ask the user</text>
<rect x="54" y="200" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >tools/call</text>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >request 1</text>
<text x="300.0" y="368" class="lb" text-anchor="middle" >only tools/call, resources/read</text>
<text x="300.0" y="396" class="lb" text-anchor="middle" >and prompts/get can be asked back</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="741.5" cy="43" r="14" class="num"/>
<text x="741.5" y="49" class="numt" text-anchor="middle" >2</text>
<text x="761.5" y="52" class="gt" text-anchor="start" >Server: input required</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="111.0" class="ag" text-anchor="middle" >Input required</text>
<text x="903.0" y="135.0" class="ag" text-anchor="middle" >elicitation/create inside</text>
<rect x="654" y="200" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="210" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="231.0" class="ag" text-anchor="middle" >requestState</text>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >the server's own notes</text>
<text x="900.0" y="368" class="lb" text-anchor="middle" >an answer, not a request from the server;</text>
<text x="900.0" y="396" class="lb" text-anchor="middle" >the server needs no stored state</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="755.0" cy="487" r="14" class="num"/>
<text x="755.0" y="493" class="numt" text-anchor="middle" >3</text>
<text x="775.0" y="496" class="gt" text-anchor="start" >Client asks the user</text>
<rect x="654" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="559.0" class="ag" text-anchor="middle" >Form mode</text>
<text x="776.0" y="583.0" class="ag" text-anchor="middle" >names, choices</text>
<rect x="908" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="559.0" class="ag" text-anchor="middle" >URL mode (opt-in)</text>
<text x="1030.0" y="583.0" class="ag" text-anchor="middle" >passwords, keys</text>
<rect x="654" y="660" width="492" height="72" rx="8" class="human"/>
<text x="903.0" y="691.0" class="ag" text-anchor="middle" >User: accept, decline</text>
<text x="903.0" y="715.0" class="ag" text-anchor="middle" >or cancel</text>
<path d="M773 604V658" class="flow"/>
<path d="M1027 604V658" class="flow"/>
<text x="900.0" y="786" class="lb" text-anchor="middle" >secrets never go in a form;</text>
<text x="900.0" y="814" class="lb" text-anchor="middle" >URL mode sends the user to a web page</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="168.5" cy="487" r="14" class="num"/>
<text x="168.5" y="493" class="numt" text-anchor="middle" >4</text>
<text x="188.5" y="496" class="gt" text-anchor="start" >Client tries again</text>
<rect x="54" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="555.0" class="ag" text-anchor="middle" >tools/call, request 2</text>
<text x="303.0" y="579.0" class="ag" text-anchor="middle" >same parameters + answers</text>
<rect x="54" y="644" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="687.0" class="ag" text-anchor="middle" >Final result</text>
<path d="M300.0 596V642" class="flow"/>
<text x="300.0" y="786" class="lb" text-anchor="middle" >requestState goes back unchanged;</text>
<text x="300.0" y="814" class="lb" text-anchor="middle" >the server may ask again</text>
<path d="M576 262H622" class="flow"/>
<text x="600" y="250" class="al" text-anchor="middle" >call</text>
<path d="M900.0 428V458" class="flow"/>
<text x="976.0" y="449" class="al" text-anchor="middle" >input required</text>
<path d="M624 696H578" class="flow"/>
<text x="600" y="684" class="al" text-anchor="middle" >answers</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Sampling and roots use the same path but are deprecated in 2026-07-28</text>
</svg>
