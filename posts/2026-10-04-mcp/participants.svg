<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">MCP participants</title>
<desc id="d">1 The host is the AI app. It makes the clients, one per server, keeps the conversation history, asks the user before any tool runs and merges context from all clients. 2 Each client keeps a dedicated connection to one server. In the docs' example, client 1 talks to a local filesystem server, client 2 to a local database server, and clients 3 and 4 both talk to the remote Sentry server. 3 A server is the program that serves context, wherever it runs: a local one uses stdio and usually serves one client; a remote one uses Streamable HTTP and usually serves many. 4 Servers get only the context they need, cannot see into other servers, and the host controls anything that crosses servers.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
