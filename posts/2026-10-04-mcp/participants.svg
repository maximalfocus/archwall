<rect x="954" y="164" width="5" height="36" rx="2" fill="#2f6fd6"/>
<text x="1053.0" y="177.0" class="ag" text-anchor="middle" >Server B</text>
<text x="1053.0" y="201.0" class="ag" text-anchor="middle" >Database</text>
<rect x="954" y="220" width="192" height="122" rx="8" class="agent"/>
<rect x="954" y="230" width="5" height="102" rx="2" fill="#2f6fd6"/>
<text x="1053.0" y="276.0" class="ag" text-anchor="middle" >Server C</text>
