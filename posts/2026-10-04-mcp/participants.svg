<text x="176.0" y="139.0" class="ag" text-anchor="middle" >one per server</text>
<rect x="308" y="80" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="90" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="430.0" y="115.0" class="ag" text-anchor="middle" >Keeps the history</text>
<text x="430.0" y="139.0" class="ag" text-anchor="middle" >of the conversation</text>
<rect x="54" y="176" width="238" height="80" rx="8" class="agent"/>
<rect x="54" y="186" width="5" height="60" rx="2" fill="#d64545"/>
<text x="176.0" y="211.0" class="ag" text-anchor="middle" >Asks the user</text>
<text x="176.0" y="235.0" class="ag" text-anchor="middle" >before a tool runs</text>
<rect x="308" y="176" width="238" height="80" rx="8" class="agent"/>
<rect x="308" y="186" width="5" height="60" rx="2" fill="#2f9e6e"/>
<text x="430.0" y="211.0" class="ag" text-anchor="middle" >Merges context</text>
<text x="430.0" y="235.0" class="ag" text-anchor="middle" >from all clients</text>
