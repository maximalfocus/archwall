<rect x="908" y="656" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="666" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="1030.0" y="691.0" class="ag" text-anchor="middle" >Streamable HTTP</text>
<text x="1030.0" y="715.0" class="ag" text-anchor="middle" >usually many</text>
