<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">One MCP request</title>
<desc id="d">1 Every request carries, in its _meta field, the protocol version (for example 2026-07-28) and the client's capabilities, and should carry the client's name. So the server keeps no session and needs nothing from earlier requests. 2 Discover, optional for the client: server/discover returns the server's supported versions, capabilities and name. Every server must answer it. If a request uses a version the server does not support, the error lists the versions it does. 3 List the tools: tools/list returns each tool's name, title, description and input schema. The result carries a cache hint; five minutes in the docs' example. 4 Call a tool: tools/call with the tool name and arguments returns content such as text or images, which the host hands to the model.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="148.25" cy="43" r="14" class="num"/>
<text x="148.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="168.25" y="52" class="gt" text-anchor="start" >Every request carries</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Protocol version</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >e.g. 2026-07-28</text>
<rect x="54" y="162" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="172" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="189.0" class="ag" text-anchor="middle" >Client capabilities</text>
<text x="303.0" y="213.0" class="ag" text-anchor="middle" >what the client can do</text>
<rect x="54" y="244" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="254" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="271.0" class="ag" text-anchor="middle" >Client name</text>
<text x="303.0" y="295.0" class="ag" text-anchor="middle" >should be there</text>
<text x="300.0" y="368" class="lb" text-anchor="middle" >so the server keeps no session</text>
<text x="300.0" y="396" class="lb" text-anchor="middle" >and needs nothing from before</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="761.75" cy="43" r="14" class="num"/>
<text x="761.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="781.75" y="52" class="gt" text-anchor="start" >Discover (optional)</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="111.0" class="ag" text-anchor="middle" >server/discover</text>
<text x="903.0" y="135.0" class="ag" text-anchor="middle" >the client asks first</text>
<rect x="654" y="200" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="210" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="231.0" class="ag" text-anchor="middle" >Versions, capabilities</text>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >and the server's name</text>
<path d="M900.0 152V198" class="flow"/>
<text x="900.0" y="368" class="lb" text-anchor="middle" >every server must answer it</text>
<text x="900.0" y="396" class="lb" text-anchor="middle" >wrong version? the error lists good ones</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="795.5" cy="487" r="14" class="num"/>
<text x="795.5" y="493" class="numt" text-anchor="middle" >3</text>
<text x="815.5" y="496" class="gt" text-anchor="start" >List the tools</text>
<rect x="654" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="555.0" class="ag" text-anchor="middle" >tools/list</text>
<text x="903.0" y="579.0" class="ag" text-anchor="middle" >what can this server do?</text>
<rect x="654" y="644" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="675.0" class="ag" text-anchor="middle" >Name, title, description</text>
<text x="903.0" y="699.0" class="ag" text-anchor="middle" >and input schema per tool</text>
<path d="M900.0 596V642" class="flow"/>
<text x="900.0" y="786" class="lb" text-anchor="middle" >the reply carries a cache hint:</text>
<text x="900.0" y="814" class="lb" text-anchor="middle" >5 minutes in the docs' example</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="215.75" cy="487" r="14" class="num"/>
<text x="215.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="235.75" y="496" class="gt" text-anchor="start" >Call a tool</text>
<rect x="54" y="524" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="555.0" class="ag" text-anchor="middle" >tools/call</text>
<text x="303.0" y="579.0" class="ag" text-anchor="middle" >tool name + arguments</text>
<rect x="54" y="644" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="303.0" y="675.0" class="ag" text-anchor="middle" >Result</text>
<text x="303.0" y="699.0" class="ag" text-anchor="middle" >text, images, other content</text>
<path d="M300.0 596V642" class="flow"/>
<text x="300.0" y="814" class="lb" text-anchor="middle" >the host hands the result to the model</text>
<path d="M576 226H622" class="flow"/>
<text x="600" y="214" class="al" text-anchor="middle" >on each</text>
<path d="M900.0 428V458" class="flow"/>
<text x="966.0" y="449" class="al" text-anchor="middle" >capabilities</text>
<path d="M624 642H578" class="flow"/>
<text x="600" y="630" class="al" text-anchor="middle" >tool name</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Example walk-through from the docs; every message is JSON-RPC 2.0</text>
</svg>
