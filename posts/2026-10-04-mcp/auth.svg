<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Signing in to a remote server</title>
<desc id="d">Optional, and only for HTTP servers; a stdio server takes credentials from the environment. 1 No token yet: the client calls the MCP server and gets 401 Unauthorized, with a link to the server's metadata. 2 Find the auth server: the server's resource metadata names its authorization server, which may be a separate service; the authorization server's metadata gives its addresses. 3 Get a client ID, pre-registered or from a client metadata URL (Dynamic Client Registration still works but is deprecated). The user approves in the browser and the client gets an access token for this server only. 4 Use the token: Authorization: Bearer on every HTTP request. The server checks the token was issued for it and never passes tokens on. If more access is needed, the server answers 403 and the client asks for more scopes.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="209.0" cy="43" r="14" class="num"/>
<text x="209.0" y="49" class="numt" text-anchor="middle" >1</text>
<text x="229.0" y="52" class="gt" text-anchor="start" >No token yet</text>
<rect x="54" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="52" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="111.0" class="ag" text-anchor="middle" >Client calls the server</text>
<text x="303.0" y="135.0" class="ag" text-anchor="middle" >without a token</text>
<rect x="54" y="200" width="492" height="72" rx="8" class="agent"/>
<rect x="54" y="210" width="5" height="52" rx="2" fill="#d64545"/>
<text x="303.0" y="231.0" class="ag" text-anchor="middle" >401 Unauthorized</text>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >plus a link to its metadata</text>
<path d="M300.0 152V198" class="flow"/>
<text x="300.0" y="368" class="lb" text-anchor="middle" >optional, for HTTP servers only;</text>
<text x="300.0" y="396" class="lb" text-anchor="middle" >stdio takes keys from the environment</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="755.0" cy="43" r="14" class="num"/>
<text x="755.0" y="49" class="numt" text-anchor="middle" >2</text>
<text x="775.0" y="52" class="gt" text-anchor="start" >Find the auth server</text>
<rect x="654" y="80" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="111.0" class="ag" text-anchor="middle" >Server's resource metadata</text>
<text x="903.0" y="135.0" class="ag" text-anchor="middle" >names its auth server</text>
<rect x="654" y="200" width="492" height="72" rx="8" class="agent"/>
<rect x="654" y="210" width="5" height="52" rx="2" fill="#5b6675"/>
<text x="903.0" y="231.0" class="ag" text-anchor="middle" >Auth server metadata</text>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >its addresses</text>
<path d="M900.0 152V198" class="flow"/>
<text x="900.0" y="382" class="lb" text-anchor="middle" >the auth server can be a separate service</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="728.0" cy="487" r="14" class="num"/>
<text x="728.0" y="493" class="numt" text-anchor="middle" >3</text>
<text x="748.0" y="496" class="gt" text-anchor="start" >Get a client ID, sign in</text>
<rect x="654" y="524" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="551.0" class="ag" text-anchor="middle" >Client ID</text>
<text x="903.0" y="575.0" class="ag" text-anchor="middle" >pre-registered or a metadata URL</text>
<rect x="654" y="608" width="492" height="64" rx="8" class="human"/>
<text x="903.0" y="635.0" class="ag" text-anchor="middle" >User approves</text>
<text x="903.0" y="659.0" class="ag" text-anchor="middle" >in the browser</text>
<path d="M900.0 588V606" class="flow"/>
<rect x="654" y="692" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="702" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="719.0" class="ag" text-anchor="middle" >Access token</text>
<text x="903.0" y="743.0" class="ag" text-anchor="middle" >for this server only</text>
<path d="M900.0 672V690" class="flow"/>
<text x="900.0" y="814" class="lb" text-anchor="middle" >old-style registration (DCR) is deprecated</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="202.25" cy="487" r="14" class="num"/>
<text x="202.25" y="493" class="numt" text-anchor="middle" >4</text>
<text x="222.25" y="496" class="gt" text-anchor="start" >Use the token</text>
<rect x="54" y="524" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >Authorization: Bearer</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >on every HTTP request</text>
<rect x="54" y="608" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="618" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="635.0" class="ag" text-anchor="middle" >Server checks the token</text>
<text x="303.0" y="659.0" class="ag" text-anchor="middle" >was issued for it</text>
<rect x="54" y="692" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="702" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="719.0" class="ag" text-anchor="middle" >Need more access?</text>
<text x="303.0" y="743.0" class="ag" text-anchor="middle" >403, then ask for more</text>
<text x="300.0" y="814" class="lb" text-anchor="middle" >servers never pass tokens on</text>
<path d="M576 276H622" class="flow"/>
<text x="600" y="264" class="al" text-anchor="middle" >link</text>
<path d="M900.0 428V458" class="flow"/>
<text x="960.0" y="449" class="al" text-anchor="middle" >auth server</text>
<path d="M624 728H578" class="flow"/>
<text x="600" y="716" class="al" text-anchor="middle" >token</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Based on OAuth 2.1; the server is the resource, the auth server issues tokens</text>
</svg>
