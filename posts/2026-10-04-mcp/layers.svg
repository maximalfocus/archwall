<text x="148.0" y="52" class="gt" text-anchor="start" >Data layer: what is said</text>
<rect x="54" y="80" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="40" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="105.0" class="ag" text-anchor="middle" >Discovery</text>
<text x="303.0" y="129.0" class="ag" text-anchor="middle" >versions and capabilities</text>
<rect x="54" y="152" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="162" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="177.0" class="ag" text-anchor="middle" >Server features</text>
<text x="303.0" y="201.0" class="ag" text-anchor="middle" >tools, resources, prompts</text>
<rect x="54" y="224" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="234" width="5" height="40" rx="2" fill="#d64545"/>
<text x="303.0" y="249.0" class="ag" text-anchor="middle" >Client features</text>
<text x="303.0" y="273.0" class="ag" text-anchor="middle" >ask the user for input</text>
<rect x="54" y="296" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="306" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="303.0" y="321.0" class="ag" text-anchor="middle" >Utilities</text>
<text x="303.0" y="345.0" class="ag" text-anchor="middle" >change notices, progress</text>
<text x="300.0" y="402" class="lb" text-anchor="middle" >the inner layer</text>
