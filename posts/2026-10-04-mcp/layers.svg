<text x="761.5" y="52" class="gt" text-anchor="start" >Messages: JSON-RPC 2.0</text>
<rect x="654" y="92" width="130" height="250" rx="8" class="agent"/>
<rect x="654" y="102" width="5" height="230" rx="2" fill="#2f6fd6"/>
<text x="722.0" y="224.0" class="ag" text-anchor="middle" >Client</text>
