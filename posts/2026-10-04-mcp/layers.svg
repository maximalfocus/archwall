<text x="1084.0" y="224.0" class="ag" text-anchor="middle" >Server</text>
<path d="M784 146H1014" class="flow"/>
<text x="900" y="134" class="al" text-anchor="middle" >request</text>
<path d="M1016 216H786" class="flow"/>
<text x="900" y="204" class="al" text-anchor="middle" >result or error</text>
<path d="M784 278H1014" class="flow"/>
<text x="900" y="266" class="al" text-anchor="middle" >notifications</text>
<path d="M1016 306H786" class="flow"/>
<text x="900.0" y="378" class="lb" text-anchor="middle" >servers never send requests</text>
<text x="900.0" y="406" class="lb" text-anchor="middle" >notifications get no reply</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="680.75" cy="487" r="14" class="num"/>
<text x="680.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="700.75" y="496" class="gt" text-anchor="start" >Transport layer: how it travels</text>
<rect x="654" y="524" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="551.0" class="ag" text-anchor="middle" >Connection setup</text>
<text x="903.0" y="575.0" class="ag" text-anchor="middle" >start or reach the server</text>
<rect x="654" y="610" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="620" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="637.0" class="ag" text-anchor="middle" >Message framing</text>
<text x="903.0" y="661.0" class="ag" text-anchor="middle" >where one message ends</text>
<rect x="654" y="696" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="706" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="723.0" class="ag" text-anchor="middle" >Authorization</text>
<text x="903.0" y="747.0" class="ag" text-anchor="middle" >who may connect</text>
<text x="900.0" y="814" class="lb" text-anchor="middle" >stdio or Streamable HTTP</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="155.0" cy="487" r="14" class="num"/>
<text x="155.0" y="493" class="numt" text-anchor="middle" >4</text>
<text x="175.0" y="496" class="gt" text-anchor="start" >One inside the other</text>
<rect x="40" y="524" width="520" height="208" rx="9" class="sub"/>
<text x="300.0" y="552" class="st" text-anchor="middle" >Outside: transport layer</text>
<rect x="80" y="584" width="440" height="96" rx="8" class="agent"/>
<rect x="80" y="594" width="5" height="76" rx="2" fill="#5b6675"/>
<text x="303.0" y="627.0" class="ag" text-anchor="middle" >Inside: data layer</text>
<text x="303.0" y="651.0" class="ag" text-anchor="middle" >JSON-RPC messages</text>
<text x="300.0" y="786" class="lb" text-anchor="middle" >swap the pipe,</text>
<text x="300.0" y="814" class="lb" text-anchor="middle" >the messages stay the same</text>
<path d="M576 226H622" class="flow"/>
<text x="600" y="214" class="al" text-anchor="middle" >written as</text>
<path d="M900.0 428V458" class="flow"/>
<text x="960.0" y="449" class="al" text-anchor="middle" >carried by</text>
<path d="M624 642H578" class="flow"/>
<text x="600" y="630" class="al" text-anchor="middle" >wraps</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Most developers work in the data layer; the SDKs handle the rest</text>
</svg>
