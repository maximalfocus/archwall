<rect x="54" y="534" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="551.0" class="ag" text-anchor="middle" >Merge every tool</text>
<text x="303.0" y="575.0" class="ag" text-anchor="middle" >one list for the model</text>
