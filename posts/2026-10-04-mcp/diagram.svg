<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">MCP architecture</title>
<desc id="d">1 The host, an AI app like Claude Code or VS Code, holds the model and makes one MCP client per server; it merges every server's tools for the model and routes each call to the right client. 2 Each client has one connection to its server, with two layers: the transport layer outside (stdio for a local server, Streamable HTTP for a remote one) and the data layer inside (the same JSON-RPC 2.0 messages on either transport). Messages go both ways: requests and notifications out, results and notifications back. 3 Each server offers tools the model calls, resources the app reads and prompts the user picks. Data layer: every request carries its protocol version and client capabilities in _meta, so the server keeps no session; server/discover returns what the server supports; when a server needs user input the client asks the user and retries; subscriptions/listen streams list_changed notices. Transport layer: with stdio the client starts the server as a subprocess; Streamable HTTP posts to one endpoint and replies as JSON or an SSE stream, with OAuth recommended.</desc>
