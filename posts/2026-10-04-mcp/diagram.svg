<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">MCP overview</title>
<desc id="d">1 The host is the AI app, such as Claude Code or VS Code. It keeps the model and the conversation and makes one MCP client per server. 2 Each client has one connection to its server, with two layers: the transport layer outside is the pipe (stdio for a local server, Streamable HTTP for a remote one), and the data layer inside is the messages, JSON-RPC 2.0, the same on either pipe. 3 Servers give context: tools the model calls, resources the app reads, prompts the user picks. A server can be local, like a filesystem server, or remote, like Sentry. 4 The host merges every server's tools into one list for the model, routes each call to the right client and adds the result to the conversation. MCP moves context; the app decides how to use it.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
