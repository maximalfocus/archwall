<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">MCP architecture</title>
<desc id="d">1 The host, an AI app like Claude Code or VS Code, makes one MCP client per server; each client keeps one dedicated connection. 2 Transport: stdio for a local server on the same machine, usually one client; Streamable HTTP (POST, optional SSE, OAuth recommended) for a remote server that serves many clients. Both carry the same JSON-RPC 2.0 messages both ways: requests and notifications out, results and notifications back. 3 The server exposes tools, resources and prompts, found with */list and used with resources/read, prompts/get or tools/call. 4 Every request carries its protocol version and client capabilities in _meta, so the server keeps no session; server/discover returns versions and capabilities; a server can ask the user for input through elicitation; subscriptions/listen opens a stream of change notifications.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
