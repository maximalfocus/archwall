<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">MCP transports</title>
<desc id="d">1 stdio, for a local server: the client starts the server as a child process; they talk over stdin and stdout, one JSON message per line; to stop, the client closes stdin, waits, then forces the process to quit. Logs go to stderr, credentials come from the environment, and it usually serves one client. 2 Streamable HTTP, for a remote server: one endpoint such as /mcp; each message is its own HTTP POST; the reply is one JSON object or an SSE stream. It usually serves many clients. 3 HTTP safety: servers check the Origin header against DNS rebinding, bind to 127.0.0.1 when local, and require headers that copy the method, name and version, which must match the body. Sign-in is optional and uses OAuth. 4 The same on every transport: the same JSON-RPC messages, no sessions; cancelling works on both, by a notice on stdio or by closing the stream on HTTP. Custom transports must keep the same message format.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="148.25" cy="43" r="14" class="num"/>
<text x="148.25" y="49" class="numt" text-anchor="middle" >1</text>
<text x="168.25" y="52" class="gt" text-anchor="start" >stdio: a local server</text>
<rect x="54" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="90" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="107.0" class="ag" text-anchor="middle" >Client starts the server</text>
<text x="303.0" y="131.0" class="ag" text-anchor="middle" >as a child process</text>
<rect x="54" y="164" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="174" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="191.0" class="ag" text-anchor="middle" >stdin and stdout</text>
<text x="303.0" y="215.0" class="ag" text-anchor="middle" >one JSON message per line</text>
<rect x="54" y="248" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="258" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="275.0" class="ag" text-anchor="middle" >To stop: close stdin</text>
<text x="303.0" y="299.0" class="ag" text-anchor="middle" >wait, then force it</text>
<text x="300.0" y="368" class="lb" text-anchor="middle" >logs go to stderr; keys come from the</text>
<text x="300.0" y="396" class="lb" text-anchor="middle" >environment; usually one client</text>
<rect x="624" y="16" width="552" height="412" rx="12" class="grp"/>
<circle cx="734.75" cy="43" r="14" class="num"/>
<text x="734.75" y="49" class="numt" text-anchor="middle" >2</text>
<text x="754.75" y="52" class="gt" text-anchor="start" >Streamable HTTP: remote</text>
<rect x="654" y="80" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="90" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="107.0" class="ag" text-anchor="middle" >One endpoint</text>
<text x="903.0" y="131.0" class="ag" text-anchor="middle" >for example /mcp</text>
<rect x="654" y="164" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="174" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="191.0" class="ag" text-anchor="middle" >Each message</text>
<text x="903.0" y="215.0" class="ag" text-anchor="middle" >its own HTTP POST</text>
<rect x="654" y="248" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="258" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="275.0" class="ag" text-anchor="middle" >Reply: one JSON object</text>
<text x="903.0" y="299.0" class="ag" text-anchor="middle" >or an SSE stream</text>
<text x="900.0" y="382" class="lb" text-anchor="middle" >usually serves many clients</text>
<rect x="624" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="815.75" cy="487" r="14" class="num"/>
<text x="815.75" y="493" class="numt" text-anchor="middle" >3</text>
<text x="835.75" y="496" class="gt" text-anchor="start" >HTTP safety</text>
<rect x="654" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="776.0" y="559.0" class="ag" text-anchor="middle" >Check Origin</text>
<text x="776.0" y="583.0" class="ag" text-anchor="middle" >stops DNS rebinding</text>
<rect x="908" y="524" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="534" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="559.0" class="ag" text-anchor="middle" >Local? Bind to</text>
<text x="1030.0" y="583.0" class="ag" text-anchor="middle" >127.0.0.1 only</text>
<rect x="654" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="654" y="630" width="5" height="60" rx="2" fill="#5b6675"/>
<text x="776.0" y="655.0" class="ag" text-anchor="middle" >Headers copy</text>
<text x="776.0" y="679.0" class="ag" text-anchor="middle" >method, name, version</text>
<rect x="908" y="620" width="238" height="80" rx="8" class="agent"/>
<rect x="908" y="630" width="5" height="60" rx="2" fill="#d64545"/>
<text x="1030.0" y="655.0" class="ag" text-anchor="middle" >Sign-in</text>
<text x="1030.0" y="679.0" class="ag" text-anchor="middle" >optional, OAuth</text>
<text x="900.0" y="762" class="lb" text-anchor="middle" >headers that don't match</text>
<text x="900.0" y="790" class="lb" text-anchor="middle" >the body are rejected</text>
<rect x="24" y="460" width="552" height="400" rx="12" class="grp"/>
<circle cx="134.75" cy="487" r="14" class="num"/>
<text x="134.75" y="493" class="numt" text-anchor="middle" >4</text>
<text x="154.75" y="496" class="gt" text-anchor="start" >Same on every transport</text>
<rect x="54" y="524" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="534" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="563.0" class="ag" text-anchor="middle" >Same JSON-RPC messages</text>
<rect x="54" y="608" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="618" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="635.0" class="ag" text-anchor="middle" >No sessions</text>
<text x="303.0" y="659.0" class="ag" text-anchor="middle" >each request stands alone</text>
<rect x="54" y="692" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="702" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="719.0" class="ag" text-anchor="middle" >Cancel works on both</text>
<text x="303.0" y="743.0" class="ag" text-anchor="middle" >stdio: a notice · HTTP: close the stream</text>
<text x="300.0" y="814" class="lb" text-anchor="middle" >custom transports keep the same format</text>
<text x="600" y="888" class="lb" text-anchor="middle" >Streamable HTTP replaced the old HTTP+SSE transport, now deprecated</text>
</svg>
