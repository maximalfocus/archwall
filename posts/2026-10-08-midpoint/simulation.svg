<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Simulations: try a change first</title>
<desc id="d">In: a new or changed piece of config, such as a mapping, an object type or a whole resource. 1 Mark it proposed: each config item has a lifecycle state, in the order draft, proposed, active, deprecated, archived. Draft and archived items are not used at all; proposed items are seen only by simulations; active and deprecated items are what production uses. 2 Run a simulation: a task such as import, reconciliation, live sync or recompute runs in preview mode, where changes are computed but not applied. It uses the development config (active plus proposed items) or the production config (active plus deprecated items). The development config never runs in full mode, and approvals and notifications are skipped. 3 Read the result: the simulation result lists what would change, with built-in metrics (added, modified, deleted) and event marks such as focus activated; it is shown in the GUI or exported as reports. 4 Switch it on: set the new item from proposed to active and the old one from deprecated to archived, both at once for a seamless switch; from then on full mode writes the changes to the repository and the resources and records them in the audit log.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a new mapping · object type · resource</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="182.0" cy="111" r="14" class="num"/>
<text x="182.0" y="117" class="numt" text-anchor="middle" >1</text>
<text x="202.0" y="120" class="gt" text-anchor="start" >Mark it proposed</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Draft · archived</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >not used at all</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Proposed</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >seen only by simulations</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Active · deprecated</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >what production uses</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >draft → proposed → active → deprecated → archived</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="782.0" cy="111" r="14" class="num"/>
<text x="782.0" y="117" class="numt" text-anchor="middle" >2</text>
<text x="802.0" y="120" class="gt" text-anchor="start" >Run a simulation</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Preview mode</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >computed · not applied</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Development config</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >active + proposed items</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >Production config</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >active + deprecated items</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Import · reconcile · live sync · recompute …</text>
<text x="900.0" y="438" class="lb" text-anchor="middle" >Approvals and notifications are skipped</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="788.75" cy="527" r="14" class="num"/>
<text x="788.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="808.75" y="536" class="gt" text-anchor="start" >Read the result</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Simulation result</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >what would change</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Built-in metrics</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >added · modified · deleted</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Event marks</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >e.g. focus activated</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Shown in the GUI or exported as reports</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="209.0" cy="527" r="14" class="num"/>
<text x="209.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="229.0" y="536" class="gt" text-anchor="start" >Switch it on</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Proposed → active</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >the new item goes live</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Deprecated → archived</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >the old item retires</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Full mode</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >writes · audits the changes</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Both switches at once: no gap</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >proposed</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >would-be changes</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >looks right</text>
</svg>
