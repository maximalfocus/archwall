<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">midPoint's parts</title>
<desc id="d">Clients, above the Model API, change most from one deployment to the next: the admin GUI, a web UI built with Apache Wicket; the REST API, the Model API over the network, in JSON, XML or YAML; and your own code. They call the IDM model through the Model API. The IDM model is where every change passes and policies are enforced: mappings, roles and policy rules; approvals and cases; certification, reports and notifications; and smart integration, AI suggestions for mappings and correlation from an outside service, which needs the smartIntegration setting. The model reads and writes accounts through provisioning and stores objects in the repository. Provisioning keeps shadows that link users to accounts and talks to apps through ConnId connectors, or built-in manual and asynchronous ones; it stores the shadows in the repository. The repository is native PostgreSQL, the only database since midPoint 4.10; the audit trail goes to its own tables or to a log. Shared services: the schema (Prism, written in XSD), tasks run by the Quartz scheduler, and security, which checks authorizations.</desc>
