<text x="867.0" y="120" class="gt" text-anchor="start" >Compute the accounts</text>
<rect x="838" y="148" width="308" height="64" rx="8" class="agent"/>
<rect x="838" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="995.0" y="175.0" class="ag" text-anchor="middle" >Outbound</text>
