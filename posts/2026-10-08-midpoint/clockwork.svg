<text x="110.0" y="120" class="gt" text-anchor="start" >Take the request</text>
<rect x="54" y="148" width="308" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="211.0" y="175.0" class="ag" text-anchor="middle" >Load</text>
<text x="211.0" y="199.0" class="ag" text-anchor="middle" >the user · its accounts</text>
<rect x="54" y="228" width="308" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="211.0" y="255.0" class="ag" text-anchor="middle" >Audit</text>
<text x="211.0" y="279.0" class="ag" text-anchor="middle" >stage: request</text>
<text x="208.0" y="412" class="lb" text-anchor="middle" >State INITIAL</text>
<rect x="416" y="84" width="368" height="380" rx="12" class="grp"/>
