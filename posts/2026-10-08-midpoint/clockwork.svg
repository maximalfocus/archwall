<circle cx="948.25" cy="527" r="14" class="num"/>
<text x="948.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="968.25" y="536" class="gt" text-anchor="start" >Check</text>
<rect x="838" y="564" width="308" height="64" rx="8" class="agent"/>
<rect x="838" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="995.0" y="591.0" class="ag" text-anchor="middle" >Enforcement</text>
<text x="995.0" y="615.0" class="ag" text-anchor="middle" >a violation stops it</text>
<rect x="838" y="644" width="308" height="64" rx="8" class="agent"/>
<rect x="838" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="995.0" y="671.0" class="ag" text-anchor="middle" >Approvals hook</text>
<text x="995.0" y="695.0" class="ag" text-anchor="middle" >may open a case</text>
<text x="992.0" y="812" class="lb" text-anchor="middle" >State PRIMARY</text>
<text x="992.0" y="838" class="lb" text-anchor="middle" >Waits for approval in the background</text>
<rect x="416" y="500" width="368" height="364" rx="12" class="grp"/>
<circle cx="542.75" cy="527" r="14" class="num"/>
<text x="542.75" y="533" class="numt" text-anchor="middle" >5</text>
<text x="562.75" y="536" class="gt" text-anchor="start" >Execute</text>
<rect x="446" y="564" width="308" height="64" rx="8" class="agent"/>
<rect x="446" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="603.0" y="591.0" class="ag" text-anchor="middle" >Execute</text>
<text x="603.0" y="615.0" class="ag" text-anchor="middle" >repository · provisioning</text>
<rect x="446" y="644" width="308" height="64" rx="8" class="agent"/>
<rect x="446" y="654" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="603.0" y="671.0" class="ag" text-anchor="middle" >Audit</text>
