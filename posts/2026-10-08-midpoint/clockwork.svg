<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">One change through the model</title>
<desc id="d">In: a change from the GUI, from a service or found by synchronization. 1 Take the request, state INITIAL: the clockwork loads the user and its accounts and audits the request. 2 Compute the user, in the projector: inbound mappings bring account data into the user, the object template fills in user data, assignments are evaluated with the roles' inducements, and the user's policy rules are evaluated. 3 Compute the accounts, one by one: outbound mappings turn user data into account data, the values are consolidated, strong and weak mappings merged, and the account's policy rules are evaluated. Nothing is changed yet; the result is a preview. 4 Check, state PRIMARY: rules with the enforcement action stop the change; the approvals hook may take the change into an approval case and continue in the background. 5 Execute, state SECONDARY: the model is computed again, then the changes are written to the repository and through provisioning to the accounts, and audited; with provisioning dependencies this runs in several waves. 6 Finish, state FINAL: the final execution is audited and the notifications hook sends notifications.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
