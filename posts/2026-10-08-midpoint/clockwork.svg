<rect x="838" y="228" width="308" height="64" rx="8" class="agent"/>
<rect x="838" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="995.0" y="255.0" class="ag" text-anchor="middle" >Consolidate</text>
<text x="995.0" y="279.0" class="ag" text-anchor="middle" >merge strong · weak</text>
<rect x="838" y="308" width="308" height="64" rx="8" class="agent"/>
<rect x="838" y="318" width="5" height="44" rx="2" fill="#d64545"/>
<text x="995.0" y="335.0" class="ag" text-anchor="middle" >Policy rules</text>
<text x="995.0" y="359.0" class="ag" text-anchor="middle" >for each account</text>
<text x="992.0" y="412" class="lb" text-anchor="middle" >Nothing changed yet: a preview</text>
