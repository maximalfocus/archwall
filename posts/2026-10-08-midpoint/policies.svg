<text x="809.0" y="533" class="numt" text-anchor="middle" >3</text>
<text x="829.0" y="536" class="gt" text-anchor="start" >What it does</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Block</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >enforcement error · prune conflicts</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Ask a person</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >approval now · certification later</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#8a5cc7"/>
