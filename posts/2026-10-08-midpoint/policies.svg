<circle cx="155.0" cy="111" r="14" class="num"/>
<text x="155.0" y="117" class="numt" text-anchor="middle" >1</text>
<text x="175.0" y="120" class="gt" text-anchor="start" >Where the rule lives</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Global</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >system configuration · every operation</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Policy or metarole</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >reaches the roles that have it</text>
