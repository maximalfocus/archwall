<text x="903.0" y="775.0" class="ag" text-anchor="middle" >mark · notification · script</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >suspendTask stops a task</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >remediation: experimental</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="209.0" cy="527" r="14" class="num"/>
<text x="209.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="229.0" y="536" class="gt" text-anchor="start" >What is left</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Mark on the object</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >reports find who breaks a rule</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Approved exception</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >kept in the assignment · rule off</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >policySituation (4.8 and earlier):</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >deprecated · use marks</text>
