<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">midPoint policy rules</title>
<desc id="d">In: a change to a user, a role or an assignment. 1 Where the rule lives: global rules in the system configuration are checked on every operation; rules in a policy or metarole reach every role that has it assigned, through an inducement; since midPoint 4.11 rules can sit in a task activity too, for example to stop an import after a number of changes. A rule written straight into one role works but is not recommended. 2 When it fires, the constraints: conflicts, where exclusion keeps two roles apart (segregation of duties) and requirement needs them together; counts and changes, such as too few or too many assignees, or a change or new assignment; state, such as an object state or having an assignment. Constraints combine with and, or and not. 3 What it does, the actions: block, where enforcement ends the change in an error and prune removes the conflicting assignments; ask a person, an approval now or a certification campaign later; just record, with a mark, a notification or a script. suspendTask stops a task; remediation is experimental. 4 What is left: a mark on the object, so reports can find the objects that break a rule; an approved exception stored in the assignment, which turns the rule off for that user and that assignment; policySituation, used up to midPoint 4.8, is deprecated in favour of marks.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
