<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">midPoint overview</title>
<desc id="d">In: HR, apps and directories each hold part of who works here and what they may use. 1 Read the sources: connectors read the HR system, apps and directories; import, live sync and reconciliation bring changes in. Every account is linked to a user, never account to account. 2 Decide what should be: mappings turn account data into user data and back, roles give access, policy rules such as segregation of duties check it. 3 Govern: requests wait for approval, certification campaigns ask people to confirm or revoke access, and the audit trail and reports record it all. 4 Write it out: connectors create, change and delete accounts and groups on the targets; midPoint keeps a shadow that links to each account and stores its objects in a PostgreSQL repository.</desc>
