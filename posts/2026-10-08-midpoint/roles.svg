<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">How midPoint gives access</title>
<desc id="d">In: a user who needs access. 1 Assign: the user asks for a role in the role catalog and an approval follows, or midPoint assigns it on its own through an archetype, the org structure or an autoassign rule; an assignment can carry valid-from and valid-to dates. Orgs and services also act as roles. 2 Business role: groups the access one job needs; conditions and parameters let one role serve many places, and the relation (member, owner, approver) changes what it gives. Role mining suggests new business roles from existing access. 3 Application role: the access in one application, induced by business roles and not meant to be assigned directly; existing entitlements can be imported as application roles. Business role and application role are archetypes that ship with midPoint. 4 On the target: an inducement makes the account and puts an entitlement, such as a group, on it, in LDAP, Active Directory and other systems. Entitlements belong to accounts, not users.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
