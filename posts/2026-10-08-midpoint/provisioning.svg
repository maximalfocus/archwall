<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">How midPoint writes to a target system</title>
<desc id="d">In: the model decides that an account on a target system must be created, changed or deleted. 1 The resource: a resource definition names the connector and its settings; the resource schema lists the object classes and attributes the connector reads from the system; object types say which objects are accounts and which are entitlements such as groups. Capabilities are native to the resource or simulated by midPoint. 2 The shadow: midPoint keeps a shadow in its repository that links the user to the real account, groups are shadows too, and attributes are cached in the shadow (passive caching, on by default for new installations). 3 The connector does the work, one of three kinds: ConnId connectors such as the bundled LDAP, CSV and DatabaseTable connectors; the built-in manual connector, which opens a case for a person; or the built-in asynchronous connector (experimental), which sends a message to a queue. Changes can be grouped and sent together with operation grouping: a grouping interval on the resource and a propagation task. 4 Wait or retry: an operation that is not done yet, because the resource is down, a person still has to do it, or the resource is in maintenance mode (experimental) set by an admin, is kept in the shadow as a pending operation; a failed one is retried after 30 minutes, up to 3 times by default.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
