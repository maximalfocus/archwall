<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="209.0" cy="111" r="14" class="num"/>
<text x="209.0" y="117" class="numt" text-anchor="middle" >1</text>
<text x="229.0" y="120" class="gt" text-anchor="start" >The resource</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Resource definition</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >which connector · its settings</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Resource schema</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >object classes · attributes</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Object types</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >accounts · entitlements (groups)</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Capabilities: native, or simulated by midPoint</text>
