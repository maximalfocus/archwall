<text x="903.0" y="359.0" class="ag" text-anchor="middle" >kept in the shadow</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Caching: on by default for new installs</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="802.25" cy="527" r="14" class="num"/>
<text x="802.25" y="533" class="numt" text-anchor="middle" >3</text>
<text x="822.25" y="536" class="gt" text-anchor="start" >The connector</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >ConnId connectors</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >LDAP · CSV · DatabaseTable …</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Manual connector</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >opens a case for a person</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Async connector</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >queue message · experimental</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Optional grouping: an interval on the resource</text>
<text x="900.0" y="838" class="lb" text-anchor="middle" >plus a propagation task</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="202.25" cy="527" r="14" class="num"/>
<text x="202.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="222.25" y="536" class="gt" text-anchor="start" >Wait or retry</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >Pending operation</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >kept in the shadow</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >Retry</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >after 30 min · up to 3 times</text>
<rect x="54" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="751.0" class="ag" text-anchor="middle" >Maintenance mode</text>
<text x="303.0" y="775.0" class="ag" text-anchor="middle" >admin sets it · experimental</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >Manual: done when the case is closed</text>
