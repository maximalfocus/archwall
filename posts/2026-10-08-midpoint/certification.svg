<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Access certification in midPoint</title>
<desc id="d">In: a campaign template, started by hand, by a scheduled task, or by a policy rule for an ad-hoc campaign. 1 Define: the scope picks the objects and what to certify on them, such as users and their roles, with a filter; each pair is one case. Reviewers are the object's manager, the target's owner and the like, with a default reviewer as fallback. Each stage has a duration and an outcome rule. 2 Review a stage: reviewers decide each case: accept, revoke or reduce, or not decided or delegate; a case with no decision is no response. Before the deadline midPoint can notify and escalate. 3 Close the stage: the stage outcome by default is one accept accepts. Revoke and reduce stop the review; accepted and undecided cases go on to the next stage. Across stages the default is all must accept. 4 Carry it out: with automated remediation midPoint removes revoked access; otherwise it is report only and an admin acts. Unresolved cases can be reiterated, run again by hand unless a delay is set. Reports cover definitions, campaigns, cases and work items.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: a template · by hand · a schedule · a policy rule</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="249.5" cy="111" r="14" class="num"/>
<text x="249.5" y="117" class="numt" text-anchor="middle" >1</text>
<text x="269.5" y="120" class="gt" text-anchor="start" >Define</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Scope</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >e.g. users × their roles</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Reviewers</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >manager · owner · default</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="318" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="335.0" class="ag" text-anchor="middle" >Stages</text>
<text x="303.0" y="359.0" class="ag" text-anchor="middle" >duration · outcome rule</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >Each user × role pair is one case</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="795.5" cy="111" r="14" class="num"/>
<text x="795.5" y="117" class="numt" text-anchor="middle" >2</text>
<text x="815.5" y="120" class="gt" text-anchor="start" >Review a stage</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Keep or not</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >accept · revoke · reduce</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >Can't say</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >not decided · delegate</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >No answer</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >no response</text>
<text x="900.0" y="412" class="lb" text-anchor="middle" >Before the deadline: notify · escalate</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="788.75" cy="527" r="14" class="num"/>
<text x="788.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="808.75" y="536" class="gt" text-anchor="start" >Close the stage</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Stage outcome</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >default: one accept accepts</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#e8973a"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >Stop here</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >revoke · reduce</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Go on</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >accepted · undecided</text>
<text x="900.0" y="812" class="lb" text-anchor="middle" >Across stages, default: all must accept</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="209.0" cy="527" r="14" class="num"/>
<text x="209.0" y="533" class="numt" text-anchor="middle" >4</text>
<text x="229.0" y="536" class="gt" text-anchor="start" >Carry it out</text>
<rect x="54" y="560" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="570" width="5" height="40" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="585.0" class="ag" text-anchor="middle" >Automated remediation</text>
<text x="303.0" y="609.0" class="ag" text-anchor="middle" >removes revoked access</text>
<rect x="54" y="634" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="644" width="5" height="40" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="659.0" class="ag" text-anchor="middle" >Report only</text>
<text x="303.0" y="683.0" class="ag" text-anchor="middle" >otherwise · an admin acts</text>
<rect x="54" y="708" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="718" width="5" height="40" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="733.0" class="ag" text-anchor="middle" >Reiterate</text>
<text x="303.0" y="757.0" class="ag" text-anchor="middle" >unresolved cases · run again</text>
<rect x="54" y="782" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="792" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="303.0" y="807.0" class="ag" text-anchor="middle" >Reports</text>
<text x="303.0" y="831.0" class="ag" text-anchor="middle" >campaigns · cases · work items</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >cases</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >decisions</text>
<path d="M744 500V466" class="flow back"/>
<text x="744" y="488" class="al" text-anchor="middle" >next stage</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >outcomes</text>
</svg>
