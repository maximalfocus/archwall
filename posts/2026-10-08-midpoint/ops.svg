<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Running midPoint</title>
<desc id="d">In: an admin installs and runs midPoint. 1 Install: the distribution starts with bin/start.sh and listens on port 8080, the web app at /midpoint; the container image needs a database container next to it. The midpoint.home directory holds config.xml, keys, logs and connector files. 2 Set up the repository: config.xml points to a native PostgreSQL repository; the schema scripts create the main, audit and Quartz tables; when installed midPoint loads initial objects such as the administrator user and the Superuser role. 3 Run tasks: the task manager uses the Quartz scheduler with 10 worker threads per node by default; background tasks run live sync, reconciliation and import. In a cluster several nodes share one repository and take tasks first come, first served; clustered is false by default and must be set to true on every node. 4 Watch and maintain: reports in CSV, HTML or XLSX and dashboards; notifications by mail, SMS, file or a custom transport; midpoint.log and Spring Boot actuator endpoints such as health and metrics; and the ninja command-line tool to import, export and upgrade.</desc>
