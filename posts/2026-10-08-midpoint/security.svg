<rect x="654" y="574" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Request check</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >before mappings run</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
