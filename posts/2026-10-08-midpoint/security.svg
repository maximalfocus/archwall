<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">midPoint's own security</title>
<desc id="d">In: a person or a client calls midPoint through the web GUI, REST or the actuator endpoints. 1 Sign in: the security policy, global and from the user's organization and archetype merged, picks an authentication sequence for each channel; the sequence runs modules such as login form, LDAP, SAML, OIDC and TOTP. Passwords are encrypted with AES by default, or hashed; password reset has its own channel. 2 Check rights: authorization statements in roles allow or deny; what is not allowed is denied, and deny always wins. The GUI page or the service is checked first. A Superuser role holds one statement that allows everything. 3 Run the change: a request check runs before mappings and policies, an execution check after recompute, with all its effects. Expressions can run as another user or with full privileges. An attorney can act on another user's approval work items. 4 Record it: the audit trail writes a request record, an execution record and resource records; the shipped config.xml sends it to a PostgreSQL table and to the log file.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
