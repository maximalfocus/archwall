<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Security policy</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >global · org · archetype merged</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >Sequence</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >one per channel</text>
<rect x="54" y="308" width="492" height="64" rx="8" class="agent"/>
