<text x="900.0" y="812" class="lb" text-anchor="middle" >Attorney: act on another's work items</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="229.25" cy="527" r="14" class="num"/>
<text x="229.25" y="533" class="numt" text-anchor="middle" >4</text>
<text x="249.25" y="536" class="gt" text-anchor="start" >Record it</text>
<rect x="54" y="560" width="492" height="60" rx="8" class="agent"/>
<rect x="54" y="570" width="5" height="40" rx="2" fill="#5b6675"/>
<text x="303.0" y="585.0" class="ag" text-anchor="middle" >Request record</text>
<text x="303.0" y="609.0" class="ag" text-anchor="middle" >as the user asked</text>
