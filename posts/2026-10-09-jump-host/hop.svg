<rect x="24" y="16" width="1152" height="48" rx="24.0" class="human"/>
<text x="600.0" y="46.0" class="q" text-anchor="middle" >In: you need a shell on a server behind the jump host · pick one way</text>
<rect x="24" y="84" width="552" height="540" rx="12" class="grp"/>
<text x="300.0" y="120" class="gt" text-anchor="middle" >Pass straight through</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >Your laptop</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >ssh -J jump target</text>
<rect x="54" y="276" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="286" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="303.0" y="303.0" class="ag" text-anchor="middle" >Jump host</text>
<text x="303.0" y="327.0" class="ag" text-anchor="middle" >forwards bytes to target:22</text>
<rect x="54" y="404" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="414" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="303.0" y="431.0" class="ag" text-anchor="middle" >Target</text>
<text x="303.0" y="455.0" class="ag" text-anchor="middle" >you sign in here directly</text>
<path d="M300.0 212V274" class="flow"/>
<text x="300.0" y="250" class="al" text-anchor="middle" >SSH · asks for a tunnel</text>
<path d="M300.0 340V402" class="flow"/>
<text x="300.0" y="378" class="al" text-anchor="middle" >your own SSH session</text>
<text x="300.0" y="572" class="lb" text-anchor="middle" >The jump host must allow TCP forwarding</text>
<text x="300.0" y="598" class="lb" text-anchor="middle" >AWS's template turns it off by default</text>
<rect x="624" y="84" width="552" height="540" rx="12" class="grp"/>
<text x="900.0" y="120" class="gt" text-anchor="middle" >Log in, then hop</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >Your laptop</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >ssh jump</text>
<rect x="654" y="276" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="286" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="303.0" class="ag" text-anchor="middle" >Jump host</text>
<text x="903.0" y="327.0" class="ag" text-anchor="middle" >a shell · you run ssh target</text>
<rect x="654" y="404" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="414" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="431.0" class="ag" text-anchor="middle" >Target</text>
<text x="903.0" y="455.0" class="ag" text-anchor="middle" >signs in from the jump host</text>
<path d="M900.0 212V274" class="flow"/>
<text x="900.0" y="250" class="al" text-anchor="middle" >SSH · a shell</text>
<path d="M900.0 340V402" class="flow"/>
<text x="900.0" y="378" class="al" text-anchor="middle" >a second SSH session</text>
<text x="900.0" y="572" class="lb" text-anchor="middle" >Commands run here, so the jump host can log them</text>
<text x="900.0" y="598" class="lb" text-anchor="middle" >Agent forwarding: off by default, risky on</text>
<rect x="24" y="644" width="1152" height="240" rx="12" class="grp"/>
<text x="600.0" y="680" class="gt" text-anchor="middle" >On your laptop: ~/.ssh/config</text>
<rect x="54" y="708" width="531" height="64" rx="8" class="agent"/>
<rect x="54" y="718" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="322.5" y="735.0" class="ag" text-anchor="middle" >Many hops</text>
<text x="322.5" y="759.0" class="ag" text-anchor="middle" >-J a,b visits them in order</text>
<rect x="615" y="708" width="531" height="64" rx="8" class="agent"/>
<rect x="615" y="718" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="883.5" y="735.0" class="ag" text-anchor="middle" >Jump host settings</text>
<text x="883.5" y="759.0" class="ag" text-anchor="middle" >go in ~/.ssh/config</text>
<text x="600.0" y="832" class="lb" text-anchor="middle" >Options on the command line apply to the target, not to the jump hosts</text>
</svg>
