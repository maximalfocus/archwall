<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">AWS's reference Linux bastion</title>
<desc id="d">In: AWS's CloudFormation templates for Linux bastion hosts; a map of parts, not steps. Outside: by default no port is open and admins come in through AWS Session Manager; if you set an allowed address range, admins from it may use SSH on port 22, and ping. Public subnets in two availability zones: an Auto Scaling group runs 1 to 4 bastions, 1 by default; each gets an Elastic IP only when an address range is set; TCP and X11 forwarding are off by default. The new-VPC template also adds NAT gateways. Private subnets: your servers, which reach the internet through the NAT gateways; the bastions reach them by SSH. Logs: auditd writes the audit log on each bastion, and the CloudWatch agent copies it to a CloudWatch log group, one stream per instance ID.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
