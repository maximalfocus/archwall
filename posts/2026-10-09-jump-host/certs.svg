<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">SSH certificates for a jump host</title>
<desc id="d">In: many people and many servers; trust one certificate authority instead of copying each person's key around. 1 Set up a CA: a CA key signs user keys; sshd's TrustedUserCAKeys lists the CA, so the server trusts the CA, not each key. A certificate with no principals is refused. 2 Sign a user's key: ssh-keygen -s with the CA key signs the user's public key; -I sets a key ID that shows in the logs; -n names the principals, usually user names; -V sets when it is valid. 3 Sign in: the laptop offers the key and its certificate; sshd checks the CA signature, the name and the dates; the log line names the key ID, serial and CA. 4 Revoke: ssh-keygen -k writes a key revocation list; sshd's RevokedKeys refuses every key in it. If that file can't be read, all key logins are refused; replace it whole, never edit it in place.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC",sans-serif;fill:#1f2a37}
.gt{font-size:26px;font-weight:700}
.st{font-size:20px;font-weight:700}
.ag{font-size:20px}
.q{font-size:18px;fill:#3d4a5c}
.lb{font-size:17px;fill:#4a5565}
.al{font-size:16px;font-weight:600;fill:#3d4a5c;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
.grp{fill:#f2f5f9;stroke:#9aa4b2;stroke-width:1.6}
.sub{fill:#e8edf3;stroke:#b8c1cc;stroke-width:1.2}
.agent{fill:#ffffff;stroke:#b8c1cc;stroke-width:1.2}
.human{fill:#d6e6fb;stroke:#9cbbe6;stroke-width:1.2}
.front{fill:#dcf0e0;stroke:#9ccfa8;stroke-width:1.2}
.flow{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#arr)}
.back{stroke-dasharray:7 5}
.cyc{stroke:#5b6675;stroke-width:2;fill:none;marker-end:url(#ca)}
.num{fill:#1f2a37}
.numt{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<rect width="1200" height="900" rx="18" fill="#ffffff"/>
<rect x="24" y="16" width="552" height="48" rx="24.0" class="human"/>
<text x="300.0" y="46.0" class="q" text-anchor="middle" >In: trust one CA, not every person's key</text>
<path d="M300.0 64V82" class="flow"/>
<rect x="24" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="215.75" cy="111" r="14" class="num"/>
<text x="215.75" y="117" class="numt" text-anchor="middle" >1</text>
<text x="235.75" y="120" class="gt" text-anchor="start" >Set up a CA</text>
<rect x="54" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="158" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="175.0" class="ag" text-anchor="middle" >CA key</text>
<text x="303.0" y="199.0" class="ag" text-anchor="middle" >signs user keys</text>
<rect x="54" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="238" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="255.0" class="ag" text-anchor="middle" >TrustedUserCAKeys</text>
<text x="303.0" y="279.0" class="ag" text-anchor="middle" >sshd trusts the CA</text>
<text x="300.0" y="412" class="lb" text-anchor="middle" >A certificate with no principals is refused</text>
<rect x="624" y="84" width="552" height="380" rx="12" class="grp"/>
<circle cx="775.25" cy="111" r="14" class="num"/>
<text x="775.25" y="117" class="numt" text-anchor="middle" >2</text>
<text x="795.25" y="120" class="gt" text-anchor="start" >Sign a user's key</text>
<rect x="654" y="148" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="158" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="903.0" y="175.0" class="ag" text-anchor="middle" >ssh-keygen -s ca_key</text>
<text x="903.0" y="199.0" class="ag" text-anchor="middle" >signs the user's public key</text>
<rect x="654" y="228" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="238" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="255.0" class="ag" text-anchor="middle" >-I key ID</text>
<text x="903.0" y="279.0" class="ag" text-anchor="middle" >shows in the logs</text>
<rect x="654" y="308" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="318" width="5" height="44" rx="2" fill="#2f9e6e"/>
<text x="903.0" y="335.0" class="ag" text-anchor="middle" >-n names · -V validity</text>
<text x="903.0" y="359.0" class="ag" text-anchor="middle" >who it is for · until when</text>
<rect x="624" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="842.75" cy="527" r="14" class="num"/>
<text x="842.75" y="533" class="numt" text-anchor="middle" >3</text>
<text x="862.75" y="536" class="gt" text-anchor="start" >Sign in</text>
<rect x="654" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="574" width="5" height="44" rx="2" fill="#2f6fd6"/>
<text x="903.0" y="591.0" class="ag" text-anchor="middle" >Laptop</text>
<text x="903.0" y="615.0" class="ag" text-anchor="middle" >offers key and certificate</text>
<rect x="654" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="903.0" y="671.0" class="ag" text-anchor="middle" >sshd checks</text>
<text x="903.0" y="695.0" class="ag" text-anchor="middle" >CA signature · name · dates</text>
<rect x="654" y="724" width="492" height="64" rx="8" class="agent"/>
<rect x="654" y="734" width="5" height="44" rx="2" fill="#5b6675"/>
<text x="903.0" y="751.0" class="ag" text-anchor="middle" >Log line</text>
<text x="903.0" y="775.0" class="ag" text-anchor="middle" >key ID · serial · CA</text>
<rect x="24" y="500" width="552" height="364" rx="12" class="grp"/>
<circle cx="249.5" cy="527" r="14" class="num"/>
<text x="249.5" y="533" class="numt" text-anchor="middle" >4</text>
<text x="269.5" y="536" class="gt" text-anchor="start" >Revoke</text>
<rect x="54" y="564" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="574" width="5" height="44" rx="2" fill="#8a5cc7"/>
<text x="303.0" y="591.0" class="ag" text-anchor="middle" >ssh-keygen -k</text>
<text x="303.0" y="615.0" class="ag" text-anchor="middle" >writes a revocation list</text>
<rect x="54" y="644" width="492" height="64" rx="8" class="agent"/>
<rect x="54" y="654" width="5" height="44" rx="2" fill="#d64545"/>
<text x="303.0" y="671.0" class="ag" text-anchor="middle" >RevokedKeys</text>
<text x="303.0" y="695.0" class="ag" text-anchor="middle" >sshd refuses what is listed</text>
<text x="300.0" y="812" class="lb" text-anchor="middle" >File unreadable: every key login refused</text>
<text x="300.0" y="838" class="lb" text-anchor="middle" >Replace it whole, never edit in place</text>
<path d="M576 284H622" class="flow"/>
<text x="600" y="272" class="al" text-anchor="middle" >trusted CA</text>
<path d="M1054 464V498" class="flow"/>
<text x="1054" y="488" class="al" text-anchor="middle" >certificate</text>
<path d="M624 676H578" class="flow"/>
<text x="600" y="664" class="al" text-anchor="middle" >a key to stop</text>
</svg>
